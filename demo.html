// ============================================================
//  Day / week / month
//  cursor = the day being viewed (counted from 1970).
//  All three views share one cursor, so tapping a day in the month view lands on that same day.
// ============================================================
//  The two mode families do not see the same views.
//
//    Normal mode has no notion of "this session" -- cancelling one, moving a
//    room, odd/even weeks: none of it applies. So the timetable page is, for
//    normal mode, a strangely shaped empty grid. It gets a plain list instead
//    (the phone-clock kind), and lands on it by default.
//
//    For student / teacher the timetable page is already a list grouped by
//    day, so a second plain list would only turn four tabs into five.
var VIEWS_PLAIN = ["list", "day", "week", "month"];
var VIEWS_CLASS = ["day", "week", "month", "table"];
var VIEWS = ["list", "day", "week", "month", "table"];   // for validating what localStorage holds

function views(){ return modeCfg(S.mode).wk ? VIEWS_CLASS : VIEWS_PLAIN; }

// Each family remembers its own view: picking "list" in normal mode must not
// wipe out the "table" that student mode was sitting on.
function viewFam(){ return modeCfg(S.mode).wk ? "c" : "p"; }

// Which page this mode is actually on. If the remembered one does not belong
// to this mode, fall back to the first -- switching back from student mode
// must not strand you on a page that is not there.
function curView(){
  var vs = views();
  var v  = S.view[viewFam()];
  return vs.indexOf(v) >= 0 ? v : vs[0];
}

function curDay(){ return S.cursor === null ? idxOf(nowDev()) : S.cursor; }

// remember = false -> only a temporary switch (pressing "timetable only", say),
// so it must not overwrite the view the user picked
function setView(v, remember){
  var f = viewFam();
  S.view[f] = v;
  if(remember !== false){
    try { localStorage.setItem("clockView" + f, v); } catch(e){}
  }
  paintBody();
}

// Step back / forward (day = 1 day, week = 7 days, month = one month)
function moveView(dir){
  var c = curDay(), V = curView();
  if(V === "list")           return;                // a list has no prev / next
  if(V === "day")            S.cursor = c + dir;
  else if(V === "week" || V === "table") S.cursor = c + dir * 7;
  else {
    var p = idxParts(c);
    var mo = p.m - 1 + dir, y = p.y + Math.floor(mo / 12);
    mo = ((mo % 12) + 12) % 12;
    var dim = daysInMonth(y, mo + 1);
    S.cursor = dayIdx(y, mo + 1, Math.min(p.d, dim));
  }
  if(V === "week" || V === "table") S.selWeek = weekOf(S.cursor);
  paintBody();
}

function daysInMonth(y, m){
  return [31, (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 29 : 28,
          31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
}

function viewTabsHTML(){
  var cur = curView();
  return '<div class="vtabs" id="vTabs">' + views().map(function(v){
    return '<button data-v="' + v + '"' + (cur === v ? ' class="on"' : '') + '>' +
           t("v" + v.charAt(0).toUpperCase() + v.slice(1)) + '</button>';
  }).join("") + '</div>';
}

function viewNavHTML(title, sub){
  var isToday = (curDay() === idxOf(nowDev()));
  return '<div class="vnav">' +
    '<button data-vmove="-1">&#8249;</button>' +
    '<div class="vt">' + title + (sub ? '<small>' + sub + '</small>' : '') + '</div>' +
    (isToday ? '' : '<button class="today" data-vmove="0">' + t("today") + '</button>') +
    '<button data-vmove="1">&#8250;</button>' +
  '</div>';
}

// ---------- Single day ----------
function dayViewHTML(nextId){
  var i = curDay(), p = idxParts(i), w = weekOf(i);
  var list = shownOnDay(i, w);

  var h = viewNavHTML(WD(p.wd),
      p.y + "-" + pad(p.m) + "-" + pad(p.d) +
      (S.sem.enabled && w >= 1 && w <= S.sem.weeks ? "  " + t("wkShort", w) : ""));

  h += '<div class="dayhead">' +
         '<span class="big">' + p.d + '</span>' +
         '<span class="wd">' + WD(p.wd) + '</span>' + holiTagHTML(i) +
         (S.sem.enabled && w >= 1 && w <= S.sem.weeks
            ? '<span class="wk">' + t("wkShort", w) + '</span>' : '') +
       '</div>';

  h += '<div class="card">' +
       (list.length
          ? list.map(function(a){ return itemHTML(a, nextId, true, i); }).join("")
          : '<div class="empty"><div class="em">&#9749;</div><p>' + t("noClass") + '</p></div>') +
       '</div>';
  return h;
}

// ---------- Month ----------
function monthViewHTML(nextId){
  var cur = curDay(), p = idxParts(cur);
  var first = dayIdx(p.y, p.m, 1);
  var lead  = (idxParts(first).wd - S.sem.weekStart + 7) % 7;   // how many blanks to pad in front
  var start = first - lead;
  var todayI = idxOf(nowDev());

  var h = viewNavHTML(t("monthName", p.y, p.m), "");

  h += '<div class="mgrid">';
  h += '<div class="wh"></div>';                    // the week-number column gets an empty header
  for(var k = 0; k < 7; k++)
    h += '<div class="wh">' + WDS((S.sem.weekStart + k) % 7) + '</div>';

  var curW = curWeek();
  for(var row = 0; row < 6; row++){
    var rowStart = start + row * 7;

    // Skip the last row entirely when none of it is in this month
    if(row === 5 && idxParts(rowStart).m !== p.m) break;

    // Which week this row is (worked out from the day at its head)
    var rw  = weekOf(rowStart);
    var out = !S.sem.enabled || rw < 1 || rw > S.sem.weeks;
    h += '<div class="mwk' + (out ? " out" : (rw === curW ? " now" : "")) + '">' +
         (out ? "&middot;" : t("wkShort", rw)) + '</div>';

    for(var k2 = 0; k2 < 7; k2++){
      var i  = rowStart + k2;
      var dp = idxParts(i);
      var w    = weekOf(i);
      var list = shownOnDay(i, w);
      var cls  = "mcell" +
                 (holidayName(i) ? " holi" : "") +
                 (dp.m !== p.m ? " dim" : "") +
                 (i === todayI ? " today" : "") +
                 (i === cur ? " sel" : "") +
                 (dp.wd === 0 || dp.wd === 6 ? " wknd" : "");

      h += '<button class="' + cls + '" data-vday="' + i + '">' +
             '<span class="dn">' + dp.d + '</span>' +
             (list.length
               ? '<span class="dots">' +
                   list.slice(0, 4).map(function(a){
                     return '<i class="' + (a.enabled ? "" : "off") + '"></i>'; }).join("") +
                 '</span>' +
                 (list.length > 4 ? '<span class="more">+' + (list.length - 4) + '</span>' : '')
               : '') +
           '</button>';
    }
  }
  h += '</div>';

  // Then list what is on the selected day
  var sp = idxParts(cur), sl = shownOnDay(cur, weekOf(cur));
  h += '<div class="mday"><h4>' + WD(sp.wd) + '  ' + sp.d + '/' + sp.m + '</h4>' +
       '<div class="card">' +
       (sl.length
          ? sl.map(function(a){ return itemHTML(a, nextId, true, cur); }).join("")
          : '<div class="empty" style="padding:26px"><p>' + t("noClass") + '</p></div>') +
       '</div></div>';
  return h;
}

// ---------- Which class is off this week ----------

// What kind of one-off event it is. This is the "reminder" half --

// ---------- Picking a date by "week number + weekday" ----------
// That is how people say it for make-up classes and exams: "week 5, Monday", not 2026-09-14.
// The date field stays authoritative; these two menus only fill it in, and the two always agree.
function paintWkPick(){

  var w = $("edPickW"), d = $("edPickD"), i, h;

  for(i = 1; i <= S.sem.weeks; i++)
    h += '<option value="' + i + '">' + esc(t("wkShort", i)) + '</option>';

// Lecture / Tutorial / Practical ... recognised from the name.
// Timetables are already written as "EM Lecture" / "MicroP Lab", so the name is the best signal.
var CLASS_KINDS = [
  { id:"lecture",   tx:"kLecture",   words:["lecture", "lect", "讲课", "课堂"] },
  { id:"tutorial",  tx:"kTutorial",  words:["tutorial", "tut", "辅导", "习题"] },
  { id:"practical", tx:"kPractical", words:["practical", "lab", "prac", "实验", "实作"] }
];

function kindOf(a){
  var lb = String(a.label || "").toLowerCase();
  for(var i = 0; i < CLASS_KINDS.length; i++)
    for(var j = 0; j < CLASS_KINDS[i].words.length; j++)
      if(lb.indexOf(CLASS_KINDS[i].words[j]) >= 0) return CLASS_KINDS[i].id;
  return null;
}

// Strip the kind out of the name; what is left is the subject.
//   "EM Lecture" -> "EM"      "MicroP Lab" -> "MicroP"
// If no kind is recognised, the whole name is the subject.
var SUBJ_TRIM = " :-_,/()（）：，、";

function subjectOf(a){
  var raw = String(a.label || "").trim();
  var k   = kindOf(a);
  if(!k) return raw;

  // Longest first, so "lecture" is not half-eaten by "lect"
  var words = CLASS_KINDS.filter(function(x){ return x.id === k; })[0].words
                .slice().sort(function(x, y){ return y.length - x.length; });
  var out = raw;
  for(var i = 0; i < words.length; i++){
    var at = out.toLowerCase().indexOf(words[i]);
    if(at >= 0){ out = out.slice(0, at) + " " + out.slice(at + words[i].length); break; }
  }

  out = out.replace(/  +/g, " ").trim();
  while(out && SUBJ_TRIM.indexOf(out.charAt(out.length - 1)) >= 0) out = out.slice(0, -1).trim();
  while(out && SUBJ_TRIM.indexOf(out.charAt(0)) >= 0)              out = out.slice(1).trim();
  return out || raw;
}

// Group by subject (in first-seen order). One-off events are not subjects.
function subjectGroups(){
  var order = [], map = {};
  mine().forEach(function(a){
    if(a.days === 0) return;
    var key = subjectOf(a);
    if(!map[key]){ map[key] = []; order.push(key); }
    map[key].push(a);
  });
  return order.map(function(k){ return { name: k, list: map[k] }; });
}

function ofKind(id){ return mine().filter(function(a){ return kindOf(a) === id; }); }

// What one row looks like (shared by the subject row and the kind rows under it)
function kindRowHTML(cls, attrs, name, cnt, on){
  return '<button class="kindrow ' + cls + (on ? " on" : "") + '" ' + attrs + '>' +
           '<span class="knm">' + esc(name) + '</span>' +
           '<span class="kct">' + esc(t("kCount", cnt)) + '</span>' +
           '<span class="kst">' + esc(t(on ? "kOn" : "kOff")) + '</span>' +
         '</button>';
}

// The user's words: "some subjects cancel default, can you split by subject and then
// within the subject by lecture, tutorial, practical" --
// it used to be one blunt switch ("all Tutorials are normally off"), which was far too coarse:
// EM's tutorial runs every week and MicroP's does not; they are different things.
function paintKinds(){
  var box = $("kindList");
  if(!box) return;

  var gs = subjectGroups();
  if(!gs.length){ box.innerHTML = '<div class="uphint">' + esc(t("kNone")) + '</div>'; return; }

  box.innerHTML = gs.map(function(g){
    var on = g.list.some(defOnOf);      // one session being "normally on" makes the subject on by default
    var h  = kindRowHTML("subj", 'data-subj="' + esc(g.name) + '"',
                         g.name, g.list.length, on);

    // How many kinds this subject has. With only one there is no need for a second level (the subject row is enough)
    var kinds = CLASS_KINDS.map(function(k){ return k.id; }).concat([""]);
    var groups = kinds.map(function(kid){
      return { kid: kid,
               list: g.list.filter(function(a){ return (kindOf(a) || "") === kid; }) };
    }).filter(function(x){ return x.list.length; });

    if(groups.length > 1) groups.forEach(function(x){
      var kt = x.kid ? t(CLASS_KINDS.filter(function(k){ return k.id === x.kid; })[0].tx)
                     : t("kOther");
      h += kindRowHTML("kid",
             'data-subj="' + esc(g.name) + '" data-kind="' + x.kid + '"',
             kt, x.list.length, x.list.some(defOnOf));
    });
    return h;
  }).join("");
}

// Tapping the subject row flips the whole subject; tapping a row under it flips only that kind
$("kindList") && ($("kindList").onclick = function(e){
  var b = e.target.closest("[data-subj]");
  if(!b) return;

  var g = subjectGroups().filter(function(x){ return x.name === b.dataset.subj; })[0];
  if(!g) return;

  var list = g.list, what = g.name;
  if(b.dataset.kind !== undefined && b.dataset.kind !== null){
    var kid = b.dataset.kind;
    list = list.filter(function(a){ return (kindOf(a) || "") === kid; });
    var kk = CLASS_KINDS.filter(function(k){ return k.id === kid; })[0];
    what = g.name + " " + (kk ? t(kk.tx) : t("kOther"));
  }
  if(!list.length) return;

  var want = !list.some(defOnOf);      // currently on -> turn off, and vice versa

  list.forEach(function(a){ a.defOn = want; });
  paintKinds(); paintOffList(); paintBody();

// ============================================================
//  Change room / venue
//
//  The user's own words: "sometimes the class moves, some permanently, some briefly,
//  maybe for two weeks at this venue"
//
//  Those are two different things, so there are two paths:
//    permanent -> just change that class's venue on the timetable (no extra record kept)
//    temporary -> store one {id, from, to, note}, which overrides only for that span
//
//  Why not one record per day: moving for two weeks would be a dozen records, and undoing it a dozen deletes.
//  One date range is one record, and cancelling it is one delete.
// ============================================================

// Where this class actually meets on this day
function roomOf(a, dayI){
  if(dayI !== undefined && dayI !== null && S.rooms && S.rooms.length){
    var iso = isoOf(dayI);
    // Later entries win (if the same span was changed twice, the newest counts)
    for(var i = S.rooms.length - 1; i >= 0; i--){
      var r = S.rooms[i];
      if(r.id === a.id && iso >= r.from && iso <= r.to) return r.note || "";
    }
  }
  return a.note || "";
}

// Does this class currently have a temporary venue? (returns that record)
function roomOverride(a, dayI){
  if(dayI === undefined || dayI === null) return null;
  var iso = isoOf(dayI);
  for(var i = S.rooms.length - 1; i >= 0; i--){
    var r = S.rooms[i];
    if(r.id === a.id && iso >= r.from && iso <= r.to) return r;
  }
  return null;
}


// ============================================================
//  The holiday list: reading one in, and the built-in one
//
//  Same stance as importing a timetable: text yes, pictures no. The cost of
//  OCR is written up in docs/REQUIREMENTS.md (T8) and has not changed.
//
//  But a timetable is personal and a public holiday list is not -- one
//  university shares one. So UTAR's 2026 list is typed in below and is one
//  tap away. The user wanted the RESULT (holidays in the app), not the
//  MEANS (uploading a picture), and this time the result is cheap to give.
// ============================================================

// UTAR public holidays 2026, copied from the official table.
// Changing year does not need a code change -- use the paste box.
var UTAR_2026 = [
  ["2026-01-01", "New Year"],
  ["2026-02-01", "Thaipusam"],
  ["2026-02-02", "Replacement holiday"],
  ["2026-02-17", "Chinese New Year"],
  ["2026-02-18", "Chinese New Year"],
  ["2026-03-07", "Nuzul Al-Quran"],
  ["2026-03-20", "Hari Raya (additional)"],
  ["2026-03-21", "Hari Raya Aidilfitri"],
  ["2026-03-22", "Hari Raya Aidilfitri"],
  ["2026-03-23", "Hari Raya (replacement)"],
  ["2026-05-01", "Labour Day"],
  ["2026-05-27", "Hari Raya Qurban"],
  ["2026-05-31", "Wesak Day"],
  ["2026-06-01", "Agong's Birthday"],
  ["2026-06-02", "Replacement holiday"],
  ["2026-06-17", "Awal Muharram"],
  ["2026-08-25", "Prophet's Birthday"],
  ["2026-08-31", "National Day"],
  ["2026-09-16", "Malaysia Day"],
  ["2026-11-06", "Sultan Perak Birthday"],
  ["2026-11-08", "Deepavali"],
  ["2026-11-09", "Replacement holiday"],
  ["2026-12-11", "Sultan Selangor Birthday"],
  ["2026-12-25", "Christmas"]
];

function utarList(){
  return UTAR_2026.map(function(r){ return { date:r[0], name:r[1] }; });
}

// Table noise, not part of a holiday's name: the row number, the weekday
// column, the state column. Left in, a name comes out as "Thursday New Year All".
var HOLI_NOISE = /^(\d+|all|semenanjung|w\.?p\.?|mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun|monday|tuesday|wednesday|thursday|friday|saturday|sunday|johor|kedah|kelantan|melaka|malacca|negeri sembilan|pahang|penang|pulau pinang|perak|perlis|sabah|sarawak|selangor|terengganu|kuala lumpur|labuan|putrajaya|星期[一二三四五六日天]|週[一二三四五六日]|周[一二三四五六日]|礼拜[一二三四五六日])$/i;

// One line -> { date, name }, or null when there is no date in it.
//
// Handles the shapes a PDF table actually pastes as:
//   1  01/01/2026  Thursday  New Year  All
//   01/01/2026 New Year
//   2026-01-01,New Year
//   17/2/2026	Chinese New Year
function parseHoliLine(line){
  var raw = String(line).replace(/　/g, " ").trim();
  if(!raw || raw.charAt(0) === "#") return null;

  var iso = "", m;

  // YYYY-MM-DD first, DD/MM/YYYY second. The other way round, the "01-01"
  // inside 2026-01-01 gets eaten by the second pattern and the year is wrong.
  if((m = raw.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){
    iso = m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]);
  } else if((m = raw.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))){
    iso = m[3] + "-" + pad(+m[2]) + "-" + pad(+m[1]);   // Malaysian order: day/month/year
  } else {
    return null;
  }
  if(!/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(iso)) return null;

  // The name is the longest thing left once the date is out of the way
  var rest = raw.replace(m[0], " ");
  var parts = rest.split(/\t|,|;|\s{2,}/).map(function(x){
    return x.replace(/^["\s]+|["\s]+$/g, "");
  }).filter(function(x){ return x && !HOLI_NOISE.test(x); });

  // A line separated by single spaces ("01/01/2026 New Year") does not split
  // above, so peel the row number and the weekday off word by word instead.
  if(parts.length <= 1){
    var one = (parts[0] || rest).trim().split(/\s+/);
    while(one.length > 1 && HOLI_NOISE.test(one[0]))              one.shift();
    while(one.length > 1 && HOLI_NOISE.test(one[one.length - 1])) one.pop();
    parts = [one.join(" ")];
  }

  var name = parts.sort(function(a, b){ return b.length - a.length; })[0] || "";
  return { date: iso, name: name.slice(0, 32) };
}

// A whole block of text -> { list, bad }. bad holds the lines that made no
// sense, so the sheet can say so instead of dropping them silently.
function parseHolidays(text){
  var list = [], bad = [], seen = {};
  String(text || "").split(/\r?\n/).forEach(function(line, i){
    if(!line.trim() || line.trim().charAt(0) === "#") return;
    var h = parseHoliLine(line);
    if(!h){ bad.push({ n:i + 1, tx:line.trim() }); return; }
    if(seen[h.date]) return;                 // the same day written twice keeps the first
    seen[h.date] = 1;
    list.push(h);
  });
  list.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  return { list: list, bad: bad };
}

var ROOM_HOWS = [
  { id:"once", tx:"rmOnce", days:1  },
  { id:"w2",   tx:"rmW2",   days:14 },
  { id:"w4",   tx:"rmW4",   days:28 },
  { id:"sem",  tx:"rmSem",  days:0  },   // 0 = through to the last day of the semester
  { id:"perm", tx:"rmPerm", days:-1 }    // -1 = change the timetable itself
];

// Which day this choice actually runs through
function roomEndIdx(how, startI){
  var h = ROOM_HOWS.filter(function(x){ return x.id === how; })[0] || ROOM_HOWS[1];
  if(h.days < 0) return null;                       // permanent
  if(h.days === 0){
    if(!S.sem.enabled) return startI + 27;          // no semester set, so treat it as four weeks
    var last = weekFirstDay(S.sem.weeks) + 6;
    return Math.max(last, startI);
  }
  return startI + h.days - 1;
}

// ---------- Move just this one ----------
//
// What about a teacher saying "an hour later today" / "an extra class this week"?
//
// Decision: no separate "single override" data structure. Moving the time =
//   1. mark the original session cancelled on that day (an existing mechanism)
//   2. add a "once only" alarm on that day at the new time (an existing mechanism)
//
// The payoff: not one line of firmware changes, and it is legible and reversible --
// the week view shows the original struck through with a new one beside it.
function moveOccurrence(a, dayI, hh, mm){
  var iso = isoOf(dayI);

  // 1. the original session does not count on this day
  S.skips[skipKey(a.id, iso)] = 1;

  return api("/api/skips", {
    method: "POST",
    body: JSON.stringify({ id: a.id, date: iso, skip: true })
  }).then(function(){
    // 2. add a one-off on that day
    return api("/api/alarms", {
      method: "POST",
      body: JSON.stringify({
        hour: hh, minute: mm,
        days: 0,                       // 0 = rings once
        date: iso,
        leads: leadList(a).slice(),
        weekRule: 0,
        channels: a.channels,
        owner: a.owner,
        enabled: true,
        defOn: true,
        label: a.label,
        note: a.note
      })
    });
  }).then(function(){
    return pullAlarms();
  }).then(function(){
    paintBody();
    toast(t("occMoved", pad(hh) + ":" + pad(mm)));
  }).catch(function(){
    delete S.skips[skipKey(a.id, iso)];
    paintBody();
    toast(t("tSaveFail"));
  });
}

// Ask for the new time. prompt() is deliberate -- building another sheet for something
// used twice a semester is not worth it, and prompt brings up the system keyboard on a phone.
$("occMove").onclick = function(){
  var a = S.occ.a, dayI = S.occ.day;
  var now = pad(a.hour) + ":" + pad(a.minute);
  var v = null;
  try{ v = prompt(t("occMoveAsk", esc0(a.label || t("alarm")), now), now); }catch(e){}
  if(v === null) return;

  var m = String(v).trim().match(/^(\d{1,2})\s*[:：.]\s*(\d{2})$/);
  if(!m){ toast(t("occMoveBad")); return; }
  var hh = parseInt(m[1], 10), mm = parseInt(m[2], 10);
  if(hh > 23 || mm > 59){ toast(t("occMoveBad")); return; }
  if(hh === a.hour && mm === a.minute){ toast(t("occMoveSame")); return; }

  closeSheets();
  moveOccurrence(a, dayI, hh, mm);
};

// prompt cannot contain HTML, so an unescaped version is needed
function esc0(x){ return String(x == null ? "" : x); }

// ---------- Minutes early: several are allowed ----------
// e.g. pick 10 and 5, and it rings 10 minutes before class and again 5 minutes before.
// Pick only one and it rings once -- the default behaviour is unchanged.
var LEAD_MAX = 240, MAX_LEADS = 3;
var LEAD_PRESETS = [0, 5, 10, 15, 20, 30, 45, 60];

function leadsOf(w){ return w === "im" ? S.imLeads : S.leads; }

function setLeads(w, arr){
  // De-duplicate, cap, and sort largest first (whatever rings first goes first)
  var seen = {}, out = [];
  arr.forEach(function(v){
    v = Math.max(0, Math.min(LEAD_MAX, parseInt(v, 10) || 0));
    if(!seen[v]){ seen[v] = 1; out.push(v); }
  });
  out.sort(function(a, b){ return b - a; });
  out = out.slice(0, MAX_LEADS);
  if(!out.length) out = [0];
  if(w === "im") S.imLeads = out; else S.leads = out;
}

// Tapping a chip. The default is "replace with this one", not "add one" --
// the user was explicit: choosing 10 minutes should mean 10 minutes and nothing else.
// Two or more requires turning on the "multiple reminders" switch above.
function pickLead(w, v){
  if(S.multi[w]) toggleLead(w, v);   // multi mode: a tap adds/removes
  else           setLeads(w, [v]);   // single mode: a tap makes it the only one
}

// Turn multi mode on / off. Turning it off keeps only the earliest (largest) lead.
function setMulti(w, on){
  S.multi[w] = !!on;
  if(!on){
    var cur = leadsOf(w);
    if(cur.length > 1) setLeads(w, [cur[0]]);
  }
}

function toggleLead(w, v){
  var cur = leadsOf(w).slice(), i = cur.indexOf(v);
  if(i >= 0){
    if(cur.length > 1) cur.splice(i, 1);   // at least one has to remain
  } else {
    if(cur.length >= MAX_LEADS) cur.pop(); // full, so drop the smallest
    cur.push(v);
  }
  setLeads(w, cur);
}

function buildLeadChips(w, chipsId, onChange){
  var box = $(chipsId);
  box.innerHTML = "";
  LEAD_PRESETS.forEach(function(v){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = v === 0 ? t("cOnTime") : (v === 60 ? t("cHour") : t("cMin", v));
    b.onclick = function(){ pickLead(w, v); onChange(); };
    box.appendChild(b);
  });
}

function paintLeadChips(w, chipsId){
  var cur = leadsOf(w), bs = $(chipsId).children;
  for(var i = 0; i < LEAD_PRESETS.length; i++)
    bs[i].classList.toggle("on", cur.indexOf(LEAD_PRESETS[i]) >= 0);
}

// Type a number that is not among the quick picks
function addCustomLead(w, inputId, onChange){
  var v = parseInt($(inputId).value, 10);
  if(isNaN(v) || v < 0 || v > LEAD_MAX){ toast(t("leadBad")); return; }
  pickLead(w, v);            // single mode -> replace with this; multi mode -> add one
  $(inputId).value = "";
  onChange();
}

// A number still sitting in the box when Save is pressed, with + never tapped -- that counts too, do not drop it.
// (This is exactly what made someone think "I typed 10 and it still says 15")
function flushTypedLead(w, inputId){
  var raw = ($(inputId).value || "").trim();
  if(!raw) return;
  var v = parseInt(raw, 10);
  if(isNaN(v) || v < 0 || v > LEAD_MAX) return;
  if(leadsOf(w).indexOf(v) < 0) pickLead(w, v);
  $(inputId).value = "";
}

function hhmm(m){ while(m < 0) m += 1440; return pad(Math.floor(m/60)) + ":" + pad(m%60); }

// Live hint in the edit sheet: the times it will actually ring (every lead listed)
function paintMulti(w, btnId){
  var on = S.multi[w];
  $(btnId).classList.toggle("on", on);
  $(btnId).textContent = t(on ? "leadMultiOn" : "leadMultiOff");
}

// The end-time hint. If it is wrong (earlier than the start, or over four hours), say so rather than swallowing it.
function syncEnd(){
  var box = $("edEndHint");
  if(!box) return;
  var d = durFromInputs();
  if(d === null){ box.innerHTML = ""; return; }
  box.innerHTML = d > 0 ? esc(t("endHint", $("edEnd").value))
                        : '<span class="warn">' + esc(t("endBad")) + '</span>';
}

// Two time boxes -> a duration in minutes. No end time returns null; a bad one returns 0.
function durFromInputs(){
  var a = $("edTime").value.split(":"), b = $("edEnd").value.split(":");
  if(b.length !== 2 || !$("edEnd").value) return null;
  if(a.length !== 2) return null;
  var s0 = parseInt(a[0],10)*60 + parseInt(a[1],10);
  var e0 = parseInt(b[0],10)*60 + parseInt(b[1],10);
  if(isNaN(s0) || isNaN(e0)) return null;
  var d = e0 - s0;
  if(d < 0) d += 1440;
  return (d === 0 || d > 240) ? 0 : d;
}

$("edEnd").onchange = syncEnd;

function syncLead(){
  syncEnd();
  paintMulti("ed", "edMulti");
  paintLeadChips("ed", "edLeadChips");

  var hm  = $("edTime").value.split(":");
  var box = $("edLeadHint");
  if(hm.length !== 2){ box.innerHTML = ""; return; }

  var evt = parseInt(hm[0],10) * 60 + parseInt(hm[1],10);
  if(isNaN(evt)){ box.innerHTML = ""; return; }

  var cur   = leadsOf("ed");
  var cross = false;
  var times = cur.map(function(v){
    if(evt - v < 0) cross = true;
    return hhmm(evt - v) + (v ? " (" + v + ")" : "");
  });

  box.innerHTML = (cur.length === 1 && cur[0] === 0)
      ? t("hintOnTime", hhmm(evt))
      : t("hintLeads", hhmm(evt), times.join(" &middot; "), cur.length) +
        (cross ? ' <span class="warn">' + t("dayBefore") + '</span>' : "");
}

function onImLead(){
  paintMulti("im", "imMulti");
  paintLeadChips("im", "imLeadChips");
  paintPrev();
}

    $("edTime").value  = pad(a.hour) + ":" + pad(a.minute);

    $("edLead").value = "";

    S.ev = (preset && preset.ev) || "";
    $("edWeekRule").value = "0";

           : (cfg.wk ? WEEKDAYS : EVERYDAY);
  }
  paintDays();
  paintEv();
  paintCh();
  syncLead();
  openSheet("sheetEdit");
}

// ---------- Timetable parser ----------
var DAYMAP = {
  "日":0,"天":0,"sun":0,"7":0,"0":0,
  "一":1,"mon":1,"1":1,
  "二":2,"tue":2,"2":2,
  "三":3,"wed":3,"3":3,
  "四":4,"thu":4,"4":4,
  "五":5,"fri":5,"5":5,
  "六":6,"sat":6,"6":6
};

function parseDays(tok){
  var t = tok.toLowerCase().replace(/星期|周|礼拜/g, "");
  if(/每天|everyday|daily|all/.test(t)) return EVERYDAY;
  if(/工作日|weekday|上课日/.test(t))   return WEEKDAYS;
  if(/周末|weekend/.test(t))            return WEEKEND;
  if(/一次|once/.test(t))               return 0;

  var mask = 0, ok = false;
  // Support ranges like "一-五" / "1-5"
  var range = t.match(/^(.+?)[-~](.+)$/);
  if(range && DAYMAP[range[1]] !== undefined && DAYMAP[range[2]] !== undefined){
    var s = DAYMAP[range[1]], e = DAYMAP[range[2]];
    for(var k=0;k<7;k++){
      var d = (s + k) % 7;
      mask |= (1 << d);
      if(d === e) break;
    }
    return mask;
  }
  // "一,三,五" / "一三五" / "mon tue"
  t.split(/[,，、\s\/]+/).forEach(function(p){
    if(!p) return;
    if(DAYMAP[p] !== undefined){ mask |= 1 << DAYMAP[p]; ok = true; return; }
    p.split("").forEach(function(c){
      if(DAYMAP[c] !== undefined){ mask |= 1 << DAYMAP[c]; ok = true; }
    });
  });
  return ok ? mask : -1;
}

// Split one line into fields. A CSV quote can contain commas ("1,3,5,7,9,11,13"),
// so a plain split(",") will not do -- follow the CSV rules.
function splitDelim(line, delim){
  if(delim === "MULTISPACE") return line.split(/\s{2,}/).map(function(c){ return c.trim(); });
  if(delim === "\t")         return line.split("\t").map(function(c){ return c.trim(); });

  var out = [], cur = "", inQ = false;
  for(var i = 0; i < line.length; i++){
    var c = line.charAt(i);
    if(inQ){
      if(c === '"'){
        if(line.charAt(i + 1) === '"'){ cur += '"'; i++; }   // "" = one quote
        else inQ = false;
      } else cur += c;
    }
    else if(c === '"')   inQ = true;
    else if(c === delim){ out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(function(c){ return c.trim(); });
}

// Only a single-day mask (a power of 2) counts as a weekday column
function isSingleDay(m){ return m > 0 && (m & (m - 1)) === 0; }

// ---------- Time: handles 24-hour, AM/PM, and ranges ----------
// "08:00", "8:00", "10:00 AM", "1:00 PM", "10:00 AM - 11:00 AM" (takes the start time)
function parseClock(str){
  // In English the AM/PM follows the time (10:00 AM);
  // in Chinese the marker comes first (下午 2:30) -- catch both
  var m = String(str).match(
    /(上午|下午|早上|晚上|凌晨|中午)?\s*(\d{1,2})\s*[:：.]\s*(\d{2})\s*(a\.?\s*m\.?|p\.?\s*m\.?|上午|下午|早上|晚上)?/i);
  if(!m) return null;

  var h = parseInt(m[2], 10), mi = parseInt(m[3], 10);
  if(mi > 59) return null;

  var ap = (m[1] || m[4] || "").toLowerCase().replace(/[.\s]/g, "");
  if(ap){
    var isPm = (ap.charAt(0) === "p" || ap === "下午" || ap === "晚上" || ap === "中午");
    if(h > 12) return null;
    if(isPm  && h !== 12) h += 12;      // 1 PM  -> 13
    if(!isPm && h === 12) h  = 0;       // 12 AM -> 00
  }
  if(h > 23) return null;
  return { h:h, mi:mi, idx:m.index, len:m[0].length };
}

// ---------- Week column: turn "1-14" / "1,3,5,7,9,11,13" into a week rule ----------
// 0 = every week, 1 = odd weeks only, 2 = even weeks only
function parseWeeks(str){
  var s = String(str || "").trim();
  if(!s) return 0;

  var nums = [];
  s.split(/[,，、\s]+/).forEach(function(part){
    var r = part.match(/^(\d{1,2})\s*[-~]\s*(\d{1,2})$/);
    if(r){
      for(var k = +r[1]; k <= +r[2] && k <= 60; k++) nums.push(k);
    } else if(/^\d{1,2}$/.test(part)) nums.push(+part);
  });
  if(nums.length < 2) return 0;

  var odd = nums.every(function(n){ return n % 2 === 1; });
  var evn = nums.every(function(n){ return n % 2 === 0; });
  return odd ? 1 : (evn ? 2 : 0);
}

// ---------- Format zero: a table with "Day / Time" columns ----------
// The kind a university portal produces, one row per class:
//   No | Unit | Description | Type | Group | Day | Time
//   1  | UGEA2263 | INTRODUCTORY ELECTROMAGNETICS | T | 1 | Mon | 10:00 AM - 11:00 AM
// Some classes wrap onto a second row (only Day + Time), which reuses the previous row's subject name.
var COL_PATTERNS = {
  day  : /^(day|days|星期|日期|上课日)$/i,
  time : /^(time|times|时间|上课时间|时段)$/i,
  label: /^(description|subject|course|unit name|class|科目|课程|课程名称)$/i,
  code : /^(unit|code|unit code|课号|科目代号)$/i,
  room : /^(room|venue|location|地点|教室|课室)$/i,
  weeks: /^(week|weeks|week no|週次|周次|教学週)$/i
};

function parseColumns(text){
  var raw = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
  if(raw.length < 2) return null;

  var delim = raw[0].indexOf("\t") >= 0 ? "\t"
            : raw[0].indexOf(",")  >= 0 ? ","
            : raw[0].indexOf("|")  >= 0 ? "|" : null;
  if(!delim) return null;

  var cells = raw.map(function(r){ return splitDelim(r, delim); });

  // Find the header: it only counts as this format if both "Day" and "Time" columns exist
  var hi = -1, col = null;
  for(var i = 0; i < Math.min(cells.length, 6); i++){
    var m = {};
    for(var j = 0; j < cells[i].length; j++){
      var v = cells[i][j];
      for(var k in COL_PATTERNS)
        if(m[k] === undefined && COL_PATTERNS[k].test(v)) m[k] = j;
    }
    if(m.day !== undefined && m.time !== undefined){ hi = i; col = m; break; }
  }
  if(hi < 0) return null;

  var out = [], lastLabel = "", lastNote = "", lastWeeks = 0;

  for(var r = hi + 1; r < cells.length; r++){
    var row = cells[r];
    var pick = function(idx){ return idx === undefined ? "" : (row[idx] || "").trim(); };

    var days = parseDays(pick(col.day));
    var tCell = pick(col.time);
    var tm    = parseClock(tCell);
    if(!isSingleDay(days) || !tm) continue;     // no class on this row

    // "10:00 AM - 11:00 AM" -- a second time after it is the end time.
    // The timetable view needs it to draw "from X to Y"; without it only the start shows.
    var dur = 0, t2 = parseClock(tCell.slice(tm.idx + tm.len));
    if(t2){
      dur = (t2.h * 60 + t2.mi) - (tm.h * 60 + tm.mi);
      if(dur < 0) dur += 1440;                  // crossed midnight
      if(dur > 240) dur = 0;                    // over four hours is almost certainly a parse error
    }

    // Subject name: use this row's if it has one, otherwise carry the previous row's (a wrapped second line)
    var label = pick(col.label) || pick(col.code);
    var code  = pick(col.code);
    var room  = pick(col.room);
    var wks   = col.weeks !== undefined ? parseWeeks(pick(col.weeks)) : 0;

    if(label){ lastLabel = label; lastNote = room || code; lastWeeks = wks; }
    else     { label = lastLabel; room = room || lastNote; wks = wks || lastWeeks; }
    if(!label) continue;

    out.push({
      hour: tm.h, minute: tm.mi, days: days, dur: dur,
      label: label, note: room || code || "",
      weekRule: wks, enabled: true
    });
  }
  return out.length ? out : null;
}

// A header cell has to be *only* a weekday, with nothing else attached.
// Otherwise "一,三,五 10:30 English" gets split on the commas and
// "一" and "三" are taken as two header columns, wrecking the whole table.
function headerDay(v){
  var s = (v || "").trim();
  if(!s || s.length > 12) return -1;   // "五 10:30 English" is too long to be a header
  if(/[:：]/.test(s))      return -1;   // a time in it means it is not a header
  var d = parseDays(s);
  return isSingleDay(d) ? d : -1;
}

// Split "Maths @ A101" / "Maths(A101)" / "数学（A101）" into name + venue
function splitNote(v){
  var at = v.split(/\s*@\s*/);
  if(at.length > 1) return { label: at[0].trim(), note: at.slice(1).join(" ").trim() };
  var par = v.match(/^(.+?)[（(]([^)）]+)[)）]\s*$/);
  if(par) return { label: par[1].trim(), note: par[2].trim() };
  return { label: v.trim(), note: "" };
}

// -------- Format one: an Excel / CSV grid --------
//   Time   Mon    Tue    Wed
//   08:00  Maths  Eng    Physics
function parseGrid(text){
  var raw = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
  if(raw.length < 2) return null;

  // Guess the separator: tab first (copying straight out of Excel gives tabs)
  var delim = null;
  if(raw[0].indexOf("\t") >= 0)      delim = "\t";
  else if(raw[0].indexOf(",") >= 0)  delim = ",";
  else if(raw[0].indexOf(";") >= 0)  delim = ";";
  else if(/\s{2,}/.test(raw[0]))     delim = "MULTISPACE";
  if(!delim) return null;

  var cells = raw.map(function(r){ return splitDelim(r, delim); });

  // Find the header: which row has >=2 cells that read as a single weekday
  var hi = -1, colDay = null;
  for(var i = 0; i < Math.min(cells.length, 6); i++){
    var map = {}, cnt = 0;
    for(var j = 0; j < cells[i].length; j++){
      var d = headerDay(cells[i][j]);
      if(d > 0){ map[j] = d; cnt++; }
    }
    if(cnt >= 2){ hi = i; colDay = map; break; }
  }
  if(hi < 0) return null;

  var out = [];
  for(var r = hi + 1; r < cells.length; r++){
    var row = cells[r], tm = null;

    // The time is usually in the first column (not one of the weekday columns)
    for(var c = 0; c < row.length; c++){
      if(colDay[c] !== undefined) continue;
      tm = parseClock(row[c]);
      if(tm) break;
    }
    if(!tm) continue;

    for(var key in colDay){
      var v = (row[key] || "").trim();
      if(!v) continue;
      if(/^[-—–_xX\/．.]+$/.test(v)) continue;   // the symbols used for a free period
      var sp = splitNote(v);
      if(!sp.label) continue;
      out.push({
        hour: tm.h, minute: tm.mi, days: colDay[key],
        label: sp.label, note: sp.note, enabled: true
      });
    }
  }
  return out.length ? out : null;
}

// Work out automatically whether it is a grid or one class per line
function parseTable(text){
  return parseColumns(text) || parseGrid(text) || parseLines(text);
}

// -------- Format two: one class per line --------
function parseLines(text){
  var out = [];
  text.split(/\r?\n/).forEach(function(raw){
    var line = raw.trim();
    if(!line || line.charAt(0) === "#") return;

    // Cut off the "@ venue" first
    var note = "";
    var at = line.split(/\s*@\s*/);
    if(at.length > 1){ line = at[0].trim(); note = at.slice(1).join(" ").trim(); }

    // Find the time (handles 08:00 / 8:00 AM / 下午 2:00)
    var tm = parseClock(line);
    if(!tm){ out.push({err:t("errNoTime"), raw:raw}); return; }

    var h = tm.h, mi = tm.mi;
    var before = line.slice(0, tm.idx).trim();
    var after  = line.slice(tm.idx + tm.len).trim();

    var days = before ? parseDays(before) : EVERYDAY;
    if(days === -1){ out.push({err:t("errBadDay", before), raw:raw}); return; }

    out.push({
      hour:h, minute:mi, days:days,
      label: after || before || t("className"),
      note: note, enabled:true
    });
  });
  return out;
}

function paintPrev(){

// ---------- Reading a file ----------
// A CSV saved by Excel on Windows is often GBK / Big5 rather than UTF-8,
// and reading it as UTF-8 gives mojibake, so try a few encodings.
function readFileSmart(file, cb){
  var fr = new FileReader();
  fr.onerror = function(){ toast(t("tFileFail")); };
  fr.onload = function(){
    var buf = fr.result;

    // Check for an image / PDF first -- those are binary, and forcing them through as text
    // is only ever mojibake. Reading them would need OCR, which is another matter (see README).
    var head = new Uint8Array(buf.slice(0, 5));
    var isPdf  = head[0]===0x25 && head[1]===0x50 && head[2]===0x44 && head[3]===0x46;
    var isJpg  = head[0]===0xFF && head[1]===0xD8 && head[2]===0xFF;
    var isPng  = head[0]===0x89 && head[1]===0x50 && head[2]===0x4E && head[3]===0x47;
    var isZip  = head[0]===0x50 && head[1]===0x4B;      // .xlsx / .docx are zips too
    if(isPdf || isJpg || isPng || isZip){
      toast(t(isZip ? "tNeedCsv" : "tNeedText"));
      return;
    }

    var txt = "";
    try { txt = new TextDecoder("utf-8").decode(buf); }
    catch(e){ txt = ""; }

    if(!txt || txt.indexOf("\uFFFD") >= 0){
      ["gb18030","gbk","big5"].some(function(enc){
        try{
          var t2 = new TextDecoder(enc).decode(buf);
          if(t2 && t2.indexOf("\uFFFD") < 0){ txt = t2; return true; }
        }catch(e){}
        return false;
      });
    }
    cb(txt);
  };
  fr.readAsArrayBuffer(file);
}

// ============================================================
//  How tall is the screen, really
//
//  Every unit that claims to answer this is wrong somewhere:
//    100vh   the large viewport; under Chrome's toolbar
//    100dvh  right in a tab, not in an iOS standalone app
//    inset:0 the layout viewport, which is the large one in Chrome
//  visualViewport.height is the only thing that reports the pixels a
//  person can actually see, in a tab and installed alike. It is written
//  to --app-h, which body's height reads, so the app is exactly the
//  visible area and nothing hangs off either end.
//
//  It fires on toolbar collapse, rotation, split screen and the software
//  keyboard, so it has to be cheap: one style write, and only when the
//  number actually moved. paintPages() re-fits the grid off the back of
//  the resize listener below, debounced, not from here.
// ============================================================
var appH = 0;
function fitViewport(){
  var vv = window.visualViewport;
  var h = Math.round((vv && vv.height) || window.innerHeight || 0);
  if(!h || h === appH) return;
  appH = h;
  document.documentElement.style.setProperty("--app-h", h + "px");
}
fitViewport();
addEventListener("resize", fitViewport);
addEventListener("orientationchange", fitViewport);
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", fitViewport);
  // iOS moves the visual viewport without resizing it when the keyboard
  // slides; re-asserting on scroll keeps the shell pinned to what is seen.
  window.visualViewport.addEventListener("scroll", fitViewport);
}

$("homePager").onscroll = markPage;
// The page holds as many rows as the pager is tall, so a rotate, a split
// screen or a browser resize changes how many icons fit. Debounced: a
// drag-resize fires this continuously, and rebuilding the grid on every
// frame of it is what makes a home screen flicker. Never mid-drag -- the
// tile being carried is a child of the grid we would be throwing away.
var pagerFit = null;
function pagerRefit(){
  if(pagerFit) clearTimeout(pagerFit);
  pagerFit = setTimeout(function(){
    pagerFit = null;
    if(EDIT.ghost) return;
    paintPages();
    markPage();
  }, 150);
}
addEventListener("resize", pagerRefit);
addEventListener("orientationchange", pagerRefit);
if(window.visualViewport) window.visualViewport.addEventListener("resize", pagerRefit);
// A laptop has arrow keys and no swipe. Home only, never while an app is
// open or a field has focus -- the timetable's own keys and every text
// input come first.
document.addEventListener("keydown", function(e){
  if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if(!document.body.classList.contains("at-home")) return;
  if($("homeStub").classList.contains("on") || EDIT.on || homeQ) return;
  var a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  var pager = $("homePager"), w = pager.clientWidth || 1;
  var to = Math.round(pager.scrollLeft / w) + (e.key === "ArrowRight" ? 1 : -1);
  var max = pager.children.length - 1;
  if(to < 0 || to > max) return;
  e.preventDefault();
  pager.scrollLeft = to * w;
  tap(6);
});

  if(act === "evGo"){
    var going = pk("evGoing", {});
    going[btn.dataset.id] = !going[btn.dataset.id];
    pkSet("evGoing", going);
    paintHome();
    return;
  }
  if(act === "wallPost"){
    var tx = String(($("wallTx") || {}).value || "").trim().slice(0, 280);
    if(!tx){ toast(t("wallNeed")); return; }
    var posts = pk("wallMine", []);
    posts.unshift({ id: "u" + Date.now().toString(36), ago: t("wallNow"), n: 0, c: [], tx: tx });
    pkSet("wallMine", posts);
    paintHome();
    return;
  }
  if(act === "wallLike"){
    var liked = pk("wallLiked", {});
    liked[btn.dataset.id] = !liked[btn.dataset.id];
    pkSet("wallLiked", liked);
    paintHome();
    return;
  }
  // Tapping Reply opens the box on that post only, and tapping it again
  // closes it -- one composer on screen at a time.
  if(act === "wallCmt"){
    UI.open.wall = UI.open.wall === btn.dataset.id ? null : btn.dataset.id;
    paintHome();
    return;
  }
  if(act === "wallCmtSend"){
    var ctx = String(($("wallC") || {}).value || "").trim().slice(0, 140);
    if(!ctx){ toast(t("wallNeed")); return; }
    var cm = pk("wallCmt", {});
    cm[btn.dataset.id] = (cm[btn.dataset.id] || []).concat([{ who: t("wallWho"), tx: ctx }]);
    pkSet("wallCmt", cm);
    UI.open.wall = null;
    paintHome();
    return;
  }
  if(act === "chatOpen"){ UI.open.chat = btn.dataset.id; paintHome(); return; }
  if(act === "chatBack"){ UI.open.chat = null; paintHome(); return; }
  if(act === "chatSend"){
    var msg = String(($("chatIn") || {}).value || "").trim().slice(0, 200);
    if(!msg){ toast(t("wallNeed")); return; }
    var now = nowDev();
    var mine = pk("chatMs", {});
    mine[btn.dataset.id] = (mine[btn.dataset.id] || []).concat([{
      me: true, who: "", tx: msg, w: pad(now.getHours()) + ":" + pad(now.getMinutes())
    }]);
    pkSet("chatMs", mine);
    paintHome();
    return;
  }
  if(act === "chatOpenFrom"){ S.micro = "chat"; UI.open = {}; paintHome(); return; }
  if(act === "foodJoin"){
    var fin = pk("foodIn", {});
    fin[btn.dataset.id] = !fin[btn.dataset.id];
    pkSet("foodIn", fin);
    paintHome();
    return;
  }
  if(act === "rideJoin"){
    var rin = pk("rideIn", {});
    rin[btn.dataset.id] = !rin[btn.dataset.id];
    pkSet("rideIn", rin);
    paintHome();
    return;
  }
  if(act === "mapPick"){ UI.open.map = btn.dataset.id; paintHome(); return; }
  // Page two. Every one of these is the same shape: flip a flag that lives
  // on this phone, repaint. Nothing is sent, nothing is reserved.
  if(act === "libRenew" || act === "printSend" || act === "washTell" ||
     act === "clubJoin" || act === "jobSave"  || act === "lostClaim"){
    var box = { libRenew:"libRen", printSend:"printJobs", washTell:"washTellMe",
                clubJoin:"clubIn", jobSave:"jobKeep", lostClaim:"lostMine" }[act];
    var flags = pk(box, {});
    flags[btn.dataset.id] = !flags[btn.dataset.id];
    pkSet(box, flags);
    paintHome();
    return;
  }
  // The clinic is the one that is not a toggle: you hold one slot, so
  // booking a second releases the first.
  if(act === "swDiag"){ DIAG = !DIAG; paintHome(); return; }
  if(act === "swFresh"){
    toast(t("meUpdating"));
    var done = function(){ location.reload(); };
    var caughtUp = Promise.resolve();
    try{
      if(typeof caches !== "undefined" && caches.keys)
        caughtUp = caches.keys().then(function(ks){
          return Promise.all(ks.map(function(k){ return caches.delete(k); }));
        });
    }catch(e){}
    caughtUp.then(function(){
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistration)
        return navigator.serviceWorker.getRegistration().then(function(r){
          return r ? r.update().catch(function(){}) : null;
        }).catch(function(){});
    }).then(done, done);
    return;
  }
  if(act === "meGoogle"){
    if(AUTH.busy) return;
    oauthStart("google");
    return;
  }
  if(act === "meIn" || act === "meUp"){
    var who = String(($("meU") || {}).value || "").trim();
    var pw  = String(($("meP") || {}).value || "");
    if(!loginIdOk(who)){ AUTH.msg = t("meBadId"); paintHome(); return; }
    if(pw.length < 8){ AUTH.msg = t("meShortPw"); paintHome(); return; }
    if(AUTH.busy) return;
    AUTH.busy = true; AUTH.msg = t("meWorking"); paintHome();
    var mail = toAuthEmail(who);
    (act === "meUp" ? cloudSignup(mail, pw) : cloudLogin(mail, pw))
      .then(function(r){
        if(r && r.needVerify){ AUTH.busy = false; AUTH.msg = t("meCheckMail"); paintHome(); return; }
        AUTH.msg = "";
        return authSettle();
      })
      .catch(authFail);
    return;
  }
  if(act === "meCode"){
    var code = String(($("meC") || {}).value || "").replace(/\D/g, "");
    if(code.length !== 6){ AUTH.msg = t("meBadCode"); paintHome(); return; }
    if(AUTH.busy) return;
    AUTH.busy = true; AUTH.msg = t("meWorking"); paintHome();
    mfaVerify(AUTH.factor, AUTH.chal, code)
      .then(function(){ AUTH.msg = ""; AUTH.qr = ""; AUTH.secret = ""; return authSettle(); })
      .catch(function(err){
        // A wrong code burns the challenge, so ask for a fresh one or the
        // next attempt fails for the wrong reason.
        authFail(err);
        if(AUTH.factor) mfaChallenge(AUTH.factor).then(function(c){ AUTH.chal = (c && c.id) || ""; });
      });
    return;
  }
  if(act === "shopBuy"){
    var bk = btn.dataset.kind === "skin" ? "skin" : "wall";
    if(!shopBuyIt(bk, btn.dataset.id)){ toast(t("shopPoor")); return; }
    // Bought is put on. Nobody buys a wallpaper to not look at it.
    shopUseIt(bk, btn.dataset.id);
    toast(t("shopGot"));
    paintHome();
    return;
  }
  if(act === "shopUse"){
    shopUseIt(btn.dataset.kind === "skin" ? "skin" : "wall", btn.dataset.id);
    paintHome();
    return;
  }
  if(act === "lookSave"){
    var ws = $("wallSel"), ks = $("skinSel");
    if(ws) shopUseIt("wall", String(ws.value || "none"));
    if(ks) shopUseIt("skin", String(ks.value || "flat"));
    toast(t("shopSaved"));
    return;
  }
  if(act === "lookShop"){ S.micro = "shop"; UI.open = {}; paintHome(); return; }
  if(act === "startSave"){
    var sel = $("startSel");
    pkSet("startAt", sel ? String(sel.value || "home") : "home");
    toast(t("startSaved"));
    return;
  }
  if(act === "iceAdd"){
    var iN = String(($("iceN") || {}).value || "").trim().slice(0, 40);
    var iP = String(($("iceP") || {}).value || "").trim().slice(0, 24);
    var iR = String(($("iceR") || {}).value || "").trim().slice(0, 24);
    if(!iN || !telHref(iP)){ toast(t("iceNeed")); return; }
    var ice = myIce();
    ice.unshift({ id: "i" + Date.now().toString(36), n: iN, p: iP, r: iR });
    pkSet("ice", ice);
    paintHome();
    return;
  }
  if(act === "iceDrop"){
    pkSet("ice", myIce().filter(function(x){ return x.id !== btn.dataset.id; }));
    paintHome();
    return;
  }
  if(act === "me2faOn"){ authEnrolStart(); return; }
  if(act === "meLater"){
    // Back out of an enrolment without signing out. The unverified factor
    // it leaves behind is cleared by the next attempt.
    AUTH.step = "done"; AUTH.qr = ""; AUTH.secret = ""; AUTH.msg = "";
    paintHome();
    return;
  }
  if(act === "meOut"){
    cloudLogout();
    AUTH.step = "in"; AUTH.msg = ""; AUTH.qr = ""; AUTH.secret = "";
    AUTH.factor = ""; AUTH.chal = ""; AUTH.locked = false; AUTH.hasFactor = false;
    paintHome();
    return;
  }
  if(act === "mePk"){
    if(pkOn()){ pkForget(); toast(t("mePkGone")); paintHome(); return; }
    pkEnrol().then(function(){ toast(t("mePkSaved")); paintHome(); })
             .catch(function(){ toast(t("mePkNo")); });
    return;
  }
  if(act === "meUnlock"){
    pkUnlock().then(function(){ AUTH.msg = ""; paintHome(); })
              .catch(function(){ toast(t("mePkNo")); });
    return;
  }
  if(act === "medBook"){
    pkSet("medSlot", pk("medSlot", "") === btn.dataset.id ? "" : btn.dataset.id);
    paintHome();
    return;
  }
  if(act === "dormPaid"){
    var paidRows = pk("dormDone", {});
    paidRows[btn.dataset.id] = !paidRows[btn.dataset.id];
    pkSet("dormDone", paidRows);
    paintHome();
    return;
  }
  if(act === "dormReq"){
    var what2 = String(($("dormTx") || {}).value || "").trim().slice(0, 90);
    if(!what2){ toast(t("wallNeed")); return; }
    var now2 = nowDev();
    var reqs = pk("dormReq", []);
    reqs.unshift({ tx: what2, when: pad(now2.getHours()) + ":" + pad(now2.getMinutes()) });
    pkSet("dormReq", reqs);
    paintHome();
    return;
  }
  toast(t("shellToast"));
};

// ---------- Startup ----------
applyTheme();
try {
  ["p", "c"].forEach(function(f){
    var v0 = localStorage.getItem("clockView" + f);
    if(VIEWS.indexOf(v0) >= 0) S.view[f] = v0;
  });
  var f0 = localStorage.getItem("clockFromToday");
  if(f0 !== null) S.fromToday = (f0 === "1");
} catch(e){}

// Logged in last time -> reconnect to the cloud (falling back to local / device if that fails)
loadRoleLocal();
// Open where they asked to be opened. Done before the first paint so it
// is the first screen, not a flash of the springboard and then a jump.
(function openingScreen(){
  try{
    var at = startAt();
    if(at === "home") return;
    if(at === "tt"){ openTt(); return; }
    S.micro = at;
    $("homeStub").classList.add("on");
    $("pocketHome").classList.add("in-app");
  }catch(e){}
})();

applyLook();
cloudLoadCfg();
// Coming back from Google? The session is in the URL. This has to run
// after the config is loaded (it saves through it) and before the
// passkey lock below, which would otherwise lock the sign-in that just
// this second happened.
var backFromOauth = oauthReturn();
paintCloudBtn();
// A session that survived a reload still has to be unlocked if a passkey
// was enrolled on this device, and the token may be stale.
if(signedIn() && !backFromOauth){
  AUTH.locked = pkOn();
  scheduleRefresh();
  refreshIfStale();
}
if(!SYNC_OFF && CLOUD.on){
  // Put last time's data up first, rather than making the user stare at a blank screen waiting for the network
  var cached = cloudCacheLoad();
  if(cached) enterCloud(cached);

  scheduleRefresh();

  cloudPull()
    .catch(function(err){
      if(!isAuthError(err)) throw err;
      return cloudRefresh().then(cloudPull);      // token expired, so swap it and pull again
    })
    .then(function(data){
      if(data) enterCloud(data);
      applyStatic();
      return pull().then(pullSem).then(pullSkips).then(pullAlarms).then(pullRooms).then(pullHoli);
    })
    .catch(function(err){
      if(isAuthError(err)){
        cloudSessionLost();                        // genuinely needs a fresh login
      } else if(cached){
        // Merely unreachable, and we have last time's data -> carry on, do not alarm the user
        enterCloud(cached);      // DB may have been touched meanwhile, so put it back
        applyStatic();
        pull().then(pullSem).then(pullSkips).then(pullAlarms).then(pullRooms).then(pullHoli);
        toast(t("cUsingCache"));
      } else {
        CLOUD.on = false;
        paintCloudBtn();
        toast(t("cOffline"));
      }
    });
}

// Returning to this tab / waking from sleep -> check the token is still fresh
try{
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) refreshIfStale();
  });
  addEventListener("focus", refreshIfStale);
  addEventListener("online", function(){ refreshIfStale(); if(!SYNC_OFF && CLOUD.on) cloudScheduleSave(); });
}catch(e){}
setInterval(tick, 1000);
setInterval(demoTick, 1000);
// The pure-web demo build sets this flag first (it does not exist on real hardware, so no effect)
// Logged in -> leave demo alone. The reason is in the comment inside enterDemo()
if(window.__FORCE_DEMO__ && !CLOUD.on) enterDemo();
setInterval(pull, 3000);
applyStatic();
pull().then(pullSem).then(pullSkips).then(pullAlarms).then(pullRooms).then(pullHoli);
</script>
</body>
</html>
