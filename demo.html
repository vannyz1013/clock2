            '<path d="M-15 0h30" stroke="#6b3d12" stroke-width="3.4" stroke-linecap="round"/></g>';
  } else if(kind === "door"){

    pre = '<rect x="12" y="4" width="96" height="120" rx="7" fill="#f06eaa" stroke="#a81f5f" stroke-width="3"/>' +

// ---------- Roles / mode ----------
//  roles is a bitmask: bit0 normal / bit1 student / bit2 teacher.
//  Any combination works -- someone teaching part-time ticks both student and teacher.
var ROLES   = ["normal", "student", "teacher"];
var ROLEBIT = { normal:1, student:2, teacher:4 };
var ROLEEM  = { normal:"⏰", student:"🎓", teacher:"📚" };

function hasRole(m){ return (S.roles & ROLEBIT[m]) !== 0; }
function firstRole(){
  for(var i=0;i<3;i++) if(hasRole(ROLES[i])) return ROLES[i];
  return "normal";
}
// After the roles change, if the current mode is no longer one of them, jump to the first that is
function fixMode(){
  if(hasRole(S.mode)) return false;
  S.mode = firstRole();
  return true;
}

function paintModes(){
  var bs = $("modes").children, shown = 0;
  for(var i=0;i<bs.length;i++){
    var on = hasRole(bs[i].dataset.m);
    bs[i].hidden = !on;
    if(on) shown++;
    bs[i].classList.toggle("on", bs[i].dataset.m === S.mode);
  }
  $("modes").hidden = (shown <= 1);   // one role only means no switcher row
  paintRoleBtn();
  paintQuietBtn();
  paintBody();
}

// Timetable only -- what the user wanted was "just show me today's classes, stop bothering me".
// Deliberately not a fourth mode: each mode has its own list, so switching to it
// would show an empty table -- the opposite of what was asked for.

function toggleQuiet(){

  // Turning alarms off = they only want to look at it right now -> jump straight

  // remember=false, so it does not overwrite the view they normally pick; switching back restores it.

// ---------- Painting the list ----------
function esc(s){
  return String(s==null?"":s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

function daysText(a){
  if(a.days === 0)        return t("onceOnly");
  if(a.days === EVERYDAY) return t("dEvery");
  if(a.days === WEEKDAYS) return t("dWork");
  if(a.days === WEEKEND)  return t("dWeekend");
  var o = [];
  // English reads better as Mon Tue; Chinese uses the single characters
  for(var i=0;i<7;i++)
    if(a.days & (1<<i)) o.push(lang === "en" ? WD(i).slice(0,3) : WDS(i));
  return t("dOn", o.join(" "));
}

// Every reminder on this alarm, longest lead first (10 minutes before, 5 minutes before...)
function leadList(a){
  var L = (a.leads && a.leads.length) ? a.leads.slice()
        : [a.lead || 0];
  L.sort(function(x, y){ return y - x; });
  return L;
}

// The first (earliest) ring time = event time - lead
function fireTime(a, lead){
  if(lead === undefined) lead = leadList(a)[0];
  var m = a.hour*60 + a.minute - lead;
  while(m < 0) m += 1440;
  return pad(Math.floor(m/60)) + ":" + pad(m%60);
}

// Minutes from now (used to mark the "next" one)
function minsUntil(a, now){
  var cur = now.getHours()*60 + now.getMinutes();
  var fm  = a.hour*60 + a.minute - leadList(a)[0];
  var sh  = 0;
  while(fm < 0){ fm += 1440; sh -= 1; }
  var best = 1e9;
  for(var d=0; d<8; d++){
    var wd = (now.getDay() + d) % 7;
    var cls = (wd - sh + 7) % 7;
    if(a.days !== 0 && !(a.days & (1<<cls))) continue;
    var t = d*1440 + fm - cur;
    if(t < 0) continue;
    if(t < best) best = t;
    break;
  }
  return best;
}

// compact = shown inside one day of the calendar, so no need to repeat the weekday
function itemHTML(a, nextId, compact, dayI){
  var cfg = modeCfg(S.mode);
  var off = (dayI !== undefined) && isSkipped(a, dayI);
  var sub = off ? '<span class="cx">' + t("occCancelled") + '</span>'
                : (compact ? "" : daysText(a));

  if(!compact && S.sem.enabled && a.weekRule)
    sub += ' &middot; ' + t(a.weekRule === 1 ? "wrTagOdd" : "wrTagEven");

  // Timetable only: do not write "rings 07:50" -- nothing rings in this mode
  var LD = S.quiet ? [] : leadList(a);
  if(LD.length > 1)
    sub += (sub ? ' &middot; ' : '') + '<span class="lead">' +
           t("itemLeads", LD.map(function(v){ return fireTime(a, v); }).join(" + "),
             LD.length) + '</span>';
  else if(LD.length && LD[0] > 0)
    sub += (sub ? ' &middot; ' : '') +
           '<span class="lead">' + t("itemLead", fireTime(a), LD[0]) + '</span>';
  var rm = roomOf(a, dayI);
  if(rm && cfg.showNote)
    sub += (sub ? ' &middot; ' : '') + '<span class="rm' +
           (rm !== (a.note || "") ? " moved" : "") + '">' +
           (rm !== (a.note || "") ? "&#128205; " : "") + esc(rm) + '</span>';

  return '<div class="item ' + (S.quiet ? "flat " : "") + (a.enabled?"":"off") +
         (off?" skip":"") +
         (a.id===nextId && !off && !S.quiet ? " next":"") + '" data-id="' + a.id + '"' +
         (dayI !== undefined ? ' data-day="' + dayI + '"' : '') + '>' +
    '<div class="time">' + pad(a.hour) + ':' + pad(a.minute) + '</div>' +
    '<div class="info"><b>' + evEm(a) + esc(a.label || t("alarm")) + '</b><small>' + sub + '</small></div>' +
    (S.quiet ? "" :
      '<div class="sw ' + (a.enabled?"on":"") + '" data-tog="' + a.id + '"></div>') +
    '</div>';
}

// The W1 W2 W3 ... strip up top scrolls sideways
function weekStripHTML(){
  var cur = curWeek(), sel = shownWeek(), h = '<div class="wkstrip" id="wkStrip">';
  for(var w = 1; w <= S.sem.weeks; w++){
    var p = idxParts(weekFirstDay(w));
    h += '<button data-w="' + w + '" class="' +
         (w === cur ? "now " : "") + (w === sel ? "sel" : "") + '">' +
         '<span class="n">' + t("wkShort", w) + '</span>' +
         '<span class="r">' + p.d + '/' + p.m + '</span></button>';
  }
  return h + '</div>';
}

// The seven days of the selected week, one card each
function weekViewHTML(nextId, now){
  // With a semester, go by week number; without one, the week containing the day being viewed.
  // Normal mode should get a calendar without having to set a semester up.
  var w      = shownWeek();
  var first  = S.sem.enabled ? weekFirstDay(w) : anchorOf(curDay());
  var todayI = idxOf(now);

  // On a Thursday, starting the view at Monday makes the first three cards pure noise.
  // Only fold them when today is in this week -- browsing another week shows all of it.
  var hasToday = (todayI >= first && todayI < first + 7);
  var skipPast = S.fromToday && hasToday;

  // "Which class is off this week" -- right at the top, impossible to miss.
  // It used to be reachable only by opening a single class, which was far too hidden.
  var h = "";

  if(hasToday)
    h += '<button class="offbtn" data-fromtoday="1">' +
         '<span>' + (skipPast ? "&#128197;" : "&#9193;") + '</span>' +
         '<span>' + esc(t(skipPast ? "ftAll" : "ftFrom")) + '</span></button>';

  // Cancelling and adding sessions are timetable ideas; normal mode does not need them
  if(modeCfg(S.mode).wk && S.sem.enabled){
    var nOff = countOffInWeek(w);
    h += '<button class="offbtn" data-off="1">' +
         '<span>&#128204;</span><span>' + t("offBtn") + '</span>' +
         (nOff ? '<span class="cnt">' + nOff + '</span>' : '') +
         '</button>' +
         // A teacher squeezing in an extra / make-up class -- that day only, not every week
         '<button class="offbtn" data-extra="1">' +
         '<span>&#10133;</span><span>' + t("extraBtn") + '</span></button>';
  }

  for(var k = 0; k < 7; k++){
    var i     = first + k;
    if(skipPast && i < todayI) continue;
    var p     = idxParts(i);
    var isTdy = (i === todayI);

    // This day's classes (the repeating ones) + this day's one-off events
    var list = shownOnDay(i, w);

    var hol = holidayName(i);

    h += '<div class="daycard' + (isTdy ? " today" : "") + (hol ? " holi" : "") + '">' +
         '<div class="dh' + (list.length ? "" : " nil") + '">' +
           '<span class="dw">' + WD(p.wd) + '</span>' +
           '<span class="dd">' + p.d + '/' + p.m + '</span>' +
           holiTagHTML(i) +
           (isTdy ? '<span class="tag">' + t("today") + '</span>' : '') +
           '<button class="dayadd" data-add="' + i + '" title="' + t("btnManual") + '">+</button>' +
         '</div>' +
         (list.length
            ? list.map(function(a){ return itemHTML(a, nextId, true, i); }).join("")
            : '<div class="dh nil" style="padding-top:0;font-size:12px">' +
              t("noClass") + '</div>') +
         '</div>';
  }
  return h;
}

// ============================================================
//  Timetable view
//
//  The user's own words: pressing "turn alarms off" should go straight to the timetable,
//  "but not this layout, because it is hard to see the time and what the subject is" --
//  meaning the grid a school portal uses: times crammed into one row of small text at the top,
//  subjects reduced to codes, unreadable on a phone.
//
//  So this does the opposite:
//    - the time goes hard left, in the largest type on the page
//    - the subject name gets a whole line to itself, in bold
//    - venue / odd-even week shrink onto a second line
//    - Lecture / Tutorial / Practical get an L/T/P colour chip on the right
//    - a day with no classes takes up no space at all
// ============================================================
var KIND_LETTER = { lecture:"L", tutorial:"T", practical:"P" };

function kindTag(a){
  var k = kindOf(a);
  return k ? '<span class="ttk ' + k + '">' + KIND_LETTER[k] + '</span>' : "";
}

// End time (absent when it was never filled in)
function endText(a){
  return a.dur ? hhmm((a.hour * 60 + a.minute + a.dur) % 1440) : "";
}

// Normal mode's home page: one list of alarms, ordered by time.
// The phone-clock page -- no days, no paging, no weekdays to think about,
// a switch on the right of every row.
function listViewHTML(nextId){
  var list = mine().slice().sort(byTime);
  if(!list.length)
    return '<div class="card"><div class="empty"><p>' + esc(t("ttNone")) + '</p></div></div>';

  return '<div class="card">' + list.map(function(a){
    return itemHTML(a, nextId);
  }).join("") + '</div>';
}

function tableViewHTML(now){
  var w      = shownWeek();
  var first  = S.sem.enabled ? weekFirstDay(w) : anchorOf(curDay());
  var todayI = idxOf(now);
  var pa = idxParts(first), pb = idxParts(first + 6);

  var h = viewNavHTML(
    (S.sem.enabled && w >= 1 && w <= S.sem.weeks) ? t("wkShort", w) : t("vTable"),
    t("ttSpan", pa.d + "/" + pa.m, pb.d + "/" + pb.m));

  h += '<div class="tt">';
  var any = 0;

  for(var k = 0; k < 7; k++){
    var i = first + k, p = idxParts(i);
    var list = shownOnDay(i, w);
    if(!list.length) continue;          // an empty day takes no space
    any += list.length;

    h += '<div class="ttday' + (i === todayI ? " today" : "") +
         (holidayName(i) ? " holi" : "") + '">' +
         '<div class="ttdh">' + esc(WD(p.wd)) +
           '<span class="dd">' + p.d + '/' + p.m + '</span>' +
           holiTagHTML(i) +
           (i === todayI ? '<span class="tag">' + esc(t("today")) + '</span>' : '') +
         '</div>' +
         list.map(function(a){
           var off = isSkipped(a, i);
           var et  = endText(a);
           var rm  = roomOf(a, i);
           var sub = [];
           if(off) sub.push('<span class="cx">' + esc(t("occCancelled")) + '</span>');
           if(rm)  sub.push('<span class="' + (rm !== (a.note || "") ? "rm moved" : "") +
                            '">&#128205; ' + esc(rm) + '</span>');
           if(S.sem.enabled && a.weekRule)
             sub.push(esc(t(a.weekRule === 1 ? "wrTagOdd" : "wrTagEven")));

           return '<div class="ttrow' + (off ? " off" : "") + '" data-id="' + a.id +
                  '" data-day="' + i + '">' +
             '<div class="ttt"><b>' + pad(a.hour) + ':' + pad(a.minute) + '</b>' +
               (et ? '<i>' + et + '</i>' : '') + '</div>' +
             '<div class="ttbar"></div>' +
             '<div class="ttinfo"><b>' + evEm(a) + esc(a.label || t("alarm")) + '</b>' +
               (sub.length ? '<small>' + sub.join(" &middot; ") + '</small>' : '') +
             '</div>' + kindTag(a) +
             // Not in timetable-only mode: a row of switches is the thing that
             // makes this read as an alarm list rather than a timetable, which
             // is the whole point of that mode.
             (S.quiet ? "" :
               '<div class="sw ttsw' + (off ? "" : " on") + '" data-otog="' + a.id +
                 '" data-oday="' + i + '"></div>') +
             '</div>';
         }).join("") +
         '</div>';
  }
  h += '</div>';

  if(!any) h += '<div class="card"><div class="empty"><p>' +
                esc(t("ttNone")) + '</p></div></div>';
  return h;
}

// The week badge under the clock. Student / teacher modes only.
function paintWeekBadge(){
  var b = $("wkBadge");
  if(!modeCfg(S.mode).wk){ b.hidden = true; return; }
  b.hidden = false;

  if(!S.sem.enabled){
    b.innerHTML = "&#128197; " + t("wkSetup");
    b.classList.remove("out");
    return;
  }
  var w = curWeek();
  var out = (w < 1 || w > S.sem.weeks);
  b.innerHTML = w < 1 ? t("wkBefore")
              : w > S.sem.weeks ? t("wkAfter")
              : t("wkNow", w, S.sem.weeks);
  b.classList.toggle("out", out);
}

function paintBody(){
  var cfg = modeCfg(S.mode);
  var el  = $("body");
  var now = nowDev();
  var LIST = mine();

  paintWeekBadge();
  paintHoliBtn();

  // Spell out what this page is for. Without this line a whole page of
  // timetable looks completely ordinary, and people assume the alarms are still on.
  var quietBar = S.quiet ? '<div class="qbar">&#128277; ' +
                           esc(t("quietBarTx")) + '</div>' : "";

  if(!LIST.length){
    el.innerHTML = quietBar +
      '<div class="card"><div class="empty"><div class="em">' +
      (cfg.wk ? "&#128197;" : "&#9200;") + '</div>' +
      '<p>' + (cfg.wk ? t("emptyClass") : t("emptyAlarm")) + '</p>' +
      '<p style="font-size:12px;margin-bottom:18px">' + t("emptyHint") + '</p>' +
      '<button class="btn-p" id="emptyImport" style="padding:13px 24px;border:0;' +
      'border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;' +
      'cursor:pointer">' + t("emptyBtn") + '</button>' +
      (cfg.wk ? '<button class="btn-s" id="emptyGen" style="margin-top:10px;padding:13px 24px;border:0;' +
      'border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;' +
      'cursor:pointer">' + t("genTt") + '</button>' : "") +
      '</div></div>';
    $("emptyImport").onclick = openImport;
    if($("emptyGen")) $("emptyGen").onclick = applyGenTt;
    return;
  }

  // Find the "next one to ring"
  var nextId = 0, best = 1e9;
  LIST.forEach(function(a){
    if(!a.enabled) return;
    var m = minsUntil(a, now);
    if(m < best){ best = m; nextId = a.id; }
  });

  var html = quietBar;

  // -------- Calendar: all three modes have one --------
  //   student / teacher + a semester set -> the week view also gets a scrollable W1 W2 W3 strip
  //   normal mode (or no semester yet) -> still day / week / month, just without week numbers
  {
    html += viewTabsHTML();

    var V = curView();
    if(V === "list"){
      html += listViewHTML(nextId);
    } else if(V === "day"){
      html += dayViewHTML(nextId);
    } else if(V === "month"){
      html += monthViewHTML(nextId);
    } else if(V === "table"){
      if(cfg.wk && S.sem.enabled) html += weekStripHTML();
      html += tableViewHTML(now);
    } else {
      if(cfg.wk && S.sem.enabled) html += weekStripHTML();
      html += weekViewHTML(nextId, now);
    }

    // A one-off event with no date cannot be placed on the calendar, so it goes last
    var floating = V === "list" ? [] : LIST.filter(function(a){
      return a.days === 0 && !a.date;
    }).sort(byTime);
    if(floating.length){
      html += '<div class="sec-h"><h2>' + t("onceOnly") + '</h2></div>' +
              '<div class="card">' +
              floating.map(function(a){ return itemHTML(a, nextId, true); }).join("") +
              '</div>';
    }

  }

  el.innerHTML = html;
}

function byTime(a,b){ return (a.hour*60+a.minute) - (b.hour*60+b.minute); }

function modeIdx(m){ return m === "student" ? 1 : (m === "teacher" ? 2 : 0); }

// This mode's own list.
// Note: this only affects what you can SEE -- every alarm rings whichever mode you are in.
function mine(){
  var w = modeIdx(S.mode);
  return S.alarms.filter(function(a){ return (a.owner || 0) === w; });
}

// Tapping the list: toggle or edit
$("body").onclick = function(e){
  // Tapping the + on a day -> add straight onto that day (Saturday and Sunday included)
  var ab = e.target.closest("[data-add]");
  if(ab){
    var di = parseInt(ab.dataset.add, 10);
    var dp = idxParts(di);
    openEdit(null, { days: 1 << dp.wd, date: dp.y + "-" + pad(dp.m) + "-" + pad(dp.d) });
    return;
  }

  // Day / week / month
  var vt = e.target.closest("[data-v]");
  if(vt){ setView(vt.dataset.v); return; }

  var vm = e.target.closest("[data-vmove]");
  if(vm){
    var d = parseInt(vm.dataset.vmove, 10);
    if(d === 0){ S.cursor = null; S.selWeek = null; paintBody(); }
    else moveView(d);
    return;
  }

  // Tapping a day in the month view -> settle on that day and switch to the day view
  var vd = e.target.closest("[data-vday]");
  if(vd){
    var di2 = parseInt(vd.dataset.vday, 10);
    if(S.cursor === di2) setView("day");     // the second tap jumps; the first only selects
    else { S.cursor = di2; paintBody(); }
    return;
  }

  // Tapping "which class is off this week"
  if(e.target.closest("[data-off]")){ openOff(); return; }

  // Whole week <-> from today
  if(e.target.closest("[data-fromtoday]")){
    S.fromToday = !S.fromToday;
    try{ localStorage.setItem("clockFromToday", S.fromToday ? "1" : "0"); }catch(e4){}
    paintBody();
    return;
  }

  // A one-off extra class: open the add sheet, default it to "once only", date = today (or the day being viewed)
  if(e.target.closest("[data-extra]")){
    var di3 = curDay();
    var dp3 = idxParts(di3);
    openEdit(null, { days: 0, date: dp3.y + "-" + pad(dp3.m) + "-" + pad(dp3.d) });
    return;
  }

  // Tapping the week strip -> change week
  var wb = e.target.closest("[data-w]");
  if(wb){
    S.selWeek = parseInt(wb.dataset.w, 10);
    // The cursor moves with it, so switching to day / month lands in the same week
    var td = idxOf(nowDev());
    var fd = weekFirstDay(S.selWeek);
    S.cursor = (td >= fd && td < fd + 7) ? td : fd;
    paintBody();
    return;
  }

  var sw = e.target.closest("[data-tog]");
  if(sw){
    var a = S.alarms.filter(function(x){ return x.id == sw.dataset.tog; })[0];
    if(!a) return;
    a.enabled = !a.enabled;
    sw.classList.toggle("on", a.enabled);
    sw.closest(".item").classList.toggle("off", !a.enabled);
    api("/api/alarms", {method:"POST", body: JSON.stringify(a)})
      .then(pullAlarms).catch(function(){ toast(t("tSaveFail")); });
    return;
  }
  // The timetable switch flips "is there class this day, this period" straight away,
  // with no sheet. The "cancel this one" button in the sheet runs the same code (toggleSkip).
  var ot = e.target.closest("[data-otog]");
  if(ot){
    var oa = S.alarms.filter(function(x){ return x.id == ot.dataset.otog; })[0];
    var od = parseInt(ot.dataset.oday, 10);
    // On a holiday the switch will not move -- the holiday wins over the
    // per-session setting. Doing nothing at all is the worst answer, because
    // people just keep tapping. Say which holiday is in the way.
    if(oa && holidayOff(oa, od)){ toast(t("holiOnDay", holidayName(od))); return; }
    if(oa) toggleSkip(oa, od);
    return;
  }

  var it = e.target.closest(".item, .ttrow");
  if(!it) return;
  var al = S.alarms.filter(function(x){ return x.id == it.dataset.id; })[0];
  if(!al) return;

  // From the calendar -> act on that one session that day; from the list -> edit the whole class
  if(it.dataset.day !== undefined) openOcc(al, parseInt(it.dataset.day, 10));
  else                             openEdit(al);
};

// ---------- Sheets ----------
function openSheet(id){
  $("mask").classList.add("on");
  $(id).classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeSheets(force){
  // No roles chosen yet -> refuse to close, one has to be picked first
  if(!force && $("sheetRole").classList.contains("on") && !S.roleSet) return;
  $("mask").classList.remove("on");
  // Close by class rather than keeping a hand-written list. That list had
  // grown to twelve entries, and adding sheetHoli to it was duly forgotten --
  // the symptom being one sheet that tapping the backdrop would not close.
  var sh = document.querySelectorAll(".sheet");
  for(var i = 0; i < sh.length; i++) sh[i].classList.remove("on");
  document.body.style.overflow = "";
}
// Drag a bottom sheet down to dismiss it. Every phone does this, and a
// sheet with a grip on it that will not move is worse than no grip.
// A sheet that refuses to close -- the role picker, before a role is
// picked -- simply springs back, because closeSheets() stays the one
// place that decides.
(function sheetDrag(){
  var sh = null, y0 = 0, dy = 0, live = false, t0 = 0;
  function mask(){ return document.getElementById("mask"); }
  try{
    document.addEventListener("touchstart", function(e){
      sh = null;
      if(!e.touches || e.touches.length !== 1) return;
      var n = e.target && e.target.closest ? e.target.closest(".sheet") : null;
      if(!n || !n.classList.contains("on") || n.scrollTop > 0) return;
      var tag = (e.target.tagName || "").toLowerCase();
      if(tag === "input" || tag === "textarea" || tag === "select") return;
      sh = n; y0 = e.touches[0].clientY; dy = 0; live = false; t0 = Date.now();
    }, {passive:true});

    document.addEventListener("touchmove", function(e){
      if(!sh || !e.touches || !e.touches.length) return;
      var d = e.touches[0].clientY - y0;
      if(!live){
        if(d < -8){ sh = null; return; }   // pulling up is scrolling
        if(d < 9) return;
        live = true;
        sh.style.transition = "none";
      }
      e.preventDefault();
      dy = Math.max(0, d);
      sh.style.transform = "translateY(" + dy.toFixed(1) + "px)";
      var m = mask();
      if(m) m.style.opacity = Math.max(0, 1 - dy / 340).toFixed(3);
    }, {passive:false});

    var done = function(){
      if(!sh) return;
      var n = sh; sh = null;
      var m = mask();
      if(m) m.style.opacity = "";
      n.style.transition = "";
      if(!live) return;
      live = false;
      var flick = (Date.now() - t0) < 320 && dy > 50;
      if(dy > 112 || flick){ closeSheets(); tap(6); }
      n.style.transform = "";
    };
    document.addEventListener("touchend", done, {passive:true});
    document.addEventListener("touchcancel", done, {passive:true});
  }catch(e){}
})();

$("mask").onclick     = closeSheets;
$("edCancel").onclick = closeSheets;
$("imCancel").onclick = closeSheets;

// Weekday chips (rebuilt on a language change, hence a function)
var PRESET_VALS = [EVERYDAY, WEEKDAYS, WEEKEND, 0];

function buildDayChips(){
  var daysBox = $("edDays");
  daysBox.innerHTML = "";
  for(var i=0;i<7;i++){
    (function(i){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = WDS(i);
      b.onclick = function(){ S.days ^= (1<<i); paintDays(); };
      daysBox.appendChild(b);
    })(i);
  }

  var box = $("edPresets");
  box.innerHTML = "";
  ["dEvery","dWork","dWeekend","dOnce"].forEach(function(k, j){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = t(k);
    b.onclick = function(){ S.days = PRESET_VALS[j]; paintDays(); };
    box.appendChild(b);
  });
}

function paintDays(){
  var bs = $("edDays").children;
  for(var i=0;i<7;i++) bs[i].classList.toggle("on", !!(S.days & (1<<i)));
  var ps = $("edPresets").children;
  for(var j=0;j<PRESET_VALS.length;j++)
    ps[j].classList.toggle("on", S.days === PRESET_VALS[j]);

  // "Once only" -> show the date field; repeating + a semester -> show the odd/even week field
  $("wrapDate").style.display     = (S.days === 0) ? "block" : "none";
  $("wrapEv").style.display       = (S.days === 0) ? "block" : "none";
  paintWkPick();
  $("wrapWeekRule").style.display = (S.days !== 0 && S.sem.enabled) ? "block" : "none";
}

// ============================================================
//  Where the reminder goes (device / phone)
//  bit0 = device (buzzer+LED), bit1 = phone (notification+sound)
// ============================================================
function paintCh(){
  $("chDev").classList.toggle("on",   !!(S.chan & 1));
  $("chPhone").classList.toggle("on", !!(S.chan & 2));
  $("chHint").innerHTML =
    S.chan === 3 ? t("chBoth") :
    S.chan === 1 ? t("chDevOnly") :
    S.chan === 2 ? t("chPhoneOnly") : t("chNone");
}

$("chDev").onclick = function(){
  S.chan ^= 1;
  if(!S.chan) S.chan = 2;            // both cannot be off
  paintCh();
};

$("chPhone").onclick = function(){
  var turningOn = !(S.chan & 2);
  S.chan ^= 2;
  if(!S.chan) S.chan = 1;
  paintCh();
  if(turningOn && (S.chan & 2)) askNotifyPerm();
};

// Phone notifications need permission first. Browsers require a user tap to ask.
function askNotifyPerm(){
  if(!("Notification" in window)) return;
  if(Notification.permission === "granted") return;
  if(Notification.permission === "denied"){ toast(t("chDenied")); return; }
  Notification.requestPermission().then(function(p){
    if(p !== "granted") toast(t("chNeedPerm"));
  }).catch(function(){});
}

// ============================================================
//  Alarm sound
//
//  Synthesised live with WebAudio, no audio file (saves flash, and no extra download).
//  Two alternating tones, repeating -- a real alarm sound, not a single "beep" and done.
//
//  Browser rule: no sound until the user has tapped the page.
//  So the first tap anywhere unlocks the AudioContext (unlockAudio),
//  and the alarm can actually make a noise when the time comes.
// ============================================================
var audioCtx  = null;
var ringTimer = null;      // the repeating timer
var pendingRing = 0;       // which alarm we arrived on from a push notification
var ringUntil = 0;         // ring until when (milliseconds)

function getCtx(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}

// Unlock the audio on the user's first touch (iOS insists on this)
var audioReady = false;
function unlockAudio(){
  if(audioReady) return;
  var c = getCtx();
  if(!c) return;
  try{
    // Play something inaudible, purely to wake the context up
    var o = c.createOscillator(), g = c.createGain();
    g.gain.value = 0.0001;
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.02);
    audioReady = true;
  }catch(e){}
}

// One "beep-beep" pair (two tones a little apart, easier to recognise than one)
function ringBurst(){
  var c = getCtx();
  if(!c) return;
  try{
    [[880, 0], [660, 0.30]].forEach(function(p){
      var t0  = c.currentTime + p[1];
      var osc = c.createOscillator();
      var g   = c.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(p[0], t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.30, t0 + 0.015);
      g.gain.setValueAtTime(0.30, t0 + 0.20);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.27);
      osc.connect(g); g.connect(c.destination);
      osc.start(t0); osc.stop(t0 + 0.30);
    });
  }catch(e){}
}

// Start ringing. Repeats until stopRinging() or RING_MAX_SEC is passed.
var RING_MAX_SEC = 300;
function startRinging(){
  ringUntil = Date.now() + RING_MAX_SEC * 1000;
  if(ringTimer !== null) return;    // already ringing, do not stack a second one
  ringBurst();
  buzz();
  ringTimer = setInterval(function(){
    if(Date.now() > ringUntil){ stopRinging(); return; }
    ringBurst();
    buzz();
  }, 900);
}

function stopRinging(){
  // Compare with !== null: a timer id can be 0, so a truthiness test would fail to clear it
  if(ringTimer !== null){ clearInterval(ringTimer); ringTimer = null; }
  ringUntil = 0;
}

// Vibration (Android has it, iOS does not -- never mind if it is missing)
function buzz(){
  try{ if(navigator.vibrate) navigator.vibrate([400, 200, 400]); }catch(e){}
}

// While ringing, if that alarm has "phone" ticked, notify and keep making noise
function notifyPhone(label){
  startRinging();
  try{
    if("Notification" in window && Notification.permission === "granted"){
      var n = new Notification(label || t("alarm"), {
        body: t("ringNow"), tag: "clock-ring", renotify: true,
        requireInteraction: true,        // do not dismiss itself
        icon: "icon-192.png"
      });
      n.onclick = function(){ window.focus(); n.close(); };
    }
  }catch(e){}
}

// Arrived from a push notification -> go straight into the ringing state.
// Without this, tapping the notification just shows a silent app -- that is a notification, not an alarm.
function applyPendingRing(){
  if(!pendingRing || !DEMO || !DB) return;
  var id = pendingRing, a = null, L = DB.alarms || [];
  for(var i = 0; i < L.length; i++) if(L[i].id === id) a = L[i];
  pendingRing = 0;
  if(DB.quiet) return;                 // timetable only -> tapping in does not ring either
  DB.ringing   = true;
  DB.ringCh    = a ? (a.channels || 3) : 3;
  DB.ringLabel = (a && a.label) || t("alarm");
  if(S.status){
    S.status.ringing      = true;
    S.status.ringingCh    = DB.ringCh;
    S.status.ringingLabel = DB.ringLabel;
    paintRing();
  }
  // No S.status is fine: pull() runs every 3 seconds and the next round paints it
}

// The app was closed -> the service worker opens it with ?ring=12 in the URL
try{
  var mRing = location.search.match(/[?&]ring=(\d+)/);
  if(mRing){
    pendingRing = parseInt(mRing[1], 10) || 0;
    // Wipe the URL, or a refresh rings all over again
    history.replaceState(null, "", location.pathname);
  }
}catch(e){}

// The app was already open (just in the background) -> the service worker messages it directly
try{
  navigator.serviceWorker.addEventListener("message", function(e){
    if(e.data && e.data.ring){ pendingRing = e.data.ring | 0; applyPendingRing(); }
  });
}catch(e){}

// Unlock the audio on first touch. capture + once, so any tap counts.
["pointerdown", "touchstart", "keydown"].forEach(function(ev){
  try{ document.addEventListener(ev, unlockAudio, { capture:true, once:true }); }catch(e){}
});

// ============================================================
//  One session: one class on one day (cancel / restore / edit)
//  S.skips holds ["3|2026-08-18", ...], which is quick to look up
// ============================================================
function skipKey(id, iso){ return id + "|" + iso; }
function isoOf(i){ var p = idxParts(i); return p.y + "-" + pad(p.m) + "-" + pad(p.d); }

function pullSkips(){
  return api("/api/skips").then(function(list){
    S.skips = {};
    list.forEach(function(x){ S.skips[skipKey(x.id, x.date)] = 1; });
    paintBody();
  }).catch(function(){});
}

// Is this day on the exception list?
function hasException(a, dayIdxVal){
  return !!S.skips[skipKey(a.id, isoOf(dayIdxVal))];
}

// Does this class normally happen? Anything unset counts as "yes" (for older data)
function defOnOf(a){ return a.defOn !== false; }

// ============================================================
//  Public holidays
//
//  Why this is not just a pile of cancelled sessions: a public holiday wipes
//  out every class that day. Eight taps a day, twenty-four days a year, and
//  the whole lot again next year. A holiday belongs to the DATE, not to any
//  one class, so it is stored as a list of dates and applied on top.
//
//  It only cancels CLASSES -- alarms owned by student / teacher mode. Waking
//  up and taking medication still matter on a public holiday, so a plain
//  alarm must not be switched off by one. One-off events (an exam, a
//  deadline) name their own date, so they are left alone too.
//
//  The same rule lives in lib/alarm-logic.mjs and alarm-rules.h
//  (firmware); tools/test-push.mjs and tools/test-firmware-parity.mjs fail
//  if the three stop agreeing.
// ============================================================
function holidayName(dayIdxVal){
  var iso = isoOf(dayIdxVal), L = (S.holi && S.holi.list) || [];
  for(var i = 0; i < L.length; i++)
    if(L[i].date === iso) return L[i].name || t("holiName");
  return "";
}

// Is this session off because of a holiday?
function holidayOff(a, dayIdxVal){
  if(!S.holi || !S.holi.off) return false;
  if((a.owner || 0) === 0) return false;      // plain alarms are unaffected
  if(a.days === 0)         return false;      // one-off events are unaffected
  return !!holidayName(dayIdxVal);
}

// The "Holiday - name" badge for a calendar cell; empty when it is a normal day.
function holiTagHTML(dayIdxVal){
  var n = holidayName(dayIdxVal);
  return n ? '<span class="holitag">' + esc(t("holiTag")) + " \u00b7 " + esc(n) + '</span>' : "";
}

// Does it actually happen on this day?
//   normally on  -> in the exception list = cancelled
//   normally off -> in the exception list = this is the week it happens
// One-off events (days === 0) have no "normally", so they always count as "normally on".
function runsOn(a, dayIdxVal){
  if(holidayOff(a, dayIdxVal)) return false;     // public holiday -> no classes that day
  var listed = hasException(a, dayIdxVal);
  return (a.days === 0 || defOnOf(a)) ? !listed : listed;
}

// Should the screen show it as "no class"?
function isSkipped(a, dayIdxVal){ return !runsOn(a, dayIdxVal); }

// Flip "does this class run on this day".
// The switch on the timetable row and the "cancel this one" button in the sheet
// both come through here -- the same action in two places has to do the same thing.
function toggleSkip(a, dayIdxVal){
  var iso = isoOf(dayIdxVal);

  // What gets flipped is "is it listed as an exception", not "does it run".
  // For a class that normally runs, listing it = cancelled; for one that
  // normally does not (Tutorial / Practical), listing it = on just this week.
  // Flipping on "does it run" instead makes the second kind read as being put
  // back to its default, so pressing it does nothing at all.
  var listed = !hasException(a, dayIdxVal);

  // Update the local screen first, which feels quicker; roll back if it fails
  if(listed) S.skips[skipKey(a.id, iso)] = 1;
  else       delete S.skips[skipKey(a.id, iso)];
  var willRun = runsOn(a, dayIdxVal);        // does it run once the flip is applied
  paintBody();

  api("/api/skips", {
    method: "POST",
    body: JSON.stringify({ id: a.id, date: iso, skip: listed })
  }).then(function(){
    toast(willRun ? t("tRestored") : t("tCancelled"));
  }).catch(function(){
    if(listed) delete S.skips[skipKey(a.id, iso)];
    else       S.skips[skipKey(a.id, iso)] = 1;
    paintBody();
    toast(t("tSaveFail"));
  });
}

// How many classes this week are marked "no class" (the normally-off kind do not count)
function countOffInWeek(w){
  var first = S.sem.enabled ? weekFirstDay(w) : anchorOf(curDay()), c = 0;
  for(var k = 0; k < 7; k++){
    var i = first + k;
    classesOnDay(i, w).forEach(function(a){
      if(defOnOf(a) && !runsOn(a, i)) c++;
    });
  }
  return c;
}

// Which classes fall on a given day (shared by the week view and "no class this week")
function classesOnDay(dayI, w){
  var p = idxParts(dayI);
  return mine().filter(function(a){
    if(a.days === 0) return a.date === p.y + "-" + pad(p.m) + "-" + pad(p.d);
    return (a.days & (1 << p.wd)) && runsInWeek(a, w);
  }).sort(byTime);
}

// The normally-off kind (Tutorial / Practical) only reach the calendar once a week is marked "on".
// The "which class is off this week" sheet has to show all of them, so that one uses classesOnDay.
function shownOnDay(dayI, w){
  return classesOnDay(dayI, w).filter(function(a){
    return defOnOf(a) || runsOn(a, dayI);
  });
}

// ============================================================
//  Cloud account (Supabase)
//
//  Design trade-off: the whole state is one JSON row, not a set of relational tables.
//    - one person has roughly 50 alarms; splitting them up only invites trouble
//    - later the ESP32 fetches one JSON and has everything, with no SQL to assemble
//    - the save format is identical to the demo's, so the whole engine is reused --
//      the only difference is localStorage versus the cloud
//
//  The URL and key are pasted by the user (and kept on this phone), not hard-coded:
//  switching to another Supabase project needs no reflash.
// ============================================================
// karwan5880: no hosted backend. Cloud UI stays in the file but stays off.
// The old cloud era: a sheet where you pasted a URL and a key, hosted Web
// Push, and a timetable that lived in Postgres. All of that stays off.
// The account screen added on 2026-08-24 is NOT this -- it reads
// DEFAULT_CLOUD_URL / DEFAULT_CLOUD_KEY and talks to Supabase Auth only.
var CLOUD_OFF = true;

// Nothing on this phone is uploaded. `CLOUD.on` means "there is a
// session", not "we are syncing" -- keep the two apart, because the day
// sync is switched on it should be a decision with its own tables and its
// own row-level security, not a side effect of signing in.
var SYNC_OFF = true;

// Sign-in is Google and nothing else for now (2026-08-24). The password
// form, the student-ID rules and the address-building around them are
// still here, still tested, and switched off behind this one flag --
// bringing them back is `true` plus a look at meHtml(), not a rewrite.
// Why: a demo that asks a stranger for a student ID they do not have is
// a demo they cannot open.
var PW_LOGIN = false;
// Filled in at build time from src/supabase.json (git-ignored). Empty
// means the account screen says "not configured" and the rest of Pocket
// carries on exactly as before -- signing in is optional by design, so a
// missing project must never be able to break a demo.
var DEFAULT_CLOUD_URL = "";
var DEFAULT_CLOUD_KEY = "";

// A Supabase account has to be an email address. But the user does not want to type an email,
// so internally the username gets a fixed domain appended -- the screen only ever shows the username.
//
//   vanny  ->  vanny@baobaoxiang.app
//
// The cost: no real inbox = no "forgot password" mail. Sign-up says so plainly.
var USER_DOMAIN = "baobaoxiang.app";

// Username rules: 3-20 characters, letters/digits plus . _ -, starting and ending alphanumeric.
// Everything is lowercased, so Vanny and vanny do not become two accounts.
function normUser(u){ return String(u || "").trim().toLowerCase(); }

function validUser(u){
  u = normUser(u);
  if(u.length < 3 || u.length > 20) return false;
  if(!/^[a-z0-9][a-z0-9._-]*[a-z0-9]$/.test(u)) return false;
  return true;
}

function userToEmail(u){ return normUser(u) + "@" + USER_DOMAIN; }

// Does what they typed look like an email (an @ in the middle, a dot after it)?
function isEmailLike(v){
  return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v || "").trim());
}

// Accept whatever they type and turn it into the email Supabase wants.
//   vanny            -> vanny@baobaoxiang.app   (internal, never shown)
//   me@gmail.com     -> me@gmail.com            (a real inbox, so the password can be reset)
function toAuthEmail(v){
  v = String(v || "").trim();
  return isEmailLike(v) ? v.toLowerCase() : userToEmail(v);
}

// What to show on screen
function toDisplayName(v){
  v = String(v || "").trim();
  return isEmailLike(v) ? v.split("@")[0] : normUser(v);
}

// Was this account opened with a real inbox? (decides whether the password can be reset)
function hasRealEmail(){
  return !!CLOUD.email && CLOUD.email.indexOf("@" + USER_DOMAIN) < 0;
}

// What to prefill the login field with
function cloudHandle(){
  if(!CLOUD.email) return "";
  return hasRealEmail() ? CLOUD.email : emailToUser(CLOUD.email);
}
function emailToUser(e){
  e = String(e || "");
  var at = e.indexOf("@");
  return at > 0 ? e.slice(0, at) : e;
}

var CLOUD = { url:"", key:"", token:"", refresh:"", uid:"", email:"", on:false };
var cloudTab = "login", cloudMsg = null, cloudSaveTimer = null;

// * NEVER write upward before successfully reading the cloud copy *
//   For the first second or two after opening the app, what is on screen may still be empty
//   (or only a local cache). Pushing that up would paint over the real cloud data --
//   and the user sees "I definitely logged in, and my timetable vanished by itself".
//   This only turns true once cloudPull() has actually read something.
var cloudReady = false;

// Roles are also kept separately on this phone.
// Why a second copy: the alarm data can be cleared, reset, or moved to another backend,
// but "I am a student" should not have to be asked again because of that. The user's words: "I picked once, stop asking".
function loadRoleLocal(){
  try{
    var r = parseInt(localStorage.getItem("clockRoles"), 10);
    S.roleLocal = (isNaN(r) ? 0 : r) & 7;
  }catch(e){ S.roleLocal = 0; }
}
function saveRoleLocal(r){
  S.roleLocal = r & 7;
  try{ localStorage.setItem("clockRoles", String(S.roleLocal)); }catch(e){}
}

function cloudLoadCfg(){
  try{
    CLOUD.url     = localStorage.getItem("cloudUrl")   || "";
    CLOUD.key     = localStorage.getItem("cloudKey")   || "";
    CLOUD.token   = localStorage.getItem("cloudTok")   || "";
    CLOUD.refresh = localStorage.getItem("cloudRef")   || "";
    CLOUD.uid     = localStorage.getItem("cloudUid")   || "";
    CLOUD.email   = localStorage.getItem("cloudEmail") || "";
  }catch(e){}
  CLOUD.name = emailToUser(CLOUD.email);
  if(!CLOUD.url) CLOUD.url = DEFAULT_CLOUD_URL;
  if(!CLOUD.key) CLOUD.key = DEFAULT_CLOUD_KEY;
  CLOUD.on = !!(CLOUD.url && CLOUD.key && CLOUD.token && CLOUD.uid);
}
function cloudSaveCfg(){
  try{
    localStorage.setItem("cloudUrl",   CLOUD.url);
    localStorage.setItem("cloudKey",   CLOUD.key);
    localStorage.setItem("cloudTok",   CLOUD.token);
    localStorage.setItem("cloudRef",   CLOUD.refresh);
    localStorage.setItem("cloudUid",   CLOUD.uid);
    localStorage.setItem("cloudEmail", CLOUD.email);
  }catch(e){}
  CLOUD.on = !!(CLOUD.url && CLOUD.key && CLOUD.token && CLOUD.uid);
}

// A trailing slash on the URL is the commonest paste mistake, so trim it
function cleanUrl(u){ return String(u || "").trim().replace(/\/+$/, ""); }

// The middle segment of a JWT is the payload, and the user id is in sub
function jwtSub(tok){
  try{
    var b = tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    while(b.length % 4) b += "=";
    return JSON.parse(decodeURIComponent(escape(atob(b)))).sub || "";
  }catch(e){ return ""; }
}

// The address Google (or any provider) gave us. A token from an OAuth
// redirect arrives on its own -- there is no /user response beside it --
// so the claim inside the token is the only thing that names the account.
function jwtEmail(tok){
  try{
    var b = tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    while(b.length % 4) b += "=";
    return JSON.parse(decodeURIComponent(escape(atob(b)))).email || "";
  }catch(e){ return ""; }
}

// When the token expires (milliseconds). Unparseable -> 0.
function jwtExp(tok){
  try{
    var b = tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    while(b.length % 4) b += "=";
    var e = JSON.parse(decodeURIComponent(escape(atob(b)))).exp;
    return e ? e * 1000 : 0;
  }catch(e){ return 0; }
}

// Is this error "you really do have to log in again", or just "cannot reach it right now"?
// Confusing the two turns a flaky network into a logout, and the user sees data disappear -- the least acceptable outcome.
function isAuthError(err){
  if(!err) return false;
  if(err.status === 401 || err.status === 403) return true;
  var m = String(err.message || "").toLowerCase();
  return m.indexOf("invalid refresh") >= 0 ||
         m.indexOf("refresh_token_not_found") >= 0 ||
         m.indexOf("token has expired") >= 0 ||
         m.indexOf("jwt expired") >= 0;
}

// A network problem (no route, timeout, DNS...) -- this must never count as a logout
function isNetError(err){
  var m = String((err && err.message) || "").toLowerCase();
  return m.indexOf("failed to fetch") >= 0 ||
         m.indexOf("networkerror") >= 0 ||
         m.indexOf("load failed") >= 0 ||
         m.indexOf("timeout") >= 0;
}

function cloudHeaders(withAuth){
  var h = { "apikey": CLOUD.key, "Content-Type": "application/json" };
  if(withAuth && CLOUD.token) h["Authorization"] = "Bearer " + CLOUD.token;
  return h;
}

function cloudFetch(path, opt, withAuth){
  return fetch(CLOUD.url + path, {
    method:  (opt && opt.method) || "GET",
    headers: Object.assign(cloudHeaders(withAuth !== false), (opt && opt.headers) || {}),
    body:    opt && opt.body
  }).then(function(r){
    return r.text().then(function(txt){
      var j = null;
      try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
      if(!r.ok){
        var m = (j && (j.msg || j.message || j.error_description || j.error)) ||
                ("HTTP " + r.status);
        var err = new Error(m); err.status = r.status; throw err;
      }
      return j;
    });
  });
}

// ---------- Sign up / log in / log out ----------
// Supabase answers in English and very technically; showing that raw to the user is pointless.
// Anything unrecognised is passed through as-is (at least it is a clue to search for).
function cloudErr(msg){
  var m = String(msg || "").toLowerCase();
  if(m.indexOf("already registered") >= 0 ||
     m.indexOf("already exists") >= 0)          return t("eTaken");
  if(m.indexOf("invalid login") >= 0)           return t("eWrong");
  if(m.indexOf("password") >= 0 &&
     m.indexOf("least") >= 0)                   return t("eShortPw");
  if(m.indexOf("email") >= 0 &&
     m.indexOf("invalid") >= 0)                 return t("eBadUser");
  if(m.indexOf("confirm") >= 0)                 return t("eConfirm");
  if(m.indexOf("rate limit") >= 0 ||
     m.indexOf("too many") >= 0)                return t("eTooMany");
  if(m.indexOf("failed to fetch") >= 0 ||
     m.indexOf("networkerror") >= 0)            return t("eNet");
  return msg;
}

function cloudSignup(email, pw){
  return cloudFetch("/auth/v1/signup", {
    method:"POST", body: JSON.stringify({ email: email, password: pw })
  }, false).then(function(j){
    // With email verification enabled on the project, no token comes back here
    if(j && j.access_token) return cloudSession(j);
    return { needVerify: true };
  });
}

// ============================================================
//  Who you are
//  Pocket's first real service. Everything above this line runs on the
//  phone; from here down there is a Supabase project on the other end.
//
//  Three ideas, and they are separate on purpose:
//    1. WHAT YOU TYPE  -- a student ID (2601114) or a UTAR email. The ID
//       becomes an address Supabase will accept; see toAuthEmail().
//    2. WHAT PROVES IT -- a password, then a six-digit code from an
//       authenticator app. Supabase calls the second one MFA and stamps
//       the token aal2; a password alone is aal1 and is not enough.
//    3. WHAT SKIPS IT  -- a passkey. Face ID, a fingerprint, Windows
//       Hello. It is a *device* unlock over a session you already hold,
//       not a factor the server checks, and this file says so in the
//       one place a reader might assume otherwise.
//
//  Signing in is optional. Nothing on the home needs it, and if the
//  project is paused or the wi-fi is bad the other 24 apps do not care.
// ============================================================

// UTAR addresses, and nothing else. This check is a courtesy -- it saves
// a round trip and gives a better message than the server's. It is NOT
// the enforcement: anyone can POST to the API directly, so the real gate
// is the trigger on auth.users in docs/AUTH-SETUP.md. Never move a rule
// like this into the page and call it done.
var UTAR_DOMAINS = ["1utar.my", "utar.edu.my", "student.utar.edu.my"];
function isUtarEmail(v){
  v = String(v || "").trim().toLowerCase();
  var at = v.lastIndexOf("@");
  if(at < 1) return false;
  var d = v.slice(at + 1);
  for(var i = 0; i < UTAR_DOMAINS.length; i++) if(d === UTAR_DOMAINS[i]) return true;
  return false;
}

// A student ID: digits only, the length UTAR actually issues.
function isStudentId(v){ return /^\d{6,10}$/.test(String(v || "").trim()); }

// What may be typed into the one field. It used to be a UTAR address or
// a student ID and nothing else; that shut out everybody who is not at
// UTAR, which is most people who will ever be shown this. Now: any real
// email address, any student ID, or a plain username -- toAuthEmail()
// turns the last two into an address Supabase will take.
//
// isUtarEmail() and isStudentId() are kept: they still say which kind of
// thing was typed, which the ID card and the timetable import both ask.
function loginIdOk(v){
  v = String(v || "").trim();
  return isStudentId(v) || isEmailLike(v) || validUser(v);
}

// The assurance level the token carries. aal1 = password only,
// aal2 = the second factor was answered.
function jwtAal(tok){
  try{
    var b = tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    while(b.length % 4) b += "=";
    return JSON.parse(decodeURIComponent(escape(atob(b)))).aal || "aal1";
  }catch(e){ return "aal1"; }
}

var AUTH = {
  step: "in",        // in | code | enrol | done
  msg: "",
  busy: false,
  factor: "",        // the TOTP factor being challenged or enrolled
  chal: "",          // the challenge id that goes with it
  qr: "",            // enrolment QR, wrapped into a data URI by qrSrc()
  secret: "",        // the same secret in text, for a keyboard
  hasFactor: false,  // a verified TOTP factor exists on this account
  locked: false      // a passkey is enrolled and has not been answered yet
};

function authReady(){ return !!(CLOUD.url && CLOUD.key); }
function signedIn(){ return !!(CLOUD.token && CLOUD.uid); }
// "In and usable". Two-factor is offered, not demanded -- a proof of
// concept that will not let you past the door because you have not
// installed an authenticator app is a proof of nothing. Once a factor
// IS enrolled it is enforced: the token has to reach aal2.
function twoFactorOn(){ return !!AUTH.hasFactor; }
function fullyIn(){
  if(!signedIn() || AUTH.locked) return false;
  return twoFactorOn() ? jwtAal(CLOUD.token) === "aal2" : true;
}

// ---------- Second factor: TOTP ----------
// Supabase's own MFA. No SMS provider, no codes table of ours, no email
// round trip -- the phone and the server agree on a clock and a secret.

function mfaFactors(){
  return cloudFetch("/auth/v1/user", {}, true).then(function(u){
    return (u && u.factors) || [];
  });
}
function mfaVerified(list){
  return (list || []).filter(function(f){
    return f.factor_type === "totp" && f.status === "verified";
  });
}
// Supabase hands the enrolment QR back as **raw SVG markup** -- an actual
// "<?xml ...><svg>...</svg>" string, not a data URI. Putting that into
// <img src> renders nothing at all, which is exactly what it did: the
// enrolment succeeded, the code was live, and the box was blank. Wrap it
// so <img> can take it, and pass a real data URI through untouched in
// case a future version returns one.
function qrSrc(v){
  v = String(v || "");
  if(!v) return "";
  if(v.slice(0, 5) === "data:") return v;
  if(v.charAt(0) !== "<") return v;
  try{
    return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(v)));
  }catch(e){ return ""; }
}

function mfaEnrol(){
  return cloudFetch("/auth/v1/factors", {
    method:"POST",
    body: JSON.stringify({ factor_type:"totp", friendly_name:"Pocket " + Date.now() })
  }, true);
}
function mfaChallenge(id){
  return cloudFetch("/auth/v1/factors/" + encodeURIComponent(id) + "/challenge",
    { method:"POST" }, true);
}
function mfaVerify(id, chal, code){
  return cloudFetch("/auth/v1/factors/" + encodeURIComponent(id) + "/verify", {
    method:"POST",
    body: JSON.stringify({ challenge_id: chal, code: String(code || "").trim() })
  }, true).then(cloudSession);
}
// An enrolment that was started and abandoned leaves an unverified factor
// behind, and Supabase refuses to enrol a second one. Clear it first.
function mfaDrop(id){
  return cloudFetch("/auth/v1/factors/" + encodeURIComponent(id), { method:"DELETE" }, true)
    .catch(function(){ return null; });
}

// ---------- Passkey ----------
// Face ID / fingerprint / Windows Hello. Read the note at the top of this
// section: this unlocks a session this device already has. It is not a
// factor, the server never sees it, and it can never stand in for the
// TOTP code at sign-in.

function b64u(buf){
  var b = "", a = new Uint8Array(buf), i;
  for(i = 0; i < a.length; i++) b += String.fromCharCode(a[i]);
  return btoa(b).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64u(str){
  var b = String(str || "").replace(/-/g, "+").replace(/_/g, "/");
  while(b.length % 4) b += "=";
  var raw = atob(b), a = new Uint8Array(raw.length), i;
  for(i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
  return a.buffer;
}
function rand32(){
  var a = new Uint8Array(32);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return a.buffer;
}
function pkSupported(){
  return typeof window !== "undefined" &&
         !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
}
function pkId(){ try{ return localStorage.getItem("pocketPk") || ""; }catch(e){ return ""; } }
function pkOn(){ return !!pkId(); }

function pkEnrol(){
  if(!pkSupported()) return Promise.reject(new Error("no webauthn"));
  var uid = new TextEncoder().encode(CLOUD.uid || "pocket");
  return navigator.credentials.create({ publicKey: {
    challenge: rand32(),
    rp: { name: "Pocket" },
    user: { id: uid, name: CLOUD.email || "pocket", displayName: toDisplayName(CLOUD.email) },
    pubKeyCredParams: [{ type:"public-key", alg:-7 }, { type:"public-key", alg:-257 }],
    authenticatorSelection: {
      authenticatorAttachment: "platform",
      userVerification: "required",
      residentKey: "preferred"
    },
    timeout: 60000,
    attestation: "none"
  }}).then(function(cred){
    if(!cred) throw new Error("cancelled");
    try{ localStorage.setItem("pocketPk", b64u(cred.rawId)); }catch(e){}
    return true;
  });
}

function pkUnlock(){
  var id = pkId();
  if(!id || !pkSupported()) return Promise.reject(new Error("no passkey"));
  return navigator.credentials.get({ publicKey: {
    challenge: rand32(),
    allowCredentials: [{ type:"public-key", id: unb64u(id) }],
    userVerification: "required",
    timeout: 60000
  }}).then(function(a){
    if(!a) throw new Error("cancelled");
    AUTH.locked = false;
    return true;
  });
}

function pkForget(){
  try{ localStorage.removeItem("pocketPk"); }catch(e){}
  AUTH.locked = false;
}

// ---------- Sign in with Google ----------
// Supabase does the whole dance; this app only has to leave and come back.
//
//   1. Send the browser to /auth/v1/authorize?provider=google
//   2. Google asks the user; Supabase makes the account if it is new
//   3. Supabase sends the browser back to redirect_to with the session
//      in the URL **fragment**: #access_token=...&refresh_token=...
//
// The fragment is the point. It never reaches any server, not even the
// one hosting this page -- which is why no client secret lives in this
// file, and why none is needed.
//
// We come back to the page we left, without query or fragment. That
// exact address has to be listed in the Supabase dashboard under
// Redirect URLs or the round trip ends on an error page. The steps are
// in docs/GOOGLE-AUTH.md.
function oauthRedirectUrl(){
  return location.origin + location.pathname;
}

function oauthUrl(provider, back){
  return CLOUD.url + "/auth/v1/authorize?provider=" + encodeURIComponent(provider) +
         "&redirect_to=" + encodeURIComponent(back || oauthRedirectUrl());
}

function oauthStart(provider){
  if(!authReady()){ AUTH.msg = t("meNoCfgT"); paintHome(); return; }
  AUTH.busy = true; AUTH.msg = t("meGGoing"); paintHome();
  location.href = oauthUrl(provider);
}

// Pull a session out of a URL. Handed the fragment (and the query, which
// is where a refused consent screen can put its error) as plain text, so
// it can be tested without a browser.
function oauthParse(hash, search){
  var out = {}, i, kv, parts = [];
  var h = String(hash || "").replace(/^#/, "");
  var q = String(search || "").replace(/^\?/, "");
  if(h) parts = parts.concat(h.split("&"));
  if(q) parts = parts.concat(q.split("&"));
  for(i = 0; i < parts.length; i++){
    if(!parts[i]) continue;
    kv = parts[i].split("=");
    try{ out[decodeURIComponent(kv[0])] = decodeURIComponent(String(kv[1] || "").replace(/\+/g, " ")); }
    catch(e){ out[kv[0]] = kv[1] || ""; }
  }
  if(out.error || out.error_description) return { error: out.error_description || out.error };
  if(out.access_token){
    return { access_token: out.access_token, refresh_token: out.refresh_token || "" };
  }
  return null;
}

// Called once on boot. Nothing in the URL -> nothing happens, and the app
// carries on exactly as it did before any of this existed.
function oauthReturn(){
  var r = null;
  try{ r = oauthParse(location.hash, location.search); }catch(e){ return false; }
  if(!r) return false;
  // Wipe the tokens out of the address bar before anything else: a
  // refresh must not replay them, and they must not sit in history.
  try{ history.replaceState(null, "", location.pathname); }catch(e){}
  if(r.error){ AUTH.msg = cloudErr(r.error) || t("meGFail"); return true; }
  cloudSession(r);
  // A passkey enrolled on this device does not have to be answered for
  // the sign-in that just happened -- the user is standing right here.
  AUTH.locked = false;
  authSettle();
  return true;
}

function cloudLogin(email, pw){
  return cloudFetch("/auth/v1/token?grant_type=password", {
    method:"POST", body: JSON.stringify({ email: email, password: pw })
  }, false).then(cloudSession);
}

var refreshTimer = null;

function cloudSession(j){
  CLOUD.token   = j.access_token || "";
  CLOUD.refresh = j.refresh_token || "";
  CLOUD.uid     = (j.user && j.user.id) || jwtSub(CLOUD.token);
  CLOUD.email   = (j.user && j.user.email) || jwtEmail(CLOUD.token) || CLOUD.email;
  CLOUD.name    = emailToUser(CLOUD.email);
  cloudSaveCfg();
  scheduleRefresh();
  return j;
}

// A Supabase access token lives for one hour by default.
// Waiting for it to expire means failing once every time -- so refresh five minutes early.
function scheduleRefresh(){
  if(refreshTimer){ clearTimeout(refreshTimer); refreshTimer = null; }
  if(!CLOUD.token || !CLOUD.refresh) return;

  var exp = jwtExp(CLOUD.token);
  if(!exp) return;

  var wait = exp - Date.now() - 5 * 60 * 1000;
  if(wait < 15000) wait = 15000;              // nearly expired already, so refresh at once
  if(wait > 45 * 60 * 1000) wait = 45 * 60 * 1000;

  refreshTimer = setTimeout(function(){
    refreshTimer = null;
    cloudRefresh().catch(function(err){
      if(isAuthError(err)) return cloudSessionLost();
      // Just unreachable -> try again in a minute, keep the session
      refreshTimer = setTimeout(scheduleRefresh, 60000);
    });
  }, wait);
}

// Coming back from sleep or returning to this tab, the token may already have expired.
// Near expiry, quietly swap it -- the user never notices.
function refreshIfStale(){
  if(!CLOUD.on || !CLOUD.token) return;
  var exp = jwtExp(CLOUD.token);
  if(exp && exp - Date.now() < 5 * 60 * 1000){
    cloudRefresh().catch(function(err){
      if(isAuthError(err)) cloudSessionLost();
    });
  }
}

// Genuinely logged out (even the refresh token is dead).
// Only now ask them to log in again, and leave the data on screen alone.
function cloudSessionLost(){
  CLOUD.token = ""; CLOUD.refresh = "";
  cloudReady = false;
  cloudSaveCfg();
  CLOUD.on = false;
  paintCloudBtn();
  toast(t("cLoggedOut"));
}

// Token expired, so trade the refresh token for a new one
function cloudRefresh(){
  if(!CLOUD.refresh) return Promise.reject(new Error("no refresh token"));
  return cloudFetch("/auth/v1/token?grant_type=refresh_token", {
    method:"POST", body: JSON.stringify({ refresh_token: CLOUD.refresh })
  }, false).then(cloudSession);
}

// Send a password reset mail. Only meaningful for accounts opened with a real inbox.
function cloudRecover(email){
  return cloudFetch("/auth/v1/recover", {
    method:"POST", body: JSON.stringify({ email: email })
  }, false);
}

function cloudLogout(){
  if(refreshTimer){ clearTimeout(refreshTimer); refreshTimer = null; }
  CLOUD.token = CLOUD.refresh = CLOUD.uid = CLOUD.email = "";
  try{ localStorage.removeItem("cloudCache"); }catch(e){}
  cloudSaveCfg();
  DEMO = false; demoTried = false; everOnline = false;
  location.reload();
}

// S.skips is a lookup table {"id|date":1}; the cloud stores an array, so convert before pushing
function skipsToList(){
  var out = [];
  for(var k in S.skips){
    if(!S.skips[k]) continue;
    var p = k.split("|");
    if(p.length === 2) out.push({ id: parseInt(p[0], 10), date: p[1] });
  }
  return out;
}

// Keep a local copy of whatever the cloud last returned.
// It carries us through a bad network, or the moment before the first connection --
// far better than showing a blank app (which reads as "my data is gone").
function cloudCacheSave(data){
  try{ localStorage.setItem("cloudCache", JSON.stringify(data)); }catch(e){}
}
function cloudCacheLoad(){
  try{
    var r = localStorage.getItem("cloudCache");
    return r ? JSON.parse(r) : null;
  }catch(e){ return null; }
}

// ---------- Reading and writing the whole state ----------
function cloudPull(){
  if(SYNC_OFF) return Promise.reject(new Error("sync off"));
  return cloudFetch("/rest/v1/user_state?select=data&user_id=eq." + CLOUD.uid)
    .then(function(rows){
      // A trigger creates the row at sign-up; if it did not, create it here
      if(!rows || !rows.length){
        cloudReady = true;                 // the cloud is definitely empty, so writing is safe
        return cloudPush(demoSeedEmpty()).then(function(){ return null; });
      }
      cloudCacheSave(rows[0].data);
      cloudReady = true;                   // we have seen the cloud copy, and only now may we write back
      return rows[0].data;
    });
}

function cloudPush(data){
  return cloudFetch(
    "/rest/v1/user_state?user_id=eq." + CLOUD.uid,
    { method:"PATCH", headers:{ "Prefer":"return=minimal" },
      body: JSON.stringify({ data: data }) }
  ).catch(function(err){
    // The row does not exist yet (the trigger never ran) -> insert it
    if(err.status === 404 || err.status === 406){
      return cloudFetch("/rest/v1/user_state", {
        method:"POST", headers:{ "Prefer":"return=minimal" },
        body: JSON.stringify({ user_id: CLOUD.uid, data: data })
      });
    }
    throw err;
  });
}

// Something changed -> push it 800ms later (a burst of edits does not become a burst of requests)
function cloudScheduleSave(){
  if(SYNC_OFF) return;   // belt and braces: nothing leaves this phone
  // The cloud copy has not been read yet -> save locally only and wait for cloudPull().
  // Without this line, the /api/mode the app sends on startup would push an empty state up.
  if(!cloudReady){ cloudCacheSave(DB); return; }
  if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(function(){
    cloudSaveTimer = null;
    cloudCacheSave(DB);                    // save locally first, the cloud can wait
    cloudPush(DB).catch(function(err){
      if(isAuthError(err)){
        // Token expired -> get a new one and save again
        return cloudRefresh()
          .then(function(){ return cloudPush(DB); })
          .catch(function(e2){
            if(isAuthError(e2)) cloudSessionLost();
            else cloudScheduleSave();       // unreachable -> try again shortly
          });
      }
      // Network trouble: do not alarm the user, just retry quietly (the local copy is already saved)
      if(isNetError(err)){ cloudScheduleSave(); return; }
      toast(t("cSaveFail"));
    });
  }, 800);
}

// ---------- Entering cloud mode ----------
function enterCloud(data){
  DEMO = true;              // the whole engine is the demo one; only the storage differs
  demoTried = true;
  DB = data || demoSeedEmpty();

// ============================================================
//  Push (reminders even with the app closed)
//
//  Why a server is unavoidable:
//    once the page is closed no code of ours runs, and the phone will not wake itself at 08:00.
//    Something outside has to push to it -- that is push-alarms on Supabase.
//
//  This side does two things only:
//    1. ask the browser for a "push address"
//    2. store that address and the time zone in the cloud, so the server knows where to push and what the local time is
// ============================================================
var VAPID_PUBLIC = "BN5ne9XHo_flJnoAdDBHWebJDL-UMOGvbAsUQXLI9ap4cqfVVBa1KV_rwUZlPYiiuN6vsWCpqLdHOZb5UEGOBgU";

// base64url -> Uint8Array (the format the browser wants)
function b64ToBytes(b64){
  var pad = "=".repeat((4 - b64.length % 4) % 4);
  var raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  var out = new Uint8Array(raw.length);
  for(var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

function pushSupported(){
  return ("serviceWorker" in navigator) &&
         ("PushManager" in window) &&
         ("Notification" in window);
}

// Push only arrives once it is installed to the home screen (required on iOS, steadier on Android too)
function isStandalone(){
  try{
    return window.matchMedia("(display-mode: standalone)").matches ||
           navigator.standalone === true;
  }catch(e){ return false; }
}

var pushState = "unknown";   // unknown / off / on / denied / unsupported / needinstall

function pushStatus(){
  if(!pushSupported()) return "unsupported";
  if(Notification.permission === "denied") return "denied";
  return pushState;
}

// Has this device ever subscribed?
function pushCheck(){
  if(!pushSupported()){ pushState = "unsupported"; return Promise.resolve(pushState); }
  return navigator.serviceWorker.ready
    .then(function(reg){ return reg.pushManager.getSubscription(); })
    .then(function(sub){
      pushState = sub ? "on" : "off";
      return pushState;
    })
    .catch(function(){ pushState = "off"; return pushState; });
}

// Everything the server needs to know about this device.
//
// The time zone is here because the server cannot otherwise tell what "8 in
// the morning" means. The language is here because the notification it writes
// has to be readable -- an English user was getting Chinese on the lock screen.
function pushDetails(sub){
  var j = sub.toJSON();
  var tz = "";
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; }catch(e){}
  return {
    user_id:   CLOUD.uid,
    endpoint:  j.endpoint,
    p256dh:    j.keys.p256dh,
    auth:      j.keys.auth,
    tz:        tz || "Asia/Kuala_Lumpur",
    // getTimezoneOffset is "minutes behind UTC", the opposite direction, hence the minus sign
    tz_offset: -new Date().getTimezoneOffset(),
    lang:      lang === "zh" ? "zh" : "en",
    label:     isStandalone() ? "home screen" : "browser",
    fail_count: 0
  };
}

function pushSave(sub){
  var row = pushDetails(sub);
  try{ localStorage.setItem("pushEndpoint", row.endpoint); }catch(e){}
  return cloudFetch("/rest/v1/push_subs?on_conflict=endpoint", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(row)
  });
}

function pushForget(endpoint){
  return cloudFetch("/rest/v1/push_subs?endpoint=eq." + encodeURIComponent(endpoint), {
    method: "DELETE", headers: { "Prefer": "return=minimal" }
  }).catch(function(){});
}

// Turn push on. Must be triggered by a user tap (browser rule).
function pushEnable(){
  if(CLOUD_OFF) return Promise.reject(new Error("nologin"));
  if(!pushSupported())  return Promise.reject(new Error("unsupported"));
  if(!CLOUD.on)         return Promise.reject(new Error("nologin"));

  return Notification.requestPermission().then(function(p){
    if(p !== "granted") throw new Error("denied");
    return navigator.serviceWorker.ready;
  }).then(function(reg){
    return reg.pushManager.getSubscription().then(function(existing){
      if(existing) return existing;
      return reg.pushManager.subscribe({
        userVisibleOnly: true,                    // a notification must actually be shown, no silent pushes
        applicationServerKey: b64ToBytes(VAPID_PUBLIC)
      });
    });
  }).then(pushSave).then(function(){
    pushState = "on";
    return pushState;
  });
}

// ---------- Keeping the subscription true ----------
//
// A push subscription is not permanent. Browsers rotate the endpoint on their
// own -- after a long idle spell, a storage clear, a browser update. When that
// happens the row in push_subs points at an address that no longer exists, the
// push service answers 410, and reminders stop. Nothing reports it: the app
// still says push is on, and the alarms simply never arrive.
//
// So every time the app opens we reconcile what the browser actually has
// against what the server was told:
//
//   subscription gone, but permission still granted -> subscribe again
//   endpoint changed                                -> save the new one, delete the old
//   endpoint the same                               -> still rewrite the row, because
//                                                      the time zone or language may
//                                                      have changed since (travel,
//                                                      daylight saving, the EN/中 button)
//
// The service worker re-subscribes the moment the browser tells it the
// subscription changed (see pushsubscriptionchange in tools/build-demo.js); it
// has no login of its own, so writing that new address to the server is this
// function's job, on the next open.
function pushSync(){
  if(!pushSupported() || !CLOUD.on) return Promise.resolve(pushState);
  if(Notification.permission !== "granted"){ return pushCheck(); }

  var old = null;
  try{ old = localStorage.getItem("pushEndpoint"); }catch(e){}

  return navigator.serviceWorker.ready
    .then(function(reg){
      return reg.pushManager.getSubscription().then(function(sub){
        // Permission is granted and this device had push on before, so a missing
        // subscription means the browser dropped it. Take it back.
        if(!sub && old){
          return reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: b64ToBytes(VAPID_PUBLIC)
          }).catch(function(){ return null; });
        }
        return sub;
      });
    })
    .then(function(sub){
      if(!sub){ pushState = "off"; return pushState; }
      return pushSave(sub).then(function(){
        // The old row would otherwise sit there for twenty failed pushes.
        if(old && old !== sub.endpoint) return pushForget(old);
      }).then(function(){
        pushState = "on";
        return pushState;
      });
    })
    .catch(function(){ return pushCheck(); });
}

function pushDisable(){
  return navigator.serviceWorker.ready
    .then(function(reg){ return reg.pushManager.getSubscription(); })
    .then(function(sub){
      if(!sub) return null;
      var ep = sub.endpoint;
      return sub.unsubscribe().then(function(){
        // Forget it locally too, or pushSync() would resubscribe on the next open.
        try{ localStorage.removeItem("pushEndpoint"); }catch(e){}
        return pushForget(ep);
      });
    })
    .then(function(){ pushState = "off"; return pushState; });
}

  box.querySelectorAll("[data-ct]").forEach(function(b){

  // Say, as they type, which kind of account this will create

  // Forgot password: only sendable for accounts with a real inbox
  if($("cForgot")) $("cForgot").onclick = function(){
    var v = ($("cUser").value || "").trim();
    if(!isEmailLike(v)){ cloudSay(t("cForgotNeedEmail")); return; }
    cloudSay(t("cWorking"), "busy");
    cloudRecover(v.toLowerCase())
      .then(function(){ cloudSay(t("cForgotSent", v), "ok"); })
      .catch(function(err){ cloudSay(esc(cloudErr(err.message))); });
  };

  // Show / hide the password
  $("cEye").onclick = function(){
    var f = $("cPass");
    var show = f.type === "password";
    f.type = show ? "text" : "password";
    $("cEye").textContent = t(show ? "cHide" : "cShow");
  };

  $("cGo").onclick = function(){
    var raw = ($("cUser").value || "").trim();
    var pw  = $("cPass").value || "";

    // An email is taken as-is; anything else is checked against the username rules
    if(!isEmailLike(raw) && !validUser(raw)){ cloudSay(t("cBadUser")); return; }
    if(pw.length < 6){ cloudSay(t("cBadPass")); return; }

    var em = toAuthEmail(raw);
    var un = toDisplayName(raw);
    CLOUD.email = em;
    CLOUD.name  = un;
    $("cGo").disabled = true;
    cloudSay(t("cWorking"), "busy");

    var go = (cloudTab === "signup") ? cloudSignup(em, pw) : cloudLogin(em, pw);

    go.then(function(res){
      if(res && res.needVerify){ cloudSay(t("cVerify"), "ok"); return; }
      return cloudPull().then(function(data){
        // * WHAT IS ALREADY ON SCREEN MUST NEVER SILENTLY VANISH *
        //   The cloud is empty but there are alarms here -> ask first whether to take them up.
        var cloudEmpty = !data || !data.alarms || !data.alarms.length;
        var mine2      = (S.alarms || []).slice();

        var finish = function(){
          closeSheets();
          toast(t("cWelcome", un));
          // The cloud copy is authoritative, so pull again. But do not re-ask for roles --
          // if this phone remembers them, pull() reuses them.
          S.roleSet = false; S.roleAsked = false;
          return pull().then(pullSem).then(pullSkips).then(pullAlarms).then(pullRooms).then(pullHoli);
        };

        if(cloudEmpty && mine2.length){
          closeSheets();
          askSheet(
            t("cUpTitle"),
            t("cUpDesc", mine2.length),
            t("cUpYes"), t("cUpNo"),
            function(){                       // take them up
              var seed = data || demoSeedEmpty();
              seed.alarms = mine2;
              seed.skips  = skipsToList();
              seed.mode   = S.mode;
              seed.roles  = S.roles;
              seed.sem    = { enabled:S.sem.enabled, start:S.sem.start,
                              weeks:S.sem.weeks, weekStart:S.sem.weekStart,
                              offOutside:S.sem.offOutside };
              seed.nextId = mine2.reduce(function(m2, a){
                              return Math.max(m2, a.id || 0); }, 0) + 1;
              enterCloud(seed);
              cloudPush(seed)
                .then(function(){ toast(t("cUpOk", mine2.length)); })
                .catch(function(){ toast(t("cSaveFail")); });
              finish();
            },
            function(){                       // leave them; the cloud starts empty
              enterCloud(data);
              toast(t("cUpSkip"));
              finish();
            });
          return;
        }

        enterCloud(data);
        return finish();
      });
    }).catch(function(err){
      cloudSay(esc(cloudErr(err.message) || t("cFail")));
    }).then(function(){
      var b2 = $("cGo"); if(b2) b2.disabled = false;
    });
  };
}
