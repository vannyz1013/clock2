/* ---------- The quality floor ---------- */
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
/* No scrollbar chrome anywhere. A phone never shows a resting scrollbar,
   and a full-height inner pane with one reads as a web page instantly. */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
@media (prefers-reduced-motion:reduce){
  .homeTile,.homeNow.on,#stubStage,.shellRow,.idCard,.gpaHead,.feedCard,.statBox,
  .walletCard,.bub,#homeStub.pushing,#homeStub.popping{animation:none !important}
  *{transition-duration:1ms !important}
}
/* A tablet used to get five columns at 768px and six at 1024px, while
   PAGE_SIZE stayed at 16. Sixteen icons do not divide into five or six,
   so the last row of every page was a ragged stub that space-evenly then
   spread down the screen -- and on an iPad, which is pointer:coarse, the
   device frame below never came on, so the whole app stretched to 1180px
   as well. That combination is what "the iPad view is glitchy" was.
   Both rules are gone: an iPad now gets the frame, like every other
   screen bigger than a phone. */
@media (prefers-reduced-motion:reduce){
  .homeTile .icon,.homeTile:active .icon{transition:none;transform:none}
}

/* ============================================================
   Three sizes, one app
   ------------------------------------------------------------
   This used to draw a 390x844 phone with a bezel and a notch on any
   screen bigger than a phone, on the argument that a phone app
   stretched across a laptop reads as a web page. That was wrong about
   who uses this. Students open Pocket on a MacBook, on an iPad and on
   a phone in the same day, and on the laptop they were handed a
   picture of a phone sitting on a dark backdrop -- a demo of a demo.

   There is no frame now, and no second layout either. The panes were
   already centred columns (.wrap 640, .stubPane, .homeNow), so what
   changes with the screen is four numbers, declared here and read by
   everything below -- and by fitPage(), which asks for --home-cols
   rather than assuming four:

     --home-cols  icons across the springboard
     --icon       the rounded square itself; everything scales off it
     --cell       one column: the icon plus the air its label wants
     --col-gap    the space you actually see between two icons
     --row-gap    the space between a label and the icon under it
     --shell-w    the grid's width, and so the home's -- derived
     --pane-w     how wide an opened app's column is allowed to get

   Phone keeps four columns and the full screen. An iPad gets six and
   the full screen. A laptop gets eight in a centred canvas, which is a
   web app rather than a phone drawn on a desk.
   ============================================================ */
:root{
  /* A springboard is five numbers, and they are the ones a phone uses.
     iOS lays a 60pt icon on a 4-column grid with about 27pt of air
     between icons and a one-line label under each; the icon is the unit
     and everything else is proportional to it. --cell is one column: the
     icon plus the little extra its label wants. --col-gap is the air you
     actually see between two icons, which is what "too tight" was about
     -- it used to be 8px. */
  --home-cols:4;
  --icon:60px;
  --cell:72px;
  --col-gap:16px;
  --row-gap:22px;
  --pane-w:400px;
  /* Everything on the home is exactly as wide as the icon grid. Derived,
     not typed, so changing the column count moves all of it at once. */
  --shell-w:calc(var(--home-cols) * var(--cell)
                 + (var(--home-cols) - 1) * var(--col-gap));
}
/* iPad, and a laptop window dragged narrow. Portrait 820 and landscape
   1180 both land here or above, and neither gets a bezel any more. */
/* An iPad draws a bigger icon and gives it more room, the way iPadOS
   does -- the same grid, not a phone grid stretched. */
@media (min-width:700px){
  :root{--home-cols:6; --icon:72px; --cell:86px;
        --col-gap:22px; --row-gap:26px; --pane-w:560px}
}
/* Laptop and desktop. A 14" MacBook is 1512 logical points wide. */
@media (min-width:1100px){
  :root{--home-cols:8; --icon:76px; --cell:94px;
        --col-gap:22px; --row-gap:28px; --pane-w:680px}
  .homeTile .name{font-size:var(--fs-sm)}
}
/* The home is one column of blocks; on a wide screen every one of them
   centres on the same axis instead of the avatar and the language
   button flying to opposite corners of a 27" monitor. */
/* Everything but the pager is one grid wide and centred on it. The pager
   itself stays full width: a page is one scrollport, and the page's own
   padding is what centres the grid and puts the gap on the swipe seam.
   min() keeps a margin on a screen narrower than the grid. */
#pocketHome > .homeTop,
#pocketHome > #homeHits,
#pocketHome > .homeNow,
#pocketHome > .homeDots,
#pocketHome > .homeSearch{
  width:min(100% - 2 * var(--sp-4), var(--shell-w));margin-inline:auto}
/* The avatar and the language button line up with the first and last
   icon rather than with the edge of the column they sit in. */
#pocketHome > .homeTop{padding-inline:calc((var(--cell) - var(--icon)) / 2)}

/* A pointer that hovers is a laptop. Phones never see this, and it is
   the one affordance a desktop springboard is missing: on a phone you
   know a tile is a button because you can feel it. */
@media (hover:hover) and (pointer:fine){
  .homeTile .icon{transition:transform var(--mo-2) var(--ease),
                             box-shadow var(--mo-2) var(--ease)}
  .homeTile:hover .icon{transform:translateY(-3px) scale(1.04);
    box-shadow:0 16px 26px -12px rgba(12,40,70,.6),
               inset 0 1px 0 rgba(255,255,255,.34),
               inset 0 -1px 0 rgba(0,0,0,.14)}
  .homeTile:hover .name{color:var(--ac)}
  .hitRow:hover,.shellRow:hover{border-color:var(--ac)}
}

/* A bottom sheet that runs the full width of a monitor is a banner. It
   keeps the same gesture and the same animation, in a column. */
@media (min-width:700px){
  .sheet{max-width:560px;margin-inline:auto;border-radius:22px 22px 0 0}
}

/* The device status bar belonged to the frame and went with it. */
#deviceBar{display:none !important}

// The document itself must not scroll. iOS Safari still rubber-bands a
// `position:fixed` body if a touch starts at the top of an inner pane
// and has nowhere to go -- so stop that gesture before the page moves.
(function lockNativeShell(){
  try{
    var y0 = 0;
    document.addEventListener("touchstart", function(e){
      if(e.touches && e.touches.length) y0 = e.touches[0].clientY;
    }, {passive:true});
    document.addEventListener("touchmove", function(e){
      if(!e.touches || !e.touches.length) return;
      var t = e.target;
      if(!t){ e.preventDefault(); return; }
      var tag = (t.tagName || "").toLowerCase();
      if(tag === "input" || tag === "textarea" || tag === "select") return;
      var dy = e.touches[0].clientY - y0;
      var n = t;
      while(n && n !== document.body && n !== document.documentElement){
        if(n.nodeType !== 1){ n = n.parentNode; continue; }
        var st = window.getComputedStyle(n);
        var ox = st.overflowX, oy = st.overflowY;
        var canY = (oy === "auto" || oy === "scroll" || oy === "overlay") &&
                   n.scrollHeight > n.clientHeight + 1;
        if(canY){
          var top = n.scrollTop <= 0;
          var bot = n.scrollTop + n.clientHeight >= n.scrollHeight - 1;
          if(!(top && dy > 0) && !(bot && dy < 0)) return;
          n = n.parentNode;
          continue;
        }
        var canX = (ox === "auto" || ox === "scroll" || ox === "overlay") &&
                   n.scrollWidth > n.clientWidth + 1;
        if(canX) return;
        n = n.parentNode;
      }
      e.preventDefault();
    }, {passive:false});
    document.addEventListener("focusin", function(e){
      var el = e.target;
      if(!el || !el.scrollIntoView) return;
      var tag = (el.tagName || "").toLowerCase();
      if(tag !== "input" && tag !== "textarea" && tag !== "select") return;
      setTimeout(function(){
        try{ el.scrollIntoView({block:"center", inline:"nearest"}); }catch(err){}
      }, 280);
    });
  }catch(e){}
})();

     "<p>For a number not in the chips, type it and press <b>＋</b> (0–240 minutes).</p>"],

    ["The three modes",
     "<p>The first launch asks for your role. <b>Tick any combination</b>.</p>" +
     "<p>Each mode keeps <b>its own list</b>: your timetable won't clutter Normal mode.</p>" +
     "<p>But <b>every alarm rings no matter which mode you're in</b> — switching modes never silences a class.</p>" +
     "<p>Change your role with the <b>Role</b> button under the clock. Nothing gets deleted.</p>"],

    ["Importing a timetable",
     "<p>Upload a <code>.csv</code> / <code>.txt</code>, or <b>paste straight</b> from Excel or your campus portal. Three formats work:</p><ul>" +
     "<li>One class per line: <code>Mon 08:00 Maths @ A101</code></li>" +
     "<li>An Excel-style grid (weekdays across the top)</li>" +
     "<li>A portal table with Day + Time columns (understands AM/PM and the weeks column)</li></ul>" +
     "<p>Importing twice does <b>not</b> duplicate — the default is a smart merge. For existing duplicates press <b>🧹 Remove existing duplicates</b>.</p>" +
     "<p>Photos and PDFs aren't supported; copying text from the portal is faster and exact.</p>"],

    ["Weeks, semester, odd/even",
     "<p>Press the <b>week badge</b> under the clock: when week 1 starts, how many weeks, and which day a week starts on.</p>" +
     "<p>Then <code>W1 W2 W3 …</code> appears at the top — scroll it to any week.</p>" +
     "<p>Each class can run <b>every week, odd weeks, or even weeks</b>, matching <code>1,3,5…</code> and <code>2,4,6…</code> on your timetable.</p>"],

    ["Day / Week / Month",
     "<p>Three buttons above the timetable:</p><ul>" +
     "<li><b>Day</b> — one day at a time, arrows step through</li>" +
     "<li><b>Week</b> — all seven days, plus the <code>W1 W2 W3</code> strip</li>" +
     "<li><b>Month</b> — a full month grid with a dot per class. " +
     "Tap a day to select it (its classes list below); <b>tap again</b> to jump into Day view</li></ul>" +
     "<p>When you're not on today, a <b>Today</b> button appears to bring you back.</p>"],

    ["No class this week",
     "<p>Press <b>📌 No class this week?</b> above the timetable. It lists every class in the week — <b>tap to toggle</b>.</p>" +
     "<p>Only this week changes; <b>other weeks are untouched</b>. Cancelled ones show struck through; tap again to restore.</p>" +
     "<p>Tapping a class in the week view does the same thing.</p>"],

    ["Tutorials and practicals that only run some weeks",
     "<p>Some classes don't run weekly. Instead of cancelling them every week, <b>flip it around</b>.</p>" +
     "<p>Inside <b>📌 No class this week?</b> open <b>⚙ Which kinds are off by default</b> and set Tutorial or Practical to <b>off by default</b>.</p>" +
     "<p>Then those classes <b>stay off the calendar and never ring</b> — you just mark the weeks they do happen.</p>" +
     "<p>Kinds are detected from the name, so <code>EM Tutorial</code> and <code>MicroP Lab</code> are recognised.</p>"],

    ["Where reminders go",
     "<p><b>🔊 Device</b> — the ESP32's buzzer and LED. <b>Most reliable</b>: rings with your phone off.</p>" +
     "<p><b>📱 Phone</b> — browser notification and sound. Only while the page is open.</p>" +
     "<p>Each alarm picks its own. Both is fine; neither is not allowed.</p>"],

    ["Appearance",
     "<p>The <b>🎨</b> button, top left, switches form: Doraemon / Dorami / Fast asleep / Dorayaki / Anywhere Door.</p>" +
     "<p>Top right switches <b>Chinese / English</b>. Both are stored on your phone, so two people sharing a device can each pick their own.</p>"],

    ["Logging in (your timetable follows you)",
     "<p>The <b>☁</b> button, top left. Once you're logged in your timetable lives in the cloud, so " +
     "<b>it's there when you log in on another phone</b>.</p>" +
     "<p>First time you paste two values from a free Supabase project — that screen walks you through it, " +
      "and the long version is in <code>docs/DEPLOY.md</code>.</p>" +
     "<p>You don't have to log in: without it, data stays on this phone or on your ESP32.</p>" +
     "<p>When you get an ESP32 it pulls the same timetable down using your account — " +
     "<b>then it rings even with no internet and your phone off</b>.</p>"],

    ["Something missing? Check the top",
     "<p><b>Blue DEMO banner</b> = never reached a device; the browser is simulating one.</p>" +
     "<p><b>Amber/red \"Can't reach the device\"</b> = it was connected and dropped. <b>What you see is the last data received — your alarms are still on the device</b>, and come back when it does.</p>" +
     "<p>An alarm didn't ring? Check in order: switched on → right weekday → right odd/even week → was it cancelled for that session → are you outside the semester.</p>"]

function todayDayI(){ return idxOf(nowDev()); }
function classEndM(a){
  var s = a.hour * 60 + a.minute;
  return a.dur ? s + a.dur : s + 50;
}
function classSpan(a){
  var start = pad(a.hour) + ":" + pad(a.minute);
  var end = endText(a);
  return end ? start + " – " + end : start;
}
function todayClasses(){
  var dayI = todayDayI();
  return shownOnDay(dayI, weekOf(dayI)).filter(function(a){
    return !isSkipped(a, dayI);
  });
}
function todayHtml(){
  var dayI = todayDayI();
  var open = '<button type="button" class="shellFab" data-act="tt">'+t("todayOpenTt")+"</button>";
  var html = "";
  if(!mine().length){
    html = shellRow("", t("todayEmpty"), "") +
      '<button type="button" class="shellFab ghost" data-act="genTt">'+t("genTt")+"</button>";
  } else {
    var list = todayClasses();
    if(!list.length) html = shellRow("", t("todayFree"), "");
    else {
      var nowM = nowDev().getHours() * 60 + nowDev().getMinutes();
      var seenNext = false, i, a, s, e, kind, room, sub;
      for(i = 0; i < list.length; i++){
        a = list[i];
        s = a.hour * 60 + a.minute;
        e = classEndM(a);
        if(nowM >= e) kind = "todayDone";
        else if(nowM >= s) kind = "todayNow";
        else if(!seenNext){ kind = "todayNext"; seenNext = true; }
        else kind = "todayLater";
        room = roomOf(a, dayI);
        sub = classSpan(a) + (room ? " · " + room : "");
        html += shellRow(t(kind), esc(a.label || ""), esc(sub));
      }
    }
  }
  return html + dueSoonHtml() + open;
}
function paintHomeNow(){
  var el = $("homeNow");
  if(!el) return;
  var dayI = todayDayI();
  var list = todayClasses();
  var nowM = nowDev().getHours() * 60 + nowDev().getMinutes();
  var current = null, next = null, i, a, s, e;
  for(i = 0; i < list.length; i++){
    a = list[i];
    s = a.hour * 60 + a.minute;
    e = classEndM(a);
    if(nowM >= s && nowM < e){ current = a; break; }
    if(nowM < s && !next) next = a;
  }
  var pick = current || next;
  if(!pick){
    el.classList.remove("on");
    if(el.innerHTML) el.innerHTML = "";
    return;
  }
  var room = roomOf(pick, dayI);
  var sub = classSpan(pick) + (room ? " · " + room : "");
  var html = '<p class="k">'+esc(t(current ? "todayNow" : "todayNext"))+
    '</p><p class="t">'+esc(pick.label || "")+'</p><p class="s">'+esc(sub)+"</p>";
  el.classList.add("on");
  if(el.innerHTML !== html) el.innerHTML = html;
}

function attKey(id, iso){ return String(id) + "|" + iso; }
function attGet(id, iso){
  var v = ATT[attKey(id, iso)];
  return (v === "in" || v === "out" || v === "late") ? v : "";
}
function attSet(id, iso, mark){
  var k = attKey(id, iso);
  if(mark === "in" || mark === "out" || mark === "late") ATT[k] = mark;
  else delete ATT[k];
  try { localStorage.setItem("clockAtt", JSON.stringify(ATT)); } catch(e){}
}
function attWeekFirst(){
  var dayI = todayDayI();
  var w = weekOf(dayI);
  if(S.sem.enabled && w >= 1 && w <= (S.sem.weeks || 99)) return weekFirstDay(w);
  return anchorOf(dayI);
}
function attWeekStats(){
  var first = attWeekFirst(), total = 0, present = 0, k, i, list, j, m;
  for(k = 0; k < 7; k++){
    i = first + k;
    list = shownOnDay(i, weekOf(i)).filter(function(a){ return !isSkipped(a, i); });
    for(j = 0; j < list.length; j++){

function dueNorm(x){
  if(!x || typeof x !== "object") return null;
  var title = String(x.title || "").trim().slice(0, 80);
  var date = String(x.date || "").slice(0, 10);
  if(!title || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
  var time = String(x.time || "").slice(0, 5);
  if(time && !/^\d{2}:\d{2}$/.test(time)) time = "";
  return {
    id: String(x.id || ("d" + Date.now().toString(36))),
    title: title,
    sub: String(x.sub || "").trim().slice(0, 40),
    date: date,
    time: time,
    done: !!x.done
  };
}
function dueList(){
  var out = [];
  DUE.forEach(function(x){ var n = dueNorm(x); if(n) out.push(n); });
  out.sort(function(a, b){
    if(a.done !== b.done) return a.done ? 1 : -1;
    var sa = a.date + "T" + (a.time || "23:59");
    var sb = b.date + "T" + (b.time || "23:59");
    return sa < sb ? -1 : (sa > sb ? 1 : 0);
  });
  return out;
}
function dueOverdue(d){
  if(d.done) return false;
  var iso = todayISO();
  if(d.date < iso) return true;
  if(d.date > iso || !d.time) return false;
  var n = nowDev();
  return d.time < (pad(n.getHours()) + ":" + pad(n.getMinutes()));
}
function dueWhenLabel(d){
  var today = todayISO();
  var tmr = isoOf(todayDayI() + 1);
  var when;
  if(d.date === today) when = t("dueToday");
  else if(d.date === tmr) when = t("dueTmr");
  else {
    var p = d.date.split("-");
    when = parseInt(p[2], 10) + "/" + parseInt(p[1], 10);
  }
  if(d.time) when += " " + d.time;
  if(dueOverdue(d)) when = t("dueOver") + " · " + when;
  return when;
}
function dueSoon(){

// UTAR's own scale, best first. The letter is what gets stored, so the
// numbers can be corrected later without touching anyone's saved courses.
var GRADES = [
  ["A",  4.00],
  ["A-", 3.75],
  ["B+", 3.50],
  ["B",  3.00],
  ["B-", 2.75],
  ["C+", 2.50],
  ["C",  2.00],
  ["F",  0.00]
];
function gradeI(g){
  for(var i = 0; i < GRADES.length; i++) if(GRADES[i][0] === g) return i;
  return 0;
}
function gpaSave(){
  try { localStorage.setItem("clockGpa", JSON.stringify(GPA)); } catch(e){}
}
function gpaNorm(x){
  if(!x || typeof x !== "object") return null;
  var name = String(x.name || "").trim().slice(0, 40);
  var cr = Math.round(parseFloat(x.cr) * 2) / 2;
  if(!name || !isFinite(cr) || cr <= 0 || cr > 20) return null;
  return {
    id: String(x.id || ("g" + Date.now().toString(36))),
    name: name,
    cr: cr,
    g: GRADES[gradeI(String(x.g || "A"))][0]
  };
}
function gpaList(){
  var out = [];
  GPA.forEach(function(x){ var n = gpaNorm(x); if(n) out.push(n); });
  return out;
}
// Credits carry the weight, so an F still counts against you - it brings
// its credits with zero points, which is what a real transcript does.
function gpaCalc(list){
  var pts = 0, cr = 0;
  for(var i = 0; i < list.length; i++){
    pts += GRADES[gradeI(list[i].g)][1] * list[i].cr;
    cr += list[i].cr;
  }
  return { cr: cr, gpa: cr ? pts / cr : null };
}
function gpaNum(n){ return n.toFixed(2); }
function gpaHtml(){
  var list = gpaList();
  var sum = gpaCalc(list);
  var html = '<div class="gpaHead"><div><p class="shellK">'+t("gpaNow")+'</p>'+
    '<p class="n">'+(sum.gpa === null ? "\u2014" : gpaNum(sum.gpa))+"</p></div>"+
    '<p class="shellS">'+t("gpaTotal", sum.cr)+"</p></div>";
  var i, c;
  if(!list.length) html += shellRow("", t("gpaEmpty"), "");
  for(i = 0; i < list.length; i++){
    c = list[i];
    html += shellRow(t("gpaCr", c.cr), esc(c.name), "",
      '<div class="shellBtns">'+
      '<button type="button" class="on" data-act="gpaG" data-id="'+esc(c.id)+'">'+c.g+"</button>"+
      '<button type="button" data-act="gpaDel" data-id="'+esc(c.id)+'">\u00d7</button></div>');
  }
  html += '<div class="dueForm">'+
    '<input id="gpaName" maxlength="40" placeholder="'+esc(t("gpaNamePh"))+'">'+
    '<div class="gpaFormRow">'+
      '<input id="gpaCr" type="number" min="0.5" max="20" step="0.5" placeholder="'+esc(t("gpaCrPh"))+'">'+
      '<div class="shellBtns"><button type="button" class="on" data-act="gpaNewG">'+GRADES[gpaNewG][0]+"</button></div>"+
    "</div></div>"+
    '<button type="button" class="shellFab" data-act="gpaAdd">'+t("gpaAdd")+"</button>"+
    '<p class="shellS">'+t("gpaScale")+"</p>";
  return html;
}

// The only demo app with a live number on it: the countdown is worked out
// from the device clock, so it moves while you watch it.
var BUS = {
  kb:{ name:{ en:"Campus → Hostel", zh:"校园 → 宿舍" },
       mins:[10, 40], first:"07:10", last:"22:40" },
  hb:{ name:{ en:"Hostel → Campus", zh:"宿舍 → 校园" },
       mins:[0, 30], first:"07:00", last:"22:30" },
  tn:{ name:{ en:"Campus → Town", zh:"校园 → 镇上" },
       mins:[20], first:"09:20", last:"21:20" }
};
// Minutes from now until this route's next departure. Counted forward in
// whole hours so a route whose last slot has passed rolls into the next
// hour rather than returning a negative wait.
function busSlots(route, howMany){
  var n = nowDev(), m = n.getHours() * 60 + n.getMinutes(), out = [], h, i, at;
  // Search far enough ahead that a route running once an hour still fills
  // the list when this hour's departure has already gone.
  for(h = 0; h <= howMany + 1 && out.length < howMany; h++){
    for(i = 0; i < route.mins.length; i++){
      at = (n.getHours() + h) * 60 + route.mins[i];
      if(at >= m) out.push(at);
    }
  }
  out.sort(function(a, b){ return a - b; });
  return { now:m, slots:out.slice(0, howMany) };
}
function busHtml(){
  var which = tab("bus", "kb"), r = BUS[which], got = busSlots(r, 6), i, html, hh, mm;
  var wait = got.slots.length ? got.slots[0] - got.now : null;
  html = seg("bus", [["kb", t("busKb")], ["hb", t("busHb")], ["tn", t("busTn")]], which);
  html += '<div class="shellRow"><div class="shellMain">'+
    '<p class="shellK">'+t("busNext")+"</p>"+
    '<div class="busNext"><span class="n">'+(wait === null ? "—" : wait)+
      '</span><span class="u">'+t("busMin")+"</span></div>"+
    '<p class="shellS">'+esc(r.name[lang === "zh" ? "zh" : "en"])+"</p></div></div>";
  for(i = 0; i < got.slots.length; i++){
    hh = Math.floor(got.slots[i] / 60) % 24; mm = got.slots[i] % 60;
    html += shellRow(i === 0 ? t("busSoon") : t("busThen"),
      '<span class="num">'+pad(hh)+":"+pad(mm)+"</span>",
      i === 0 ? t("busInMin", got.slots[i] - got.now) : "");
  }
  html += '<p class="shellS" style="margin-top:12px">'+t("busSpan", r.first, r.last)+"</p>";
  return html + demoNote();
}

// A phone number as typed, kept only as far as tel: needs it. Nothing
// here is validated into a shape -- Malaysian, international, an
// extension, all of it has to survive being typed the way someone knows
// it. Only the characters a dialler would choke on come out.
function telHref(v){ return String(v || "").replace(/[^0-9+#*,;]/g, ""); }

function myIce(){
  var raw = pk("ice", []);
  if(!raw || typeof raw.length !== "number") return [];
  var out = [], i, x;
  for(i = 0; i < raw.length && out.length < 12; i++){
    x = raw[i];
    if(!x || typeof x !== "object") continue;
    var n = String(x.n || "").trim().slice(0, 40);
    var p = String(x.p || "").trim().slice(0, 24);
    if(!n || !telHref(p)) continue;
    out.push({ id: String(x.id || ("i" + i)), n: n, p: p, r: String(x.r || "").trim().slice(0, 24) });
  }
  return out;
}

// ============================================================
//  Navigation as a stack
//  openMicro pushes an app pane in over home; closeMicro pops it. The
//  drag handler below lets a swipe from the left edge do the popping,
//  which is the one gesture people miss most when a "phone app" turns
//  out to be a web page. paintHome() still owns what the pane contains
//  -- this owns only how it arrives and leaves.
// ============================================================
var NAV = { busy:false, depth:0 };

// A tap you can feel. Android honours it, iOS Safari ignores it, and
// neither one may throw.
function tap(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms || 8); }catch(e){}
}

function openMicro(id){
  if(NAV.busy) return;
  if(qOpen) qShut();
  UI.open = {};
  S.micro = id;
  var st = $("homeStub");
  st.classList.remove("popping");
  st.style.transform = "";
  st.classList.add("on");
  st.scrollTop = 0;
  $("pocketHome").classList.add("in-app");
  paintHome();
  st.classList.add("pushing");
  NAV.busy = true;
  setTimeout(function(){ st.classList.remove("pushing"); NAV.busy = false; }, 340);
  // Android's Back button and the browser's back arrow have to pop the
  // pane, not leave the app. One history entry per push, popped by
  // navBack() so both routes end in the same place.
  try{ history.pushState({ pocket:id }, ""); NAV.depth++; }catch(e){}
  tap(8);
}

// Every way out of an app goes through here: the chevron, the edge
// swipe, and the Back button. Only the last one arrives as a popstate,
// so only the other two spend a history entry.
function navBack(){
  if(NAV.depth > 0){
    try{ history.back(); return; }catch(e){}
  }
  closeMicro();
}

function closeMicro(instant){
  var st = $("homeStub");
  if(!st || !st.classList.contains("on")) return;
  UI.open = {};
  S.micro = "home";
  $("pocketHome").classList.remove("in-app");
  st.classList.remove("pushing", "popping", "dragging");
  st.style.transform = "";
  if(instant){ st.classList.remove("on"); paintHome(); return; }
  NAV.busy = true;
  st.classList.add("popping");
  setTimeout(function(){
    st.classList.remove("popping", "on");
    NAV.busy = false;
    paintHome();
  }, 215);
  tap(6);
}

// Drag from the left edge to go back. The pane follows the finger and
// home comes forward underneath it in step, so the gesture is reversible
// -- let go short of a third of the width and both slide back.
try{
  window.addEventListener("popstate", function(){
    if(NAV.depth > 0) NAV.depth--;
    var st = document.getElementById("homeStub");
    if(st && st.classList.contains("on")) closeMicro();
  });
}catch(e){}

(function edgeBack(){
  var st = null, x0 = 0, y0 = 0, dx = 0, live = false, t0 = 0;
  function home(){ return document.getElementById("pocketHome"); }
  try{
    document.addEventListener("touchstart", function(e){
      var s = document.getElementById("homeStub");
      if(!s || !s.classList.contains("on") || NAV.busy) return;
      if(!e.touches || e.touches.length !== 1) return;
      var t = e.touches[0];
      // Measure the edge from the pane, not the window: inside the desktop
      // device frame the pane's left edge is not x = 0.
      var r = s.getBoundingClientRect ? s.getBoundingClientRect() : null;
      if(t.clientX > (r ? r.left : 0) + 30) return;
      st = s; x0 = t.clientX; y0 = t.clientY; dx = 0; live = false; t0 = Date.now();
    }, {passive:true});

    document.addEventListener("touchmove", function(e){
      if(!st || !e.touches || !e.touches.length) return;
      var t = e.touches[0];
      var ax = t.clientX - x0, ay = t.clientY - y0;
      if(!live){
        // Decide once whether this is a back swipe or a scroll.
        if(Math.abs(ay) > Math.abs(ax)){ if(Math.abs(ay) > 10) st = null; return; }
        if(ax < 9) return;
        live = true;
        st.classList.add("dragging");
        home().style.transition = "none";
      }
      e.preventDefault();
      dx = Math.max(0, ax);
      var w = st.clientWidth || 390;
      var p = Math.min(1, dx / w);
      st.style.transform = "translateX(" + dx.toFixed(1) + "px)";
      home().style.transform =
        "translateX(" + (-16 + 16 * p).toFixed(2) + "%) scale(" + (0.965 + 0.035 * p).toFixed(4) + ")";
      home().style.opacity = (0.5 + 0.5 * p).toFixed(3);
    }, {passive:false});

    var end = function(){
      if(!st) return;
      var s = st; st = null;
      var h = home();
      h.style.transition = ""; h.style.transform = ""; h.style.opacity = "";
      s.classList.remove("dragging");
      if(!live){ return; }
      live = false;
      var w = s.clientWidth || 390;
      var flick = (Date.now() - t0) < 340 && dx > 44;
      s.style.transform = "";
      if(dx > w * 0.32 || flick) navBack();
    };
    document.addEventListener("touchend", end, {passive:true});
    document.addEventListener("touchcancel", end, {passive:true});
  }catch(e){}
})();

// ---------- Store ----------
// A marketplace for wallpapers and icon skins, with money that is not
// money. Everything here follows the rule the other demo apps follow:
// the goods are written into the app, what you do with them is kept on
// this phone, and the screen says so.
//
// On the art: these are our own designs -- gradients with names, drawn
// in CSS. Shipping somebody else's characters in a public demo is
// trademark infringement, and the mechanism proves itself just as well
// with originals. The day there is a licence, only the table changes.
var SHOP_START = 500;   // what a new phone begins with

var WALLS = [
  { id:"none",   tx:"wNone",   p:0,   sw:"#e9eef5" },
  { id:"dawn",   tx:"wDawn",   p:120, sw:"#fca97f" },
  { id:"sakura", tx:"wSakura", p:140, sw:"#ffc9de" },
  { id:"grid",   tx:"wGrid",   p:90,  sw:"#e8edf5" },
  { id:"dusk",   tx:"wDusk",   p:130, sw:"#c06c84", ink:"#fff" },
  { id:"neon",   tx:"wNeon",   p:160, sw:"#2b1152", ink:"#fff" },
  { id:"ocean",  tx:"wOcean",  p:180, sw:"#0d5c82", ink:"#fff" }
];

var SKINS = [
  { id:"flat",  tx:"kFlat",  p:0 },
  { id:"round", tx:"kRound", p:80 },
  { id:"ink",   tx:"kInk",   p:100 },
  { id:"glass", tx:"kGlass", p:120 },
  { id:"mono",  tx:"kMono",  p:150 }
];

function shopList(kind){ return kind === "skin" ? SKINS : WALLS; }
function shopItem(kind, id){
  var l = shopList(kind);
  for(var i = 0; i < l.length; i++) if(l[i].id === id) return l[i];
  return null;
}
function shopBal(){ return pk("shopBal", SHOP_START); }

// Anything free is owned by everybody, always. Keeping that out of the
// saved map means a cleared phone still has a wallpaper to fall back to.
function shopOwns(kind, id){
  var it = shopItem(kind, id);
  if(!it) return false;
  if(!it.p) return true;
  return !!pk("shopOwn", {})[kind + ":" + id];
}
function shopBuyIt(kind, id){
  var it = shopItem(kind, id);
  if(!it || shopOwns(kind, id)) return false;
  if(shopBal() < it.p) return false;
  var own = pk("shopOwn", {});
  own[kind + ":" + id] = 1;
  pkSet("shopOwn", own);
  pkSet("shopBal", shopBal() - it.p);
  return true;
}

// What is on right now. An id that is not owned any more -- or was never
// real -- falls back to the free one rather than to nothing.
function wallOn(){
  var v = String(pk("wallOn", "none"));
  return shopOwns("wall", v) ? v : "none";
}
function skinOn(){
  var v = String(pk("skinOn", "flat"));
  return shopOwns("skin", v) ? v : "flat";
}
function shopUseIt(kind, id){
  if(!shopOwns(kind, id)) return false;
  pkSet(kind === "skin" ? "skinOn" : "wallOn", id);
  applyLook();
  return true;
}

// The only place that touches the home element. A wallpaper is one
// attribute and, on the dark ones, a text colour scoped to this element
// -- no other screen changes.
function applyLook(){
  var el = $("pocketHome");
  if(!el) return;
  var w = shopItem("wall", wallOn());
  el.setAttribute("data-wall", w ? w.id : "none");
  el.setAttribute("data-skin", skinOn());
  // The root wears the wallpaper too, so the canvas under the app is the
  // same colour as the app. See the html rule next to the wallpapers.
  var id = w ? w.id : "none";
  if(document.documentElement && document.documentElement.setAttribute)
    document.documentElement.setAttribute("data-wall", id);
  if(document.body && document.body.setAttribute)
    document.body.setAttribute("data-wall", id);
  // Guarded because this runs at boot, before anything is on screen, and
  // because the test harnesses hand us an element that is not a real one.
  if(!el.style || !el.style.setProperty) return;
  if(w && w.ink){
    el.style.setProperty("--tx", w.ink);
    el.style.setProperty("--tx3", "rgba(255,255,255,.72)");
  }else{
    el.style.removeProperty("--tx");
    el.style.removeProperty("--tx3");
  }
}

function shopCard(kind, it){
  var owned = shopOwns(kind, it.id);
  var using = (kind === "skin" ? skinOn() : wallOn()) === it.id;
  var sw = kind === "wall"
    ? '<div class="shopSwatch" style="background:' + it.sw + '"></div>'
    : '<div class="shopSwatch" style="background:var(--card2)"><i style="background:' +
      (it.id === "ink" ? "transparent;border:2px solid var(--tx)"
                       : it.id === "mono" ? "var(--tx)" : "var(--ac)") +
      (it.id === "round" ? ";border-radius:50%" : "") + '"></i></div>';
  var btn;
  if(using){
    btn = '<button type="button" class="owned" disabled>' + t("shopUsing") + "</button>";
  }else if(owned){
    btn = '<button type="button" class="on" data-act="shopUse" data-kind="' + kind +
          '" data-id="' + it.id + '">' + t("shopUse") + "</button>";
  }else{
    btn = '<button type="button" data-act="shopBuy" data-kind="' + kind +
          '" data-id="' + it.id + '">' + t("shopBuy") + "</button>";
  }
  return '<div class="shopCard">' + sw + '<div class="shopMeta"><b>' + esc(t(it.tx)) + "</b>" +
    '<span class="price">' +
    (it.p ? it.p + (owned ? " \u00b7 " + t("shopOwned") : "") : t("shopFree")) +
    "</span>" + btn + "</div></div>";
}

// What the browser actually reports, on the device that is arguing with
// us. Every viewport bug in this project so far has been a number that
// disagreed with another number, and screenshots cannot show either.
// Tap the build string to unfold it; it is off by default.
var DIAG = false;
function diagHtml(){
  var probe = document.createElement("div"), pad = { top:"?", bottom:"?" };
  try{
    probe.style.cssText = "position:absolute;visibility:hidden;" +
      "padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)";
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe);
    pad.top = cs.paddingTop; pad.bottom = cs.paddingBottom;
    document.body.removeChild(probe);
  }catch(e){}
  function mode(){
    var m = ["standalone", "minimal-ui", "fullscreen", "browser"], i;
    for(i = 0; i < m.length; i++)
      if(window.matchMedia && matchMedia("(display-mode: " + m[i] + ")").matches) return m[i];
    return "?";
  }
  function box(el){
    if(!el) return "-";
    var r = el.getBoundingClientRect();
    return Math.round(r.width) + "x" + Math.round(r.height) + " top " +
           Math.round(r.top) + " bot " + Math.round(r.bottom);
  }
  var vv = window.visualViewport;
  var pager = $("homePager");
  var rows = [
    ["mode",     mode() + (navigator.standalone ? " ios-standalone" : "")],
    ["window",   window.innerWidth + "x" + window.innerHeight],
    ["visual",   vv ? Math.round(vv.width) + "x" + Math.round(vv.height) +
                      " offY " + Math.round(vv.offsetTop) + " scale " + (Math.round(vv.scale*100)/100)
                    : "unsupported"],
    ["screen",   screen.width + "x" + screen.height + " dpr " + (window.devicePixelRatio || 1)],
    ["--app-h",  getComputedStyle(document.documentElement).getPropertyValue("--app-h").trim() || "unset"],
    ["safe-top", pad.top], ["safe-bot", pad.bottom],
    ["html",     box(document.documentElement)],
    ["body",     box(document.body)],
    ["home",     box($("pocketHome"))],
    ["stub",     box($("homeStub"))],
    ["pager",    pager ? Math.round(pager.clientHeight) + "h  pages " + pager.children.length : "-"],
    ["cols",     pager ? getComputedStyle(pager).getPropertyValue("--home-cols").trim() : "-"],
    ["ua",       navigator.userAgent]
  ];
  var out = "";
  for(var i = 0; i < rows.length; i++)
    out += esc(rows[i][0]) + ": " + esc(String(rows[i][1])) + String.fromCharCode(10);
  return '<pre class="selectable" style="margin:var(--sp-3) 0 0;padding:var(--sp-2);' +
    'white-space:pre-wrap;word-break:break-all;font-family:var(--mono);' +
    'font-size:var(--fs-2xs);line-height:1.5;color:var(--tx2);' +
    'background:var(--card2);border-radius:var(--r-sm);overflow-x:auto">' + out + "</pre>";
}

// One place that decides which of the four states we are in, so no
// handler has to reason about it.
function authSettle(){
  AUTH.busy = false;
  if(!signedIn()){ AUTH.step = "in"; paintHome(); return Promise.resolve(); }
  return mfaFactors().then(function(list){
    var ok = mfaVerified(list);
    AUTH.hasFactor = ok.length > 0;
    if(!AUTH.hasFactor || jwtAal(CLOUD.token) === "aal2"){
      // Either there is no second factor to answer, or it has been
      // answered. Either way this is as far in as you go.
      AUTH.step = "done";
      if(!pkOn()) AUTH.locked = false;
      paintHome();
      return;
    }
    AUTH.step = "code";
    AUTH.factor = ok[0].id;
    return mfaChallenge(AUTH.factor).then(function(c){
      AUTH.chal = (c && c.id) || "";
      paintHome();
    });
  }).catch(function(err){
    AUTH.msg = cloudErr(err && err.message);
    paintHome();
  });
}

// Only reached from the "Turn on two-factor" button. A half-finished
// enrolment left behind by a cancelled attempt blocks a new one, so it
// is cleared first.
function authEnrolStart(){
  if(AUTH.busy) return;
  AUTH.busy = true; AUTH.msg = t("meWorking"); paintHome();
  mfaFactors().then(function(list){
    var stale = (list || []).filter(function(f){ return f.status !== "verified"; });
    return stale.length ? mfaDrop(stale[0].id) : null;
  }).then(mfaEnrol).then(function(j){
    AUTH.step   = "enrol";
    AUTH.factor = (j && j.id) || "";
    AUTH.qr     = qrSrc(j && j.totp && j.totp.qr_code);
    AUTH.secret = (j && j.totp && j.totp.secret) || "";
    return mfaChallenge(AUTH.factor);
  }).then(function(c){
    AUTH.chal = (c && c.id) || "";
    AUTH.busy = false; AUTH.msg = "";
    paintHome();
  }).catch(authFail);
}

function authFail(err){
  AUTH.busy = false;
  AUTH.msg = cloudErr((err && err.message) || "");
  paintHome();
}

// How many icons go on a page is measured, not decided here. Sixteen was
// a guess, and on a 390x844 phone it filled 377px of a 658px pager: a
// quarter of the screen empty under the last row, and eight apps pushed
// onto a second page that had no reason to exist. A home screen fills the
// page it is on and only the last page is short, so the row count comes
// from the pager's own height.
//
// The column count is the stylesheet's, not this file's: --home-cols is 4
// on a phone, 6 on an iPad and 8 on a laptop, and asking for it here is
// what stops the two from drifting apart. PAGE_TILE/PAGE_GAP are the CSS
// values (a 60px icon, its label, and the grid's row gap); they are seeds
// only -- fitPage() remeasures them from a real tile after the first
// paint, so a longer label or a bigger text size is accounted for rather
// than assumed away.
var PAGE_COLS = 4;
var PAGE_TILE = 83;
var PAGE_GAP  = 20;
var PAGE_SIZE = PAGE_COLS * 4;

function fitPage(){
  var pager = $("homePager");
  if(!pager) return PAGE_SIZE;
  var h = pager.clientHeight;
  if(!h) return PAGE_SIZE;          // not laid out yet; keep the seed
  var cols = parseInt(getComputedStyle(pager).getPropertyValue("--home-cols"), 10);
  if(cols > 0) PAGE_COLS = cols;
  var tile = pager.querySelector(".homeTile"), gap;
  if(tile && tile.offsetHeight > 0){
    PAGE_TILE = tile.offsetHeight;
    gap = parseFloat(getComputedStyle(tile.parentNode).rowGap);
    if(gap >= 0) PAGE_GAP = gap;
  }
  // The last row has no gap under it, so give one back before dividing.
  var rows = Math.floor((h + PAGE_GAP) / (PAGE_TILE + PAGE_GAP));
  if(rows < 2) rows = 2;            // a pager too short to measure sanely
  return rows * PAGE_COLS;
}

// Did any page's last row fall past the bottom of the pager? fitPage()
// budgets rows at the height of a one-line label, and a wrapped one --
// "Lost and found" -- makes its whole grid row taller. The pager clips, so
// an over-full page does not scroll, it just loses its bottom row.
function pagerSpills(pager){
  var h = pager.clientHeight, kids = pager.children, i, last, top;
  if(!h) return false;
  for(i = 0; i < kids.length; i++){
    last = kids[i].lastElementChild;
    if(!last) continue;
    top = kids[i].getBoundingClientRect().top;
    if(last.getBoundingClientRect().bottom - top > h + 1) return true;
  }
  return false;
}

// There was a dock -- Timetable, Today, Hotline, Account, held out of the
// pages on their own pane of glass. It is gone (2026-08-24). It was a
// second layout with its own rules sitting under the first: it did not
// rearrange, you could not drag into or out of it, it dimmed rather than
// wobbled in edit mode, and it took four apps out of the paging maths so
// every count in the code and the docs had two versions. One grid, one
// set of rules, and the four are ordinary icons on page one again.

// MICROS is the catalogue, not the layout. Whatever the user dragged
// into place wins; anything they have never seen -- an app added in a
// later build -- lands at the end rather than disappearing because it
// was not in a list saved last week.
function orderedMicros(){
  var saved = pk("appOrder", []);
  if(!saved || typeof saved.length !== "number") saved = [];
  var by = {}, out = [], seen = {}, i, m;
  for(i = 0; i < MICROS.length; i++) by[MICROS[i].id] = MICROS[i];
  for(i = 0; i < saved.length; i++){
    m = by[saved[i]];
    if(m && !seen[m.id]){ out.push(m); seen[m.id] = 1; }
  }
  for(i = 0; i < MICROS.length; i++){
    if(!seen[MICROS[i].id]){ out.push(MICROS[i]); seen[MICROS[i].id] = 1; }
  }
  return out;
}
// Every app is on a page. Nothing is held back.
function pageApps(){ return orderedMicros(); }
function saveOrder(list){
  var ids = [], i;
  for(i = 0; i < list.length; i++) ids.push(list[i].id);
  pkSet("appOrder", ids);
}
function pageCount(){ return Math.ceil(pageApps().length / PAGE_SIZE) || 1; }

// Rebuilding the grid re-runs tileIn on all 25 icons. paintHome() is
// called on the way out of every app, so coming back used to flash the
// whole springboard and then animate it in again -- which reads as the
// screen glitching, not as a transition. The tiles depend on exactly two
// things, so rebuild only when one of them actually changed.
var pagesSig = "";
function pagesKey(){
  var list = pageApps(), ids = [];
  for(var i = 0; i < list.length; i++) ids.push(list[i].id);
  return lang + "|" + PAGE_SIZE + "|" + (EDIT.on ? "e" : "") + "|" + ids.join(",");
}

function tileEl(m){
  var b = document.createElement("button");
  b.type = "button";
  b.className = "homeTile";
  b.dataset.id = m.id;
  b.setAttribute("aria-label", t(m.t) + (m.live ? "" : " — " + t("shellPreview")));
  b.innerHTML = '<span class="icon">' + tileGlyph(m.id) + "</span>" +
    '<span class="name">' + t(m.t) + "</span>";
  return b;
}

function paintPages(force){
  var pager = $("homePager"), dots = $("homeDots"), p, b;
  if(!pager) return;
  PAGE_SIZE = fitPage();
  if(!force && pagesKey() === pagesSig && pager.children.length === pageCount()) return;
  var list = pageApps();
  function build(){
    var q, i, g, end, n = pageCount();
    pager.innerHTML = "";
    for(q = 0; q < n; q++){
      g = document.createElement("div");
      end = Math.min(list.length, (q + 1) * PAGE_SIZE);
      // Every page keeps its rows at the top, full or not -- see .homePage.
      g.className = "homePage homeGrid";
      for(i = q * PAGE_SIZE; i < end; i++) g.appendChild(tileEl(list[i]));
      pager.appendChild(g);
    }
    return n;
  }
  var pages = build();
  // Reserving two label lines on all 26 icons to cover the one that wraps
  // would cost a whole row on every page. Measure the page that was really
  // built instead and step down if it spilled. Downward only and bounded,
  // so a font that never fits cannot make this oscillate.
  for(var guard = 0; guard < 4 && PAGE_SIZE > PAGE_COLS * 2 && pagerSpills(pager); guard++){
    PAGE_SIZE -= PAGE_COLS;
    pages = build();
  }
  pagesSig = pagesKey();
  // An iPad is tall enough for ten rows and there are twenty-six apps, so
  // one page can leave half the screen empty under the icons. When there
  // is only one page there is nothing to line it up with, so centre the
  // block. The row gaps do not change -- it is space-evenly that was the
  // bug, not centring -- and with two pages both go back to the top so
  // they still match mid-swipe.
  pager.classList.toggle("single", pages === 1);
  // A repaint that drops a page (a taller pager, an app hidden) would
  // otherwise leave the scroll parked past the end, showing blank glass.
  var last = (pages - 1) * pager.clientWidth;
  if(pager.scrollLeft > last) pager.scrollLeft = last;
  if(!dots) return;
  dots.innerHTML = "";
  if(pages < 2) return;
  for(p = 0; p < pages; p++){
    b = document.createElement("button");
    b.type = "button";
    b.dataset.page = p;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-label", t("homePage", p + 1, pages));
    dots.appendChild(b);
  }
  markPage();
}

// Which page the pager is showing. Read back from scrollLeft rather than
// kept in a variable: the scroll can come from a finger, a trackpad, a dot
// or the keyboard, and only one of those goes through our code.
function markPage(){
  var pager = $("homePager"), dots = $("homeDots");
  if(!pager || !dots) return;
  var w = pager.clientWidth || 1;
  var cur = Math.round(pager.scrollLeft / w);
  var kids = dots.children;
  for(var i = 0; i < kids.length; i++){
    kids[i].className = (i === cur ? "on" : "");
    kids[i].setAttribute("aria-selected", i === cur ? "true" : "false");
  }
}

// ============================================================
//  Search
//  A super-app that cannot find a thing inside itself is a folder of
//  icons. searchAll() is deliberately a pure function over the same
//  seeds and stores the screens render from -- no index, no cache, no
//  second copy of the data to fall out of step. Twenty-four apps of
//  demo content is small enough that scanning it on every keystroke is
//  cheaper than keeping an index honest.
// ============================================================
function hay(v){ return String(v == null ? "" : v).toLowerCase(); }

function searchAll(q){
  q = String(q || "").trim().toLowerCase();
  var out = [];
  if(!q) return out;
  function hit(app, title, sub){
    if(out.length < 40) out.push({ app:app, title:String(title || ""), sub:String(sub || "") });
  }
  function match(){
    for(var i = 0; i < arguments.length; i++)
      if(hay(arguments[i]).indexOf(q) >= 0) return true;
    return false;
  }
  var i, x, list;

  // The apps themselves, by name and by the one-line description on the tile.
  for(i = 0; i < MICROS.length; i++){
    var nm = t(MICROS[i].t), sb = L[lang][MICROS[i].t + "Sub"];
    if(typeof sb !== "string") sb = "";
    if(match(nm, sb)) hit(MICROS[i].id, nm, sb);
  }

  // The store's goods. Bought or not, they are things with names that a
  // person may reasonably look for.
  for(i = 0; i < WALLS.length; i++)
    if(match(t(WALLS[i].tx))) hit("shop", t(WALLS[i].tx), t("shopWalls"));
  for(i = 0; i < SKINS.length; i++)
    if(match(t(SKINS[i].tx))) hit("shop", t(SKINS[i].tx), t("shopSkins"));

  // Your own data first: classes, deadlines, courses.
  list = mine();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.label, roomOf(x))) hit("tt", subjectOf(x) || x.label, hhmm(x) + " \u00b7 " + (roomOf(x) || ""));
  }
  list = dueList();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.title, x.sub)) hit("due", x.title, x.date + (x.time ? " " + x.time : ""));
  }
  list = gpaList();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.name)) hit("gpa", x.name, x.g + " \u00b7 " + x.cr);
  }

  // Then the demo content, app by app.
  list = examSeed();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.c, x.code, x.v, x.s)) hit("exam", x.c, x.code + " \u00b7 " + x.v + " \u00b7 " + x.s);
  }
  list = libSeed();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.t, x.a)) hit("lib", x.t, x.a);
  }
  list = clubSeed();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.n, x.nx)) hit("club", x.n, x.nx);
  }
  list = jobSeed();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.co, x.r)) hit("job", x.r, x.co + " \u00b7 " + x.pay);
  }
  list = evSeed();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.title, x.who, x.when)) hit("ev", x.title, x.who + " \u00b7 " + x.when);
  }
  list = foodSeed();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.n, x.p)) hit("food", x.n, x.p);
  }
  list = rideSeed();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.from, x.to, x.when)) hit("ride", x.from + " \u2192 " + x.to, x.when + " \u00b7 " + x.fee);
  }
  list = lostSeed();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.w, x.p)) hit("lost", x.w, x.p + " \u00b7 " + x.t);
  }
  list = printSeed();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.n)) hit("print", x.n, t("printQueue", x.q));
  }
  list = washSeed();
  for(i = 0; i < list.length; i++){
    x = list[i];
    if(match(x.n)) hit("wash", x.n, x.left ? t("washBusy", x.left) : t("washFree"));
  }
  return out;
}

// Group the flat list by app, in the order the apps sit on the home, so
// the same query always lays out the same way.
function hitsHtml(hits){
  if(!hits.length) return emptyBox(t("qNoneT"), t("qNoneS"));
  var by = {}, order = [], i, h;
  for(i = 0; i < hits.length; i++){
    h = hits[i];
    if(!by[h.app]){ by[h.app] = []; order.push(h.app); }
    by[h.app].push(h);
  }
  order.sort(function(a, b){
    function at(id){
      for(var k = 0; k < MICROS.length; k++) if(MICROS[k].id === id) return k;
      return 99;
    }
    return at(a) - at(b);
  });
  var html = "";
  for(i = 0; i < order.length; i++){
    var app = order[i], rows = by[app], j;
    var meta = MICROS.filter(function(m){ return m.id === app; })[0];
    html += '<div class="hitGroup"><p class="hitK">' + esc(meta ? t(meta.t) : app) + "</p>";
    for(j = 0; j < rows.length; j++){
      html += '<button type="button" class="hitRow" data-app="' + esc(app) + '">' +
        '<span class="hitDot" data-id="' + esc(app) + '">' + tileGlyph(app) + "</span>" +
        '<span class="hitMain"><span class="hitT">' + esc(rows[j].title) + "</span>" +
        (rows[j].sub ? '<span class="hitS">' + esc(rows[j].sub) + "</span>" : "") +
        "</span></button>";
    }
    html += "</div>";
  }
  return html;
}

// The search field owns the home: while there is a query, the springboard
// and everything under it stands down rather than scrolling below results.
var homeQ = "", qOpen = false;

// Two states, not one: the field can be open with nothing typed in it.
// Only a query stands the springboard down.
// ============================================================
//  Rearranging
//  Hold an icon, everything wobbles, drag it where you want it. The
//  thing that makes this feel right rather than fiddly is that the
//  *model* reorders on the way past, not on the drop: the grid behind
//  your finger is always showing where the icon would land if you let
//  go now. The tile you picked up is hidden in the grid and a copy of
//  it rides under your finger, so a repaint mid-drag cannot yank the
//  thing you are holding out from under you.
// ============================================================
var EDIT = { on:false, id:"", ghost:null, dx:0, dy:0, hold:null, moved:false };

function editStop(save){
  if(EDIT.ghost && EDIT.ghost.parentNode) EDIT.ghost.parentNode.removeChild(EDIT.ghost);
  EDIT.ghost = null;
  if(EDIT.hold){ clearTimeout(EDIT.hold); EDIT.hold = null; }
  EDIT.id = ""; EDIT.moved = false;
  if(save === "all"){
    EDIT.on = false;
    document.body.classList.remove("editing");
    paintPages(true);
  }
}

function editEnter(id){
  if(EDIT.on) return;
  EDIT.on = true;
  document.body.classList.add("editing");
  tap(14);
  paintPages(true);
}

// Which page-app index is under this point, if any.
function tileIndexAt(x, y){
  var el = document.elementFromPoint(x, y);
  if(!el || !el.closest) return -1;
  var tile = el.closest(".homePage .homeTile");
  if(!tile) return -1;
  var list = pageApps();
  for(var i = 0; i < list.length; i++) if(list[i].id === tile.dataset.id) return i;
  return -1;
}

function editMoveTo(idx){
  var list = pageApps(), from = -1, i;
  for(i = 0; i < list.length; i++) if(list[i].id === EDIT.id) from = i;
  if(from < 0 || idx < 0 || idx === from) return;
  var m = list.splice(from, 1)[0];
  list.splice(idx, 0, m);
  saveOrder(list);
  paintPages(true);
  markHeld();
}

// The tile being carried is hidden where it will land, not left behind
// where it started -- that gap is the whole feedback.
function markHeld(){
  var all = document.querySelectorAll(".homePage .homeTile"), i;
  for(i = 0; i < all.length; i++){
    all[i].classList.toggle("held", EDIT.on && all[i].dataset.id === EDIT.id);
  }
}

(function rearrange(){
  var startX = 0, startY = 0;
  function tileFrom(e){
    var el = e.target;
    return el && el.closest ? el.closest(".homePage .homeTile") : null;
  }
  function lift(tile, x, y){
    var r = tile.getBoundingClientRect();
    var g = tile.cloneNode(true);
    g.className = "homeTile ghost";
    g.style.width = r.width + "px";
    g.style.height = r.height + "px";
    EDIT.dx = x - r.left; EDIT.dy = y - r.top;
    document.body.appendChild(g);
    EDIT.ghost = g;
    EDIT.id = tile.dataset.id;
    moveGhost(x, y);
    markHeld();
  }
  function moveGhost(x, y){
    if(!EDIT.ghost) return;
    EDIT.ghost.style.transform =
      "translate(" + (x - EDIT.dx) + "px," + (y - EDIT.dy) + "px) scale(1.12)";
  }
  try{
    document.addEventListener("pointerdown", function(e){
      var pager = document.getElementById("homePager");
      if(!pager) return;
      var tile = tileFrom(e);
      if(!tile) return;
      startX = e.clientX; startY = e.clientY; EDIT.moved = false;
      if(EDIT.on){ lift(tile, e.clientX, e.clientY); return; }
      // Not in edit mode yet: a long press gets us there, a tap does not.
      EDIT.hold = setTimeout(function(){
        EDIT.hold = null;
        editEnter(tile.dataset.id);
        var again = document.querySelector('.homePage .homeTile[data-id="' + tile.dataset.id + '"]');
        if(again) lift(again, startX, startY);
      }, 480);
    }, {passive:true});

    document.addEventListener("pointermove", function(e){
      if(EDIT.hold){
        // Moved before the hold fired -> this was a scroll or a page swipe.
        if(Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8){
          clearTimeout(EDIT.hold); EDIT.hold = null;
        }
        return;
      }
      if(!EDIT.ghost) return;
      e.preventDefault();
      EDIT.moved = true;
      moveGhost(e.clientX, e.clientY);
      editMoveTo(tileIndexAt(e.clientX, e.clientY));
    }, {passive:false});

    var up = function(e){
      if(EDIT.hold){ clearTimeout(EDIT.hold); EDIT.hold = null; }
      if(EDIT.ghost){
        editStop();
        markHeld();
      }
    };
    document.addEventListener("pointerup", up, {passive:true});
    document.addEventListener("pointercancel", up, {passive:true});
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape" && EDIT.on) editStop("all");
    });
  }catch(e){}
})();

// ============================================================
//  Date maths
//  Always count "days since 1970-01-01" in UTC, otherwise time zones and
//  daylight saving push the date out by a day.
// ============================================================
function dayIdx(y, m, d){ return Math.floor(Date.UTC(y, m - 1, d) / 86400000); }
function idxOf(dt){ return dayIdx(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); }

function idxParts(i){
  var u = new Date(i * 86400000);
  return { y:u.getUTCFullYear(), m:u.getUTCMonth() + 1, d:u.getUTCDate(), wd:u.getUTCDay() };
}

function semStartIdx(){
  var p = (S.sem.start || "2026-01-01").split("-");
  return dayIdx(+p[0], +p[1], +p[2]);
}

// Round a day back to the first day of the week it falls in
function anchorOf(i){
  var wd = idxParts(i).wd;                       // 0 = Sunday
  return i - ((wd - (S.sem.weekStart|0) + 7) % 7);
}

// Which week this day is in (counting from 1). May be <1 or >weeks, meaning outside the semester.
function weekOf(i){
  if(!S.sem.enabled) return 0;
  return (anchorOf(i) - anchorOf(semStartIdx())) / 7 + 1;
}
function weekFirstDay(w){ return anchorOf(semStartIdx()) + (w - 1) * 7; }

function curWeek(){ return weekOf(idxOf(nowDev())); }
function shownWeek(){
  if(S.cursor !== null && S.selWeek === null) return weekOf(S.cursor);
  if(S.selWeek !== null) return S.selWeek;
  var w = curWeek();
  return (w < 1) ? 1 : (w > S.sem.weeks ? S.sem.weeks : w);
}

// Does this class happen in this week (odd / even weeks)?
function runsInWeek(a, w){
  if(!S.sem.enabled || !a.weekRule) return true;
  return a.weekRule === 1 ? (w % 2 === 1) : (w % 2 === 0);
}

var $ = function(id){ return document.getElementById(id); };

function toast(msg){
  var t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("on"); }, 2200);
}

  return { seedVer: DEMO_SEED_VER, nextId: 1, mode:"normal", roles: 0, quiet: false,
           rooms: [],
           sem: { enabled:false, start:"2026-01-01", weeks:14, weekStart:0, offOutside:true },
           holi: demoHoliDefault(), holiFired: "",
           ringing:false, ringLabel:"", ringCh:0, firedAt:-1,
           skips: [], alarms: [] };
}

function demoSeed(){ return demoSeedEmpty(); }

function demoSeedInitial(){
  var d = demoSeedEmpty();
  d.mode = "student";
  d.roles = 2;
  d.alarms = demoSeedTimetable();
  d.nextId = d.alarms.length + 1;
  return d;
}

// This identifies the shape of fresh demo data. It must never be used as a
// reason to throw away an existing timetable: old data is user data, not seed data.
var DEMO_SEED_VER = 4;

function demoLoad(){
  var raw = "";
  try { raw = localStorage.getItem("clockDemo") || ""; }
  catch(e){ DB = demoSeedInitial(); return; }
  if(!raw){ DB = demoSeedInitial(); return; }

  try{
    DB = JSON.parse(raw);
    if(!DB || typeof DB !== "object") throw new Error("not an object");

    // A build may change its seed version, but that is not permission to erase
    // a real timetable. Keep every alarm and only repair missing metadata.
    var oldVer = DB.seedVer;
    if(!Array.isArray(DB.alarms)) DB.alarms = [];
    if(!DB.nextId || !isFinite(DB.nextId)){
      var maxId = 0;
      DB.alarms.forEach(function(a){
        var id = parseInt(a && a.id, 10);
        if(isFinite(id) && id > maxId) maxId = id;
      });
      DB.nextId = maxId + 1;
    }
    if(!DB.mode) DB.mode = "normal";
    if(!DB.sem) DB.sem = { enabled:false, start:"2026-01-01", weeks:14, weekStart:0, offOutside:true };
    if(!DB.skips) DB.skips = [];
    if(!DB.rooms) DB.rooms = [];
    if(!DB.holi) DB.holi = demoHoliDefault();
    DB.seedVer = DEMO_SEED_VER;

    if(oldVer !== DEMO_SEED_VER){
      demoArchive(raw, "seed-migration");
      // The previous public build started empty. Upgrade only that empty
      // first-run state; a user's real timetable is always left untouched.
      if(DB.alarms.length === 0){
        DB.mode = "student";
        DB.roles = 2;
        DB.alarms = demoSeedTimetable();
        DB.nextId = DB.alarms.length + 1;
      }
      localStorage.setItem("clockDemo", JSON.stringify(DB));
    }
  }catch(e){
    // Keep malformed data for recovery rather than silently destroying it.
    demoArchive(raw, "invalid-data");
    DB = demoSeed();
  }
}

// One rolling recovery copy means a replace import, a migration, or a failed
// save cannot turn into silent data loss. The explicit JSON backup below is the
// portable copy for moving between different GitHub Pages hosts.
function demoArchive(raw, reason){
  if(!raw) return;
  try{
    localStorage.setItem("clockDemoRecovery", raw);
    localStorage.setItem("clockDemoRecoveryAt", new Date().toISOString());
    localStorage.setItem("clockDemoRecoveryWhy", String(reason || "change"));
  }catch(e){}
}

function demoSave(){
  // Logged in -> store in the cloud; not logged in -> store on this phone
  if(!SYNC_OFF && CLOUD.on){ cloudScheduleSave(); return; }
  try{
    var next = JSON.stringify(DB);
    var old = localStorage.getItem("clockDemo");
    if(old && old !== next) demoArchive(old, "before-save");
    localStorage.setItem("clockDemo", next);
  }catch(e){}
}

function demoBackupReady(){

}

// The demo's alarm check (the same rules as the firmware's checkAlarms)
// Lock the phone or switch apps and the browser freezes this page -- setInterval stops dead.
// On unlock the missed minutes have to be checked: an 08:00 class where you unlock at 08:02
// still has to ring. Without that it is only a "rings if you happen to be looking" thing, not an alarm.
var CATCHUP_MIN = 3;
var lastTickMin = -1;

function demoTick(){
  if(!DEMO || !DB) return;
  if(DB.quiet) return;              // timetable only: nothing rings
  var now = new Date();
  var minOfDay = now.getHours()*60 + now.getMinutes();

  var back = 0;
  if(lastTickMin >= 0 && minOfDay !== lastTickMin){
    var gap = (minOfDay - lastTickMin + 1440) % 1440;
    back = Math.min(gap - 1, CATCHUP_MIN);
  }
  lastTickMin = minOfDay;

  // Catch up on missed minutes first (oldest first), then handle the current minute
  for(var k = back; k >= 1; k--)
    if(demoFireAt(new Date(now.getTime() - k * 60000))) return;
  if(demoFireAt(now)) return;
  demoHoliFire(now);
}

// Is anything due this minute? If so ring it and return true.
function demoFireAt(now){
  var minOfDay = now.getHours()*60 + now.getMinutes();
  if(minOfDay === DB.firedAt) return false;

  for(var i=0;i<DB.alarms.length;i++){
    var a = DB.alarms[i];
    if(!a.enabled) continue;

    // Each reminder is worked out separately (10 minutes before, 5 minutes before...)
    var LD = leadList(a), lead = -1, fire = 0, shift = 0;
    for(var q = 0; q < LD.length; q++){
      var f = a.hour*60 + a.minute - LD[q], sh = 0;
      while(f < 0){ f += 1440; sh -= 1; }
      if(f === minOfDay){ lead = LD[q]; fire = f; shift = sh; break; }
    }
    if(lead < 0) continue;

    var ci = idxOf(now) - shift, p = idxParts(ci);
    var iso = p.y + "-" + pad(p.m) + "-" + pad(p.d);
    if(a.days === 0){
      if(a.date && a.date !== iso) continue;
      // A one-off has no "normally", so being on the exception list can only
      // mean the user called it off.
      if(DB.skips.some(function(x){ return x.id === a.id && x.date === iso; })) continue;
    } else {
      if(!(a.days & (1 << p.wd))) continue;
      var listed = DB.skips.some(function(x){ return x.id === a.id && x.date === iso; });
      // An exception flips whatever normally happens on that date, the same way
      // runsOn() does it: a class that normally runs is cancelled, and one that
      // normally does not (a make-up class) is held that day and only that day.
      if((a.defOn !== false) ? listed : !listed) continue;
      // Public holiday -> no classes that day. Classes only (owner is
      // student / teacher); a plain alarm still rings, because waking up
      // still matters on a holiday.
      if(demoHoliOn(iso) && (a.owner || 0) !== 0) continue;
      var wk = weekOf(ci);
      if(DB.sem.enabled){
        if(DB.sem.offOutside && (wk < 1 || wk > DB.sem.weeks)) continue;
        if(a.weekRule === 1 && wk % 2 === 0) continue;
        if(a.weekRule === 2 && wk % 2 !== 0) continue;
      }
    }

    DB.firedAt   = minOfDay;
    DB.ringing   = true;
    DB.ringCh    = a.channels || 3;
    DB.ringLabel = (a.label || t("alarm")) +
                   (lead > 0 ? (lang === "zh" ? "（还有 " + lead + " 分钟）"
                                              : " (in " + lead + " min)") : "");
    if(a.days === 0) a.enabled = false;
    demoSave();
    return true;
  }
  return false;
}

// Is this day in the holiday list (and is auto-cancelling switched on)?
function demoHoliOn(iso){
  var H = DB.holi;
  if(!H || !H.off) return false;
  for(var i = 0; i < (H.list || []).length; i++) if(H.list[i].date === iso) return true;
  return false;
}

// The holiday warning -- the "tomorrow is a holiday" one.
//
// It goes down the same road as an alarm (DB.ringing) because that road
// already has the notification, the sound and the background push wired to
// it; a second mechanism would only produce a second kind of "reminder" that
// behaves differently. The one difference is ringCh, pinned to 2 (phone
// only) -- a holiday notice has no business waking the ESP32's buzzer.
function demoHoliFire(now){
  var H = DB.holi;
  if(!H || !H.list || !H.list.length) return false;
  if((H.remind | 0) < 0) return false;                       // switched off
  if(now.getHours() * 60 + now.getMinutes() !== (H.hour | 0) * 60 + (H.minute | 0))
    return false;

  var target = isoOf(idxOf(now) + (H.remind | 0)), hit = null;
  for(var i = 0; i < H.list.length; i++)
    if(H.list[i].date === target){ hit = H.list[i]; break; }
  if(!hit) return false;

  if(DB.holiFired === target) return false;                  // one warning per holiday
  DB.holiFired = target;

  DB.ringing   = true;
  DB.ringCh    = 2;
  DB.ringLabel = holiRingText(hit, H.remind | 0);
  demoSave();
  return true;
}

// "Holiday tomorrow - Chinese New Year"
function holiRingText(h, days){
  var when = days === 0 ? t("holiToday")
           : days === 1 ? t("holiTomorrow")
           : t("holiInDays", days);
  return when + " \u00b7 " + (h.name || t("holiName"));
}

function demoClamp(v, lo, hi){
  v = parseInt(v, 10); if(isNaN(v)) v = lo;
  return Math.min(hi, Math.max(lo, v));
}

function demoAlarm(o, a){
  a = a || {};
  a.hour     = demoClamp(o.hour, 0, 23);
  a.minute   = demoClamp(o.minute, 0, 59);
  a.days     = demoClamp(o.days, 0, 127);
  a.leads    = (o.leads && o.leads.length)
                 ? o.leads.map(function(v){ return demoClamp(v, 0, 240); }).slice(0, 3)
                 : [demoClamp(o.lead, 0, 240)];
  a.weekRule = demoClamp(o.weekRule, 0, 2);
  a.channels = demoClamp(o.channels, 0, 3) || 3;
  a.owner    = demoClamp(o.owner === undefined ? modeIdx(DB.mode) : o.owner, 0, 2);
  a.date     = /^\d{4}-\d{2}-\d{2}$/.test(o.date || "") ? o.date : "";
  a.enabled  = o.enabled !== false;
  a.label    = String(o.label || "").slice(0, 32);
  a.note     = String(o.note  || "").slice(0, 24);
  a.ev       = String(o.ev    || "").slice(0, 8);
  // How long it runs (minutes). 0 = not set. Only affects the span drawn on the timetable, never the ringing.
  a.dur      = demoClamp(o.dur, 0, 240);
  return a;
}

// The fake API -- the shape it returns matches the real ESP32 exactly
function demoApi(path, opt){
  opt = opt || {};
  var body = {};
  try{ body = opt.body ? JSON.parse(opt.body) : {}; }catch(e){}
  var out = {};

  if(path === "/api/status"){
    var d = new Date();
    out = {
      ok:true, year:d.getFullYear(), month:d.getMonth()+1, day:d.getDate(),
      weekday:d.getDay(), hour:d.getHours(), minute:d.getMinutes(), second:d.getSeconds(),
      semOn:DB.sem.enabled, semWeeks:DB.sem.weeks, weekStart:DB.sem.weekStart,
      week:weekOf(idxOf(d)),
      ringing:DB.ringing, ringingLabel:DB.ringLabel, ringingCh:DB.ringing ? DB.ringCh : 0,
      mode:DB.mode, roles:DB.roles||0, quiet:!!DB.quiet,
      ip:"demo", rssi:-45, count:DB.alarms.length, max:50,
      ap:false, ssid:"DEMO", timeSynced:true, snoozeMin:5
    };
  }
  else if(path === "/api/alarms" && (!opt.method || opt.method === "GET")) out = DB.alarms;
  else if(path === "/api/alarms" && opt.method === "POST"){
    var a = body.id ? DB.alarms.filter(function(x){ return x.id === body.id; })[0] : null;
    if(!a){ a = { id: DB.nextId++ }; DB.alarms.push(a); }
    demoAlarm(body, a); demoSave(); out = a;
  }
  else if(path.indexOf("/api/alarms?id=") === 0){
    var id = parseInt(path.split("=")[1], 10);
    DB.alarms = DB.alarms.filter(function(x){ return x.id !== id; });
    if(DB.rooms) DB.rooms = DB.rooms.filter(function(x){ return x.id !== id; });
    demoSave(); out = { ok:true };
  }
  else if(path === "/api/import"){
    var how   = body.how || "merge";
    var owner = body.owner === undefined ? modeIdx(DB.mode) : body.owner;
    if(how === "replace")
      DB.alarms = DB.alarms.filter(function(a){ return (a.owner||0) !== owner; });

    var added = 0, updated = 0, skipped = 0;
    (body.list || []).forEach(function(o){
      var lb = String(o.label || "").slice(0, 32);
      var hit = how === "merge" ? DB.alarms.filter(function(a){
        return (a.owner||0) === owner && a.days === demoClamp(o.days,0,127) &&
               a.hour === demoClamp(o.hour,0,23) &&
               a.minute === demoClamp(o.minute,0,59) && a.label === lb;
      })[0] : null;
      if(hit){ o.owner = owner; demoAlarm(o, hit); updated++; return; }
      if(DB.alarms.length >= 50){ skipped++; return; }
      o.owner = owner;
      DB.alarms.push(demoAlarm(o, { id: DB.nextId++ })); added++;
    });
    demoSave();
    out = { ok:true, added:added, updated:updated, skipped:skipped, total:DB.alarms.length };
  }
  else if(path === "/api/dedupe"){
    var before = DB.alarms.length, keep = [];
    DB.alarms.forEach(function(a){
      var dup = keep.some(function(k){
        return (k.owner||0) === (a.owner||0) && k.days === a.days &&
               k.hour === a.hour && k.minute === a.minute && k.label === a.label;
      });
      if(!dup) keep.push(a);
    });
    DB.alarms = keep; demoSave();
    out = { ok:true, removed: before - keep.length, total: keep.length };
  }
  else if(path === "/api/mode"){
    if(opt.method === "POST"){
      if(body.mode) DB.mode = body.mode;
      if(body.roles !== undefined) DB.roles = (body.roles | 0) & 7;
      if(body.quiet !== undefined) DB.quiet = !!body.quiet;
      demoSave();
    }
    out = { mode: DB.mode, roles: DB.roles || 0, quiet: !!DB.quiet };
  }
  else if(path === "/api/rooms"){
    if(!DB.rooms) DB.rooms = [];
    if(opt.method === "POST"){
      var rid = body.id | 0, rf = String(body.from || "");
      // Keep one record per class per start date -- editing twice overwrites, it does not stack
      DB.rooms = DB.rooms.filter(function(x){ return !(x.id === rid && x.from === rf); });
      if(!body.del && rid && rf && body.to)
        DB.rooms.push({ id: rid, from: rf, to: String(body.to),
                        note: String(body.note || "").slice(0, 24) });
      demoSave();
    }
    out = DB.rooms;
  }
  else if(path === "/api/skips"){
    if(opt.method === "POST"){
      var hit = DB.skips.findIndex(function(x){
        return x.id === body.id && x.date === body.date; });
      if(body.skip === false){ if(hit >= 0) DB.skips.splice(hit, 1); }
      else if(hit < 0 && body.id && body.date) DB.skips.push({id:body.id, date:body.date});
      demoSave();
    }
    out = DB.skips;
  }
  else if(path === "/api/holidays"){
    if(!DB.holi) DB.holi = demoHoliDefault();
    if(opt.method === "POST"){
      DB.holi = {
        list: (body.list || []).slice(0, 120).map(function(x){
          return { date: String(x.date || ""), name: String(x.name || "").slice(0, 32) };
        }).filter(function(x){ return /^\d{4}-\d{2}-\d{2}$/.test(x.date); }),
        off:    body.off !== false,
        remind: demoClamp(body.remind, -1, 7),
        hour:   demoClamp(body.hour,   0, 23),
        minute: demoClamp(body.minute, 0, 59)
      };
      demoSave();
    }
    out = DB.holi;
  }
  else if(path === "/api/semester"){
    if(opt.method === "POST"){
      DB.sem = {
        enabled: !!body.enabled,
        start: /^\d{4}-\d{2}-\d{2}$/.test(body.start || "") ? body.start : DB.sem.start,
        weeks: demoClamp(body.weeks, 1, 52),
        weekStart: body.weekStart ? 1 : 0,
        offOutside: body.offOutside !== false
      };
      demoSave();
    }
    out = DB.sem;
  }
  else if(path === "/api/dismiss" || path === "/api/snooze"){
    DB.ringing = false; DB.ringLabel = ""; demoSave();
    out = { ok:true, snooze:5 };
  }
  else if(path === "/api/test"){
    DB.ringing = true; DB.ringCh = 3;
    DB.ringLabel = lang === "zh" ? "测试" : "Test";
    setTimeout(function(){ DB.ringing = false; DB.ringLabel = ""; }, 4000);
    out = { ok:true };
  }
  else out = { ok:true };

  return Promise.resolve(out);
}

function api(path, opt){
  // Logged in -> go through the cloud (the cloud reuses the demo engine, the data just lives elsewhere)
  if(DEMO) return demoApi(path, opt);
  return fetch(path, opt).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).catch(function(err){
    // Only switch to demo if we have **never** connected (so people without hardware get the full thing).
    // Never switch after a successful connection -- better to show "cannot reach it" than to bury real data under samples.
    if(!demoTried && !everOnline && !CLOUD.on){
      demoTried = true;
      enterDemo();
      return demoApi(path, opt);
    }
    throw err;
  });
}

function pad(n){ return (n<10?"0":"") + n; }

// The format <input type="date"> wants
function todayISO(){
  var d = nowDev();
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}

// ---------- Time ----------
function nowDev(){ return new Date(Date.now() + S.offset); }

function tick(){
  var d = nowDev();
  $("hm").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
  $("ss").textContent = pad(d.getSeconds());
  $("wd").textContent = WD(d.getDay());
  $("date").textContent = S.online ? t("date", d) : t("offline");
  var db = $("dbTime");
  if(db) db.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());

  // Which network the device is on (worth spelling out in hotspot mode, or people wonder why there is no internet)
  var nb = $("netInfo"), st = S.status;
  if(S.online && st && st.ssid){
    nb.hidden = false;
    nb.innerHTML = (st.ap ? "&#128246; " + t("netAp", esc(st.ssid))
                          : "&#128246; " + t("netSta", esc(st.ssid))) +
                   (st.ok ? "" : " &middot; " + t("netHint"));
    nb.classList.toggle("warn2", !!st.ap || !st.ok);
  } else nb.hidden = true;
  $("dot").className = "dot " + (S.online ? "on" : "off");
  paintHomeNow();
}

// ---------- Fetching data ----------
// While the ESP32 runs its own hotspot there is no internet and NTP cannot sync.
// So send it the phone's time -- the phone's clock is already correct.
var syncing = false;
function pushPhoneTime(){
  if(syncing) return;
  syncing = true;
  api("/api/time", {
    method:"POST",
    body: JSON.stringify({ epoch: Math.floor(Date.now() / 1000) })
  }).then(function(){
    toast(t("tTimeSynced"));
    return pull();
  }).catch(function(){}).then(function(){ syncing = false; });
}

function pull(){
  return api("/api/status").then(function(st){
    S.online = true;
    S.status = st;
    if(st.ok){
      var dev = new Date(st.year, st.month-1, st.day, st.hour, st.minute, st.second);
      S.offset = dev.getTime() - Date.now();
    } else {
      // The device has no time at all -> set it for it
      S.offset = 0;
      pushPhoneTime();
    }
    everOnline = true;
    paintLost();
    if(st.roles !== undefined){
      var r = (st.roles | 0) & 7;
      if(r === 0){
        // The backend has no roles yet. If this phone remembers them, reuse them instead of asking again.
        if(S.roleLocal){
          S.roles = S.roleLocal; S.roleSet = true; S.roleAsked = true;
          fixMode(); paintModes();
          api("/api/mode", { method:"POST",
                             body: JSON.stringify({ mode:S.mode, roles:S.roles }) })
            .catch(function(){});
        } else if(!S.roleAsked){
          if(S.micro === "tt"){ S.roleAsked = true; openRole(); }
        }
      } else if(!S.roleSet || r !== S.roles){
        S.roles = r; S.roleSet = true; fixMode(); paintModes();
      }
    }
    if(st.quiet !== undefined && !!st.quiet !== S.quiet){
      S.quiet = !!st.quiet; paintQuietBtn();
    }
    if(st.mode && st.mode !== S.mode && hasRole(st.mode)){ S.mode = st.mode; paintModes(); }
    tick();
    applyPendingRing();
    paintRing();
  }).catch(function(){
    S.online = false; tick(); paintLost();
  });
}

// Was connected, then dropped -- say plainly "this is the last data we received",
// so nobody thinks their timetable has been wiped.
function paintLost(){
  var bar = $("demoBar");
  if(DEMO) return;                         // demo mode has its own banner
  if(!everOnline || S.online){ bar.hidden = true; bar.classList.remove("lost"); return; }

  bar.hidden = false;
  bar.classList.add("lost");
  bar.innerHTML = '<b>' + t("lostTitle") + '</b>' + t("lostDesc") +
    '<div class="dbtns"><button id="lostRetry">' + t("lostRetry") + '</button></div>';
  $("lostRetry").onclick = function(){ pull(); };
}

}

function pullSem(){

// ---------- Ringing banner ----------
function paintRing(){
  var box = $("ringBox");
  if(!S.status || !S.status.ringing){
    box.innerHTML = "";
    box.dataset.on = "";
    stopRinging();          // the device stopped (or someone else dismissed it) -> stop here too
    return;
  }
  if(box.dataset.on === "1") return;
  box.dataset.on = "1";

  // Only notify and make noise if that alarm has the "phone" channel ticked
  if(S.status.ringingCh & 2) notifyPhone(S.status.ringingLabel);
  box.innerHTML =
    '<div class="ring"><h3>&#128276; ' + esc(S.status.ringingLabel || t("alarm")) + '</h3>' +
    '<p>' + t("ringNow") + '</p><div class="btns">' +
    '<button id="rSnooze">' + t("snooze", S.status.snoozeMin || 5) + '</button>' +
    '<button class="main" id="rStop">' + t("dismiss") + '</button></div></div>';
  $("rStop").onclick   = function(){ act("/api/dismiss"); };
  $("rSnooze").onclick = function(){ act("/api/snooze");  };
}

function act(url){
  stopRinging();            // "dismiss / snooze" goes quiet immediately, without waiting for the server
  $("ringBox").dataset.on = "";
  $("ringBox").innerHTML = "";
  api(url, {method:"POST"}).then(pull).catch(function(){});
}

// ============================================================

var INK = "#123243";

function svgWrap(inner, w, h){

    return svgWrap(

      '<circle cx="60" cy="101" r="6" fill="#ffd800" stroke="#d9a400" stroke-width="1.6"/>',
      w, h);
  }

  if(kind === "sleepy"){
    // Asleep: eyes shut, mouth open snoring, nightcap on, Zs floating
    e = '<ellipse cx="47" cy="27" rx="12.5" ry="15.5" fill="#fff" stroke="' + INK + '" stroke-width="2.4"/>' +
        '<ellipse cx="73" cy="27" rx="12.5" ry="15.5" fill="#fff" stroke="' + INK + '" stroke-width="2.4"/>' +
        '<path d="M41 30q6 7 12 0M67 30q6 7 12 0" stroke="' + INK + '" stroke-width="2.6" ' +

            '<text x="107" y="16" font-size="11">z</text></g>';
  } else if(kind === "happy"){
    // Happy: eyes curved into ^ ^, big laugh, a dorayaki in hand
    e = '<ellipse cx="47" cy="27" rx="12.5" ry="15.5" fill="#fff" stroke="' + INK + '" stroke-width="2.4"/>' +
        '<ellipse cx="73" cy="27" rx="12.5" ry="15.5" fill="#fff" stroke="' + INK + '" stroke-width="2.4"/>' +
        '<path d="M41 34q6-9 12 0M67 34q6-9 12 0" stroke="' + INK + '" stroke-width="2.8" ' +
        'fill="none" stroke-linecap="round"/>';
    m = '<path d="M33 68q27 30 54 0Z" fill="' + INK + '"/>' +
        '<path d="M47 82q13 13 26 0Z" fill="#e60012"/>';
    extra = '<g transform="translate(96 92)">' +
            '<ellipse cx="0" cy="0" rx="18" ry="12" fill="#c98a3a"/>' +
