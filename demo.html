<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover first, and nothing after it that iOS does not know:
     interactive-widget is a Chrome-only key, and the keyboard is handled by
     visualViewport now, so it bought nothing and risked a strict parser
     throwing the whole declaration -- cover included -- away. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#00a0e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket · UTAR">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png" id="touchIcon">
<title>Pocket · UTAR</title>
<style>
:root{
  /* Doraemon: body blue #00a0e9, white belly, nose/collar red #e60012, bell yellow #ffd93b */
  --bg:#e8f5fd; --card:#ffffff; --card2:#eaf4fc; --line:#cfe6f5;
  --tx:#123243; --tx2:#5d8299; --tx3:#6f93a8;
  /* --ac is a shade darker than the official blue #00a0e9 so white text has enough contrast (4.0:1).
     The Doraemon up top and the big clock still use the official #00a0e9 */
  --ac:#0086c9; --ac2:#0071a8; --ok:#12a150; --warn:#b06800; --bad:#e60012;
  --bell:#ffd93b; --bell2:#e0a000;
  --onac:#fff;        /* text sitting on an --ac  background */
  --onac2:#fff;       /* text sitting on an --ac2 background (dark themes flip this) */
  --sky:#fff;         /* that wash of light at the top */
  --grad1:#00a0e9; --grad2:#00669c;      /* big clock gradient: official blue, artwork is exempt from small-text contrast */
  --swoff:#d5e7f2; --swknob:#a8c4d4;     /* switch in the off position */
  --toastbg:#123243; --toasttx:#fff;
  --ring1:#e60012; --ring2:#ff9d00;      /* ringing banner */
  --demo1:#00a0e9; --demo2:#00669c;      /* DEMO banner */
  --shadow:#0a5c86;
  --r:18px;

}
/* ============================================================
    Other themes: override only the variables above -- not one line of component CSS changes.
    To add another, copy a block and change the colours. */
   ============================================================ */

/* Dorami -- yellow body + red bow */
:root[data-theme="dorami"]{
  --bg:#fff9e8; --card:#ffffff; --card2:#fff4d6; --line:#f1e0ac;
  --tx:#3d3218; --tx2:#8a7440; --tx3:#a08b52;
  --ac:#e8452f; --ac2:#b8341f; --ok:#12a150; --warn:#a86a00; --bad:#c9182b;
  --bell:#ffd800; --bell2:#d9a400;
  --onac2:#fff;                           /* ac2 is deep red, so white text */
  --sky:#fffdf3;
  --grad1:#f5b400; --grad2:#c07d00;
  --swoff:#f0e3bc; --swknob:#c9b787;
  --toastbg:#3d3218; --toasttx:#fff;
  --ring1:#e8452f; --ring2:#ffb300;
  --demo1:#f5b400; --demo2:#c07d00;
  --shadow:#8a7440;
}

/* Anywhere Door -- that pink door */
:root[data-theme="door"]{
  --bg:#fdeef5; --card:#ffffff; --card2:#fdeff6; --line:#f6cfe0;
  --tx:#401f30; --tx2:#8d5a75; --tx3:#a3728c;
  --ac:#d6367f; --ac2:#a81f5f; --ok:#12a150; --warn:#b06800; --bad:#e11d48;
  --bell:#ffd93b; --bell2:#e0a000;
  --onac2:#fff;                           /* ac2 is deep pink, so white text */
  --sky:#fff5fa;
  --grad1:#f06eaa; --grad2:#a81f5f;
  --swoff:#f6d9e6; --swknob:#cba0b6;
  --toastbg:#401f30; --toasttx:#fff;
  --ring1:#e11d48; --ring2:#f06eaa;
  --demo1:#f06eaa; --demo2:#a81f5f;
  --shadow:#8d5a75;
}

/* Sleeping Doraemon -- dark, easy on the eyes at night */
:root[data-theme="sleepy"]{
  --bg:#08131c; --card:#0f2231; --card2:#16303f; --line:#22455a;
  --tx:#e6f3fb; --tx2:#93b7cc; --tx3:#6d8fa5;
  --ac:#0086c9; --ac2:#5cc7f7; --ok:#3ddc84; --warn:#f5b942; --bad:#ff6b6b;
  --bell:#ffd93b; --bell2:#c99400;
  --onac2:#08131c;                        /* ac2 got lighter, so dark text on it */
  --sky:rgba(0,160,233,.22);
  --grad1:#7fd8ff; --grad2:#0086c9;
  --swoff:#22455a; --swknob:#6d8fa5;
  --toastbg:#e6f3fb; --toasttx:#08131c;
  --ring1:#e60012; --ring2:#ff9d00;
  --demo1:#0086c9; --demo2:#083b57;
  --shadow:#000;
}

/* Doraemon with a dorayaki -- the warm brown of a dorayaki */
:root[data-theme="happy"]{
  --bg:#fdf3e3; --card:#ffffff; --card2:#fbf0dd; --line:#ecd9b6;
  --tx:#3a2a14; --tx2:#876840; --tx3:#9c8156;
  --ac:#b4661b; --ac2:#8d4d10; --ok:#12a150; --warn:#a86a00; --bad:#c9182b;
  --bell:#ffd93b; --bell2:#d9a400;
  --onac2:#fff;
  --sky:#fffaf0;
  --grad1:#c98a3a; --grad2:#8d4d10;
  --swoff:#eddfc4; --swknob:#c2ab86;
  --toastbg:#3a2a14; --toasttx:#fff;
  --ring1:#c9182b; --ring2:#e08a00;
  --demo1:#c98a3a; --demo2:#8d4d10;
  --shadow:#876840;
}

/* ============================================================
    Shared design tokens. Deliberately NOT part of the colour block
    above and never restated by a theme: a theme changes colour, it
    does not get its own type scale or its own idea of a corner.
    The theme test enforces that split -- everything in the colour
    :root must appear in every theme, and this block must not.
   ============================================================ */
:root{
/* ============================================================
    Design system. Colours stay per-theme above; everything below is
    shared, so a theme never has to restate a size or a duration.

    Numbers are the signature of this app. A campus runs on issued
    numbers -- matric, GPA, credits, room, bus time, ringgit -- so every
    one of them is set in --mono with tabular figures. That is why the
    column of grades in GPA lines up and the balance in Wallet does not
    jitter as it changes.
   ============================================================ */
--mono:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono","Roboto Mono",
       "DejaVu Sans Mono",Menlo,Consolas,monospace;

/* Type scale. Nothing in the app should use a size that is not here. */
--fs-2xs:10.5px; --fs-xs:11.5px; --fs-sm:13px; --fs-md:15px;
--fs-lg:17px;    --fs-xl:20px;   --fs-2xl:26px; --fs-3xl:34px;

/* Spacing. A 4px grid, named so the rhythm survives editing. */
--sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
--sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px;

/* Corners */
--r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:26px; --r-full:999px;

/* Elevation. A shadow alone disappears on a dark theme, so every raised
   surface also carries a hairline. --edge is that hairline. */
--edge:color-mix(in srgb, var(--tx) 8%, transparent);
--e1:0 1px 2px color-mix(in srgb, var(--shadow) 14%, transparent);
--e2:0 6px 16px -10px color-mix(in srgb, var(--shadow) 55%, transparent);
--e3:0 18px 40px -22px color-mix(in srgb, var(--shadow) 70%, transparent);

/* Motion. One duration scale, one curve -- the iOS decelerate, which is
   what makes a tap feel answered rather than animated. */
--mo-1:120ms; --mo-2:200ms; --mo-3:320ms; --mo-4:460ms;
--ease:cubic-bezier(.32,.72,0,1);
--ease-out:cubic-bezier(.16,1,.3,1);
}

/* ---------- Cloud / account ---------- */
.cloudbtn{position:absolute;top:16px;left:92px;padding:7px 12px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);
  font-size:14px;line-height:1;font-family:inherit;cursor:pointer}
.cloudbtn:active{border-color:var(--ac)}
.cloudbtn.on{border-color:var(--ok);color:var(--ok)}

.acct{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:13px;
  background:var(--card2);border:1px solid var(--line);margin-bottom:16px}
.acct .av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ac);
  color:var(--onac);display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700}
.acct .ai{flex:1;min-width:0}
.acct .ai b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.acct .ai small{color:var(--tx2);font-size:12px}

.tabs2{display:flex;gap:5px;background:var(--card2);padding:4px;border-radius:11px;
  margin-bottom:16px}
.tabs2 button{flex:1;padding:9px;border:0;border-radius:8px;background:transparent;
  color:var(--tx2);font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}
.tabs2 button.on{background:var(--ac);color:var(--onac)}

.idhint{margin:-9px 0 15px;padding:9px 12px;border-radius:9px;font-size:12.5px;
  line-height:1.6;background:var(--card2);color:var(--tx2);border-left:3px solid var(--line)}
.idhint.good{border-left-color:var(--ok)}
.idhint.warn{border-left-color:var(--warn)}
.idhint b{color:var(--tx)}

.forgot{display:block;width:100%;margin:0 0 6px;padding:9px;border:0;
  background:transparent;color:var(--ac2);font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;text-align:center;text-decoration:underline}

/* Push toggle */
.pushbox{margin:0 0 16px}
.pushtog{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:13px;
  border:2px solid var(--line);background:var(--card2);color:var(--tx);
  font-family:inherit;cursor:pointer;transition:.15s}
.pushtog .pt{display:block;font-size:14.5px;font-weight:700}
.pushtog .ps{display:block;font-size:12px;color:var(--tx2);margin-top:3px;line-height:1.55}
.pushtog.on{border-color:var(--ok);background:var(--card)}
.pushtog.on .pt{color:var(--ok)}
.pushtog:disabled{opacity:.5}
.pushmsg{margin-top:9px;padding:10px 12px;border-radius:9px;font-size:12.5px;
  line-height:1.65;background:var(--card2);color:var(--tx2);
  border-left:3px solid var(--line)}
.pushmsg.ok{border-left-color:var(--ok)}
.pushmsg.bad{border-left-color:var(--bad);color:var(--bad)}
.pushmsg b{color:var(--tx)}

.pwrow{display:flex;gap:8px;align-items:stretch}
.pwrow input{flex:1;min-width:0}
.pweye{flex:none;padding:0 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--card2);color:var(--tx2);font-size:12.5px;font-weight:700;
  font-family:inherit;cursor:pointer;white-space:nowrap}
.pweye:active{border-color:var(--ac);color:var(--ac2)}

.cloudmsg{margin:0 0 14px;padding:11px 13px;border-radius:10px;font-size:13px;
  line-height:1.65;background:var(--card2);border-left:4px solid var(--bad);color:var(--bad)}
.cloudmsg.ok{border-left-color:var(--ok);color:var(--ok)}
.cloudmsg.busy{border-left-color:var(--ac);color:var(--tx2)}

/* ---------- Day / week / month switch ---------- */
.vtabs{display:flex;gap:5px;background:var(--card);padding:4px;border-radius:12px;
  margin:0 0 12px}
.vtabs button{flex:1;padding:9px 4px;border:0;border-radius:9px;background:transparent;
  color:var(--tx2);font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;
  transition:.15s}
.vtabs button.on{background:var(--ac);color:var(--onac)}

/* Previous / next + where you are now */
.vnav{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.vnav button{flex:none;width:38px;height:38px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);
  font-size:16px;line-height:1;font-family:inherit;cursor:pointer}
.vnav button:active{border-color:var(--ac);color:var(--ac2)}
.vnav .vt{flex:1;text-align:center;font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums}
.vnav .vt small{display:block;font-size:11.5px;font-weight:600;color:var(--tx3);
  margin-top:2px}
.vnav .today{flex:none;width:auto;padding:0 13px;font-size:12.5px;font-weight:700}

/* ---------- Month view ---------- */
.mgrid{display:grid;grid-template-columns:30px repeat(7,1fr);gap:4px;align-items:stretch}
/* The week number down the left of each row */
.mwk{display:flex;align-items:center;justify-content:center;border-radius:8px;
  background:var(--card2);color:var(--ac2);font-size:10.5px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1}
.mwk.out{background:transparent;color:var(--tx3);opacity:.5}
.mwk.now{background:var(--ac);color:var(--onac)}
.mgrid .wh{text-align:center;font-size:11px;font-weight:700;color:var(--tx3);
  padding:2px 0 5px;letter-spacing:.04em}
.mcell{
  position:relative;aspect-ratio:1;border-radius:10px;border:1px solid transparent;
  background:var(--card);color:var(--tx);font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:5px 2px 0;gap:3px;overflow:hidden;
}
.mcell .dn{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.mcell .dots{display:flex;gap:2.5px;flex-wrap:wrap;justify-content:center;padding:0 2px}
.mcell .dots i{width:5px;height:5px;border-radius:50%;background:var(--ac);display:block}
.mcell .dots i.off{background:var(--tx3);opacity:.5}
.mcell .more{font-size:9.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.mcell.dim{opacity:.32}
.mcell.today{border-color:var(--ac);background:var(--card2)}
.mcell.today .dn{color:var(--ac2)}
.mcell.sel{background:var(--ac)}
.mcell.sel .dn{color:var(--onac)}
.mcell.sel .dots i{background:var(--onac)}
.mcell.wknd .dn{color:var(--tx3)}
.mcell.sel.wknd .dn{color:var(--onac)}

/* The list of that day under the month grid */
.mday{margin-top:16px}
.mday h4{margin:0 0 8px 4px;font-size:12.5px;font-weight:700;color:var(--tx2)}

/* ---------- Single day ---------- */
.dayhead{display:flex;align-items:baseline;gap:10px;margin:0 0 12px 4px}
.dayhead .big{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;line-height:1}
.dayhead .wd{font-size:14px;font-weight:700}
.dayhead .wk{margin-left:auto;font-size:12px;color:var(--tx3);font-weight:600}

/* ---------- "No class this week" ---------- */
.offbtn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin:0 0 12px;padding:13px 14px;border-radius:13px;
  border:1px solid var(--line);background:var(--card);color:var(--tx);
  font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
}
.offbtn:active{border-color:var(--ac);color:var(--ac2)}
.offbtn .cnt{
  margin-left:auto;padding:2px 9px;border-radius:99px;background:var(--warn);
  color:#fff;font-size:12px;font-variant-numeric:tabular-nums;
}

.kinds{border:1px solid var(--line);border-radius:12px;margin:0 0 16px;
  background:var(--card2);overflow:hidden}
.kinds summary{padding:12px 15px;cursor:pointer;font-size:13.5px;font-weight:700;
  list-style:none;display:flex;align-items:center;gap:9px;color:var(--tx)}
.kinds summary::-webkit-details-marker{display:none}
.kinds summary::after{content:"+";margin-left:auto;color:var(--tx3);font-size:18px;font-weight:400}
.kinds[open] summary::after{content:"\2212"}
.kinds[open] summary{border-bottom:1px solid var(--line)}
.kinds .hint{margin:12px 12px 10px}
.kindrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 15px;border:0;border-top:1px solid var(--line);background:transparent;
  color:var(--tx);font-size:14px;font-family:inherit;cursor:pointer}
.kindrow.subj{border-top-width:2px}
.kindrow.subj .knm{font-weight:800;font-size:14.5px}
.kindrow.kid{padding-left:30px;background:var(--card2)}
.kindrow.kid .knm{font-weight:600;font-size:13px;color:var(--tx2)}
.kindrow .knm{font-weight:700}
.kindrow .kct{color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums}
.kindrow .kst{margin-left:auto;font-size:12px;font-weight:700;color:var(--warn)}
.kindrow.on .kst{color:var(--ok)}

.rm.moved{color:var(--ac2);font-weight:700}

/* The bar at the top in timetable-only mode. Deliberately not a warning colour -- this is not an error, the user chose it */
.qbar{display:flex;align-items:center;gap:8px;margin-bottom:13px;
  padding:10px 14px;border-radius:12px;font-size:12.5px;font-weight:600;
  color:var(--tx2);background:var(--card);border:1px dashed var(--line)}
/* Timetable-only list: no switch, so reclaim the padding on the right */
.item.flat{padding-right:15px}
.item.flat .info{padding-right:0}

/* ---------- Timetable view ---------- */
.tt{display:flex;flex-direction:column;gap:13px}
.ttday{background:var(--card);border-radius:var(--r);overflow:hidden}
.ttday.today{box-shadow:0 0 0 2px var(--ac)}
.ttdh{display:flex;align-items:baseline;gap:9px;padding:11px 15px 10px;
  font-size:14.5px;font-weight:800;border-bottom:1px solid var(--line)}
.ttdh .dd{color:var(--tx3);font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums}
.ttdh .tag{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.06em;
  background:var(--ac);color:var(--onac);border-radius:99px;padding:2px 9px}
.ttrow{display:flex;align-items:stretch;gap:11px;padding:11px 15px;
  border-top:1px solid var(--line);cursor:pointer}
.ttrow:first-of-type{border-top:0}
.ttt{flex:none;width:52px;text-align:right;font-variant-numeric:tabular-nums;
  padding-top:1px}
.ttt b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;
  line-height:1.15}
.ttt i{display:block;font-style:normal;font-size:11.5px;color:var(--tx3);
  margin-top:2px}
.ttbar{flex:none;width:3px;border-radius:3px;background:var(--ac);opacity:.55}
.ttinfo{flex:1;min-width:0;padding-top:1px}
.ttinfo>b{display:block;font-size:15px;font-weight:700;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttinfo>small{display:block;margin-top:3px;font-size:12px;color:var(--tx2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttk{flex:none;align-self:center;width:23px;height:23px;border-radius:8px;
  display:grid;place-items:center;font-size:11px;font-weight:800;
  color:var(--onac)}
.ttk.lecture{background:var(--ac)}
.ttk.tutorial{background:var(--ok)}
.ttk.practical{background:var(--warn)}
/* The switch on a timetable row: the same one the alarm list uses, a size down so it fits */
.ttsw{align-self:center;width:40px;height:24px;margin-left:2px}
.ttsw::after{width:18px;height:18px}
.ttsw.on::after{left:19px}
/* A cancelled row fades, but its switch must not -- that is the thing you are about to press */
.ttrow.off>*:not(.ttsw){opacity:.5}
.ttrow.off .ttt b,.ttrow.off .ttinfo>b{text-decoration:line-through}
.ttrow.off .ttbar{background:var(--tx3)}
.offrow .opt{font-size:11px;font-weight:700;color:var(--warn);
  border:1px solid var(--warn);border-radius:5px;padding:0 4px;margin-left:5px}

.offday{margin-bottom:14px}
.offday h4{margin:0 0 7px 3px;font-size:12px;font-weight:700;color:var(--tx2);
  letter-spacing:.05em}
.offrow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px 14px;margin-bottom:6px;border-radius:12px;
  border:1px solid var(--line);background:var(--card2);color:var(--tx);
  font-size:14px;font-family:inherit;cursor:pointer;
}
.offrow .ot{flex:none;font-variant-numeric:tabular-nums;font-weight:600;
  min-width:46px;color:var(--tx2)}
.offrow .onm{flex:1;min-width:0;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.offrow .ost{flex:none;font-size:12px;font-weight:700;color:var(--ok)}
.offrow.off{background:transparent;border-style:dashed}
.offrow.off .onm,.offrow.off .ot{text-decoration:line-through;opacity:.55}
.offrow.off .ost{color:var(--warn)}

/* ---------- Help ---------- */
.helpbtn{position:absolute;top:16px;left:46px;padding:7px 12px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);
  font-size:14px;font-weight:700;line-height:1;font-family:inherit;cursor:pointer}
.helpbtn:active{border-color:var(--ac)}

.help details{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;
  background:var(--card2);overflow:hidden}
.help summary{padding:13px 15px;cursor:pointer;font-size:14.5px;font-weight:700;
  list-style:none;display:flex;align-items:center;gap:10px}
.help summary::-webkit-details-marker{display:none}
.help summary::after{content:"+";margin-left:auto;color:var(--tx3);font-size:19px;
  line-height:1;font-weight:400}
.help details[open] summary::after{content:"\2212"}
.help details[open] summary{border-bottom:1px solid var(--line)}
.help .hb{padding:13px 15px;font-size:13.5px;line-height:1.8;color:var(--tx2)}
.help .hb b{color:var(--tx)}
.help .hb code{color:var(--ac2);font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.92em;overflow-wrap:break-word}
.help .hb p{margin:0 0 9px}
.help .hb p:last-child{margin-bottom:0}
.help .hb ul{margin:0 0 9px;padding-left:19px}
.help .hb li{margin-bottom:4px}
.help .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bell);
  color:#4a3200;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Theme picker ---------- */
.themebtn{position:absolute;top:16px;left:0;padding:7px 12px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);
  font-size:14px;line-height:1;font-family:inherit;cursor:pointer}
.themebtn:active{border-color:var(--ac)}

.themeopts{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.themeopt{display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:13px 8px 12px;border:2px solid var(--line);border-radius:15px;
  background:var(--card2);color:var(--tx);font-size:13.5px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:.15s}
.themeopt .face{line-height:0}
.themeopt .face svg{display:block}
.themeopt .sw3{display:flex;gap:4px}
.themeopt .sw3 i{width:13px;height:13px;border-radius:50%;display:block;
  border:1px solid rgba(0,0,0,.14)}
.themeopt.on{border-color:var(--ac);background:var(--card)}
.themeopt:active{transform:scale(.98)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;width:100%;
  overflow:hidden;overscroll-behavior:none;
}
/* The root is deliberately NOT --app-h. It has one job -- paint the whole
   web view -- and 100% of the initial containing block is the only thing
   that reliably means "as tall as the thing I am inside". Constraining it
   to the visible height instead left a white strip under the app on an
   installed iOS app: WebKit painted the root's background over the root's
   box rather than the whole canvas, and the rest fell back to the web
   view's own white. Layout is body's problem, and body is --app-h. */
html{height:100%;min-height:100%}
/* No `height` here on purpose. When a fixed element has top, bottom AND
   height, the spec says bottom loses -- so `height:100%` was quietly
   sizing the whole app to 100% of <html> instead of to the viewport, and
   any browser whose dvh does not match its layout viewport (iOS
   standalone with a translucent status bar is one) left the app short by
   exactly that difference. That was the pale band across the bottom of
   the home screen on a real iPhone. inset:0 alone is the viewport, in
   every browser, installed or not. */
body{
  /* Pinned to the top-left and given a measured height, rather than
     inset:0. Every viewport unit and every inset lies somewhere: iOS
     standalone reports a dvh that is not the layout viewport (a strip of
     the launcher's background_color shows under the app), and Chrome's
     collapsing toolbar means the layout viewport is the LARGE one, so an
     app sized to it runs underneath the toolbar and its bottom row is
     unreachable. Same defect, opposite symptom. fitViewport() writes the
     one number both cases need -- visualViewport.height -- into --app-h
     and keeps it there; 100dvh is only the value before the first frame
     of JavaScript. */
  position:fixed;top:0;left:0;width:100%;
  height:100dvh;height:var(--app-h,100dvh);
  /* If --app-h is ever short of the web view, the root behind it is still
     painted, so the gap shows the wallpaper rather than white. */
  background:var(--bg); color:var(--tx);
  background-image:radial-gradient(125% 62% at 50% -4%,var(--sky) 0%,transparent 64%);
  font:var(--fs-md)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text",
       "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"cv01" 1;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
/* Long-pressing a label in a native app does not raise a selection handle.
   Fields you type into still behave like fields; anything a student may
   genuinely need to copy opts back in with .selectable. */
input,textarea,select,[contenteditable],.selectable{
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none;user-drag:none}
.wrap{
  position:absolute;inset:0;max-width:640px;margin:0 auto;
  padding:env(safe-area-inset-top) 16px calc(104px + env(safe-area-inset-bottom));
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;
}

/* ---------- Doraemon up top ---------- */
.dora{line-height:0;margin-bottom:2px}
.dora svg{filter:drop-shadow(0 7px 14px rgba(10,92,134,.24));
  animation:dorafloat 3.6s ease-in-out infinite}
@keyframes dorafloat{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.dora svg{animation:none}}

/* ---------- Clock up top ---------- */
.clock{text-align:center;padding:14px 0 18px;position:relative}
.langbtn{position:absolute;top:16px;right:0;padding:7px 13px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);
  font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:.05em}
.langbtn:active{border-color:var(--ac);color:var(--ac2)}
.clock .t{
  font-size:clamp(56px,19vw,86px); font-weight:200; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums; line-height:1;
  background:linear-gradient(180deg,var(--grad1),var(--grad2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.clock .t .sec{font-size:.34em;font-weight:400;color:var(--tx3);
  -webkit-text-fill-color:var(--tx3);margin-left:8px;letter-spacing:0}
.clock .wd{
  display:inline-block;margin:14px 0 6px;padding:7px 20px;border-radius:999px;
  background:linear-gradient(135deg,var(--grad1),var(--grad2));
  font-size:17px;font-weight:600;letter-spacing:.06em;
  box-shadow:0 6px 20px -6px var(--ac);
}
.clock .d{color:var(--tx2);font-size:14px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--tx3);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--bad)}

/* Which network the device is on */
.netinfo{display:block;margin:9px auto 0;padding:4px 12px;border-radius:99px;
  border:1px solid transparent;background:transparent;color:var(--tx3);
  font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer}
.netinfo.warn2{color:var(--warn);border-color:rgba(245,158,11,.32)}

/* ---------- Semester / week number ---------- */
.wkbadge{
  display:inline-block;margin-top:11px;padding:6px 15px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);
  font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;
}
.wkbadge b{color:var(--ac2)}
.wkbadge.out{border-color:rgba(245,158,11,.4)}
.wkbadge.out b{color:var(--warn)}

/* Week strip */
.wkstrip{display:flex;gap:7px;overflow-x:auto;padding:2px 4px 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:none;
  touch-action:pan-x}
.wkstrip::-webkit-scrollbar{display:none}
.wkstrip button{
  flex:none;min-width:56px;padding:9px 6px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);
  font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1.35
}
.wkstrip button .n{display:block;font-size:15px;color:var(--tx)}
.wkstrip button .r{display:block;font-size:10px;color:var(--tx3);font-weight:600}
.wkstrip button.now{border-color:var(--ac2)}
.wkstrip button.now .n{color:var(--ac2)}
.wkstrip button.sel{background:var(--ac);border-color:var(--ac)}
.wkstrip button.sel .n,.wkstrip button.sel .r{color:var(--onac)}

/* One card per day (gives it a calendar feel) */
.daycard{background:var(--card);border-radius:var(--r);margin-bottom:10px;
  overflow:hidden;border:1px solid transparent}
.daycard.today{border-color:var(--ac)}
.daycard>.dh{display:flex;align-items:baseline;gap:9px;padding:11px 15px 9px}
.daycard>.dh .dw{font-size:13px;font-weight:700}
.daycard>.dh .dd{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.daycard>.dh .tag{margin-left:auto;font-size:10.5px;font-weight:700;
  color:var(--ac2);letter-spacing:.05em}
.daycard.today>.dh .dw{color:var(--ac2)}
.daycard>.dh.nil{opacity:.42}
.daycard .item{padding-left:15px}

/* ---------- Roles (intro screen / changed later) ---------- */
.rolebtn{display:inline-block;margin:11px 0 0 7px;padding:6px 15px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);
  font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
.rolebtn:active{border-color:var(--ac);color:var(--ac2)}
/* Timetable only: lit up, so it is obvious at a glance that nothing will ring */
.rolebtn.quiet{background:var(--ac);color:var(--onac);border-color:var(--ac)}

.roleopts{display:flex;flex-direction:column;gap:10px}
.roleopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:15px 16px;border:2px solid var(--line);border-radius:15px;
  background:var(--card2);color:var(--tx);font-size:15px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:.15s}
.roleopt .em{flex:none;font-size:26px;line-height:1}
.roleopt .rt{flex:1;min-width:0}
.roleopt .rn{display:block}
.roleopt .rd{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-top:3px}
.roleopt .tick{flex:none;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--line);color:transparent;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.roleopt.on{border-color:var(--ac);background:var(--card)}
.roleopt.on .tick{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.roleopt:active{transform:scale(.99)}
.rolehint{margin:14px 0 0;padding:11px 13px;border-radius:10px;
  background:var(--card2);border-left:4px solid var(--bell);
  font-size:12.5px;color:var(--tx2);line-height:1.7}
.rolehint b{color:var(--tx)}
.act button:disabled{opacity:.4}

/* ---------- Mode switch ---------- */
.modes{display:flex;gap:6px;background:var(--card);padding:5px;
  border-radius:14px;margin:4px 0 20px}
/* Hide the whole row when there is only one role (has to beat the display:flex above) */
.modes[hidden]{display:none}
.modes button{
  flex:1;padding:11px 4px;border:0;border-radius:10px;background:transparent;
  color:var(--tx2);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:.18s
}
.modes button .em{display:block;font-size:17px;margin-bottom:2px}
.modes button.on{background:var(--ac);color:var(--onac);box-shadow:0 4px 14px -4px var(--ac)}

/* DEMO mode banner */
#demoBar{background:linear-gradient(135deg,var(--demo1),var(--demo2));border-radius:var(--r);
  padding:15px 16px;margin-bottom:16px;font-size:12.5px;line-height:1.65}
#demoBar.lost{background:linear-gradient(135deg,var(--warn),var(--bad))}
#demoBar b{display:block;font-size:15px;margin-bottom:4px}
#demoBar .dbtns{display:flex;gap:9px;margin-top:12px}
#demoBar button{flex:1;padding:10px;border:0;border-radius:10px;font-size:13px;
  font-weight:700;font-family:inherit;cursor:pointer;
  background:rgba(255,255,255,.22);color:#fff}

/* ---------- Ringing banner ---------- */
.ring{
  background:linear-gradient(135deg,var(--ring1),var(--ring2)); border-radius:var(--r);
  padding:18px; margin-bottom:16px; animation:pulse 1s infinite
}
@keyframes pulse{50%{filter:brightness(1.22)}}
.ring h3{margin:0 0 3px;font-size:19px}
.ring p{margin:0 0 14px;opacity:.9;font-size:13px}
.ring .btns{display:flex;gap:10px}
.ring button{
  flex:1;padding:13px;border:0;border-radius:11px;font-size:15px;font-weight:700;
  font-family:inherit;cursor:pointer;background:rgba(255,255,255,.2);color:#fff
}
.ring button.main{background:#fff;color:#e60012}

/* ---------- Sections ---------- */
.sec-h{display:flex;align-items:center;justify-content:space-between;
  margin:22px 4px 10px}
.sec-h h2{margin:0;font-size:13px;font-weight:700;color:var(--tx2);
  letter-spacing:.09em;text-transform:uppercase}
.sec-h .lnk{color:var(--ac2);font-size:13px;font-weight:600;cursor:pointer}

/* ---------- Alarm card ---------- */
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:13px;padding:14px 15px;
  border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item.off{opacity:.42}
.item.next{background:linear-gradient(90deg,rgba(0,160,233,.14),transparent)}
.item .time{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;
  min-width:82px;letter-spacing:-.02em}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:15px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .info small{color:var(--tx2);font-size:12px;display:block;margin-top:2px}
.item .info .lead{color:var(--warn);font-weight:600}
.item .info .rm{color:var(--tx3)}

/* Switch */
.sw{width:46px;height:28px;border-radius:99px;background:var(--swoff);
  position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
  border-radius:50%;background:var(--swknob);transition:.2s}
.sw.on{background:var(--ac)}
.sw.on::after{left:21px;background:#fff}

.empty{text-align:center;padding:44px 20px;color:var(--tx3)}
.empty .em{font-size:42px;margin-bottom:10px}
.empty p{margin:0 0 4px;font-size:14px}

/* Week grouping */
.daygrp{margin-bottom:14px}
.daygrp>h4{margin:0 0 7px 4px;font-size:12px;color:var(--tx2);font-weight:700;
  letter-spacing:.06em}
.daygrp>h4 .today{color:var(--ac2)}

/* ---------- The two main buttons at the bottom ---------- */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;gap:10px;max-width:640px;margin:0 auto;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--bg) 26%);
}
.ab{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:16px 10px;border:0;border-radius:15px;
  font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
  background:var(--card2);color:var(--tx);border:1px solid var(--line);
  box-shadow:0 10px 26px -14px var(--shadow);
}
.ab .ic{font-size:18px;line-height:1}
.ab.main{background:var(--ac);color:var(--onac);border-color:var(--ac);
  box-shadow:0 8px 26px -10px rgba(0,160,233,.85)}
.ab:active{transform:scale(.975)}

/* Single-session action sheet */
.occhead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.occhead .occt{font-size:32px;font-weight:200;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}
.occhead b{display:block;font-size:17px;font-weight:600}
.occhead small{color:var(--tx2);font-size:12.5px}
.occbadge{background:var(--card2);border-radius:11px;padding:11px 13px;
  font-size:12.5px;color:var(--tx2);line-height:1.6;margin-bottom:16px}
.occbadge.off{background:rgba(245,158,11,.13);color:var(--warn)}
.occacts{display:flex;gap:11px}
.occacts button{flex:1;padding:15px 10px;border:0;border-radius:13px;
  font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}

/* Move just this one session (teacher pushes it later / earlier / a make-up class) */
.occmove{display:block;width:100%;margin-top:11px;padding:13px;border-radius:12px;
  border:1px dashed var(--line);background:transparent;color:var(--tx2);
  font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}
.occmove:active{border-color:var(--ac);color:var(--ac2)}

/* A cancelled session */
.item.skip .time,.item.skip .info b{text-decoration:line-through}
.item.skip{opacity:.45}
.item .info .cx{color:var(--warn);font-weight:700}

/* ---------- Bottom sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(8,60,88,.44);backdrop-filter:blur(3px);
  z-index:50;display:none}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border-radius:22px 22px 0 0;max-height:92dvh;overflow-y:auto;overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;
  padding:8px 18px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
.grip{width:38px;height:4px;background:var(--line);border-radius:9px;margin:8px auto 14px}
.sheet h3{margin:0 0 18px;font-size:19px;text-align:center}

label.f{display:block;margin-bottom:15px}
label.f>span{display:block;font-size:12px;color:var(--tx2);margin-bottom:7px;
  font-weight:600;letter-spacing:.04em}
input,select,textarea{
  width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;
  background:var(--card2);color:var(--tx);font-size:16px;font-family:inherit
}
textarea{min-height:150px;resize:vertical;font-size:14px;line-height:1.7;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=time]{font-size:24px;text-align:center;font-weight:300;
  font-variant-numeric:tabular-nums}
/* Start - end. The end time is optional; with it the timetable view can draw the span */
.trange{display:flex;align-items:center;gap:8px}
.trange input{flex:1;min-width:0;font-size:20px;padding:11px 4px}
.trange .dash{flex:none;color:var(--tx3);font-size:17px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}

/* Weekday chips */
.days{display:flex;gap:6px}
.days button{
  flex:1;aspect-ratio:1;border:1px solid var(--line);border-radius:11px;
  background:var(--card2);color:var(--tx2);font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:.15s
}
.days button.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.wkpick{display:flex;align-items:center;gap:8px;margin-top:9px}
.wkpick>span{flex:none;font-size:12px;color:var(--tx3)}
.wkpick select{flex:1;min-width:0;padding:9px;font-size:14px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.chips button{
  padding:7px 14px;border:1px solid var(--line);border-radius:99px;
  background:transparent;color:var(--tx2);font-size:12.5px;font-weight:600;
  font-family:inherit;cursor:pointer
}
.chips button.on{background:var(--ac2);border-color:var(--ac2);color:var(--onac2)}

.row{display:flex;gap:11px}
.row>*{flex:1}

/* Where the reminder goes */
/* Preview: doubles as the browser audio-permission unlock */
.testring{display:block;width:100%;margin:0 0 15px;padding:11px;border-radius:11px;
  border:1px dashed var(--line);background:transparent;color:var(--tx2);
  font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.testring:active{border-color:var(--ac);color:var(--ac2)}

.chrow{display:flex;gap:10px}
.chbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:15px 8px;border:1px solid var(--line);border-radius:13px;
  background:var(--card2);color:var(--tx2);font-family:inherit;cursor:pointer;
  font-size:13px;font-weight:700;transition:.15s}
.chbtn .ic{font-size:21px;line-height:1;filter:grayscale(1) opacity(.55)}
.chbtn.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.chbtn.on .ic{filter:none}

/* Minutes early: type a number, or pick a common one */
.numrow{display:flex;align-items:center;gap:11px}
.numrow input{flex:1;text-align:center;font-size:22px;font-weight:300;
  font-variant-numeric:tabular-nums}
.numrow .unit{flex:none;color:var(--tx2);font-size:14px;font-weight:600}
.addlead{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);color:var(--ac2);font-size:22px;line-height:1;
  font-family:inherit;cursor:pointer}
.addlead:active{background:var(--ac);border-color:var(--ac);color:var(--onac)}
/* The "one / several" toggle. Defaults to one -- tapping a chip selects only that chip. */
.multitog{
  display:block;width:100%;margin:0 0 9px;padding:9px 13px;border-radius:10px;
  border:1px dashed var(--line);background:transparent;color:var(--tx2);
  font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;text-align:left;
}
.multitog.on{border-style:solid;border-color:var(--ac);background:var(--card2);color:var(--ac2)}

/* Multi-select chips laid out in a grid, all visible at once */
.chips.multi{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 0 11px}
.chips.multi button{padding:10px 4px}
.leadhint{margin-top:10px;font-size:12.5px;color:var(--tx2);background:var(--card2);
  padding:10px 13px;border-radius:10px;line-height:1.6;border-left:4px solid var(--bell)}

}

/* Upload row */

/* The + on each day in the calendar */

.prev{max-height:200px;overflow-y:auto;background:var(--card2);border-radius:12px;
  padding:6px;margin-top:12px}

  font-size:12.5px;color:var(--tx2)}

/* The "Holiday" marker on a calendar cell */

.mcell.holi .dn{color:var(--ac2);font-weight:800}

.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);
  background:var(--toastbg);border:1px solid var(--toastbg);color:var(--toasttx);padding:12px 22px;
  border-radius:99px;font-size:14px;z-index:99;opacity:0;pointer-events:none;
  transition:.25s;box-shadow:0 12px 30px -10px var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Campus home — iPhone / iPad springboard, not cards */
.homebtn{position:absolute;top:16px;left:0;z-index:60;padding:7px 12px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);
  font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1}
.homebtn:active{border-color:var(--ac);color:var(--ac)}
.themebtn{left:46px}
.helpbtn{left:92px}
.cloudbtn{left:138px}

/* ============================================================
    Pocket: the campus home and everything that opens from it.

    Two rules run through all of it. Raised surfaces carry a hairline as
    well as a shadow, because a shadow alone vanishes on the dark theme.
    And numbers are set in --mono with tabular figures -- a campus runs on
    issued numbers, and lining them up is what makes a list of grades or
    ringgit read as a record rather than as text.
   ============================================================ */
/* A home screen is not a document that happens to be short. It fills the
   glass: the icons take whatever height is left over, and search and the
   dock sit at the bottom where a thumb is. Anything else leaves a dead
   band under the last row, which is the one thing no phone home screen
   has ever had. */
#pocketHome{
  display:none;position:absolute;inset:0;
  flex-direction:column;
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;
  /* --sp-10 under the pill was 40px of nothing at the bottom of every
     phone -- most of the row of icons that now fits there instead. The
     safe-area insets still get their space on a device that has them. */
  padding:calc(var(--sp-3) + env(safe-area-inset-top)) 0
          calc(var(--sp-3) + env(safe-area-inset-bottom));
  box-sizing:border-box;
  background:
    radial-gradient(120% 70% at 50% -10%, color-mix(in srgb, var(--ac) 28%, #fff), transparent 62%),
    linear-gradient(180deg, color-mix(in srgb, var(--ac) 14%, var(--bg)) 0%, var(--bg) 48%);
}
body.at-home #pocketHome{display:flex}

/* The root carries the same paint as the home screen. Nothing should
   ever be able to see past #pocketHome -- but a browser that sizes its
   viewport differently from its dvh, a rubber band, a rotation caught
   mid-frame, all put a few pixels of canvas on screen, and the eye reads
   a strip of a different colour as a broken app. Painting the canvas the
   same makes those pixels invisible instead of making them a bug report.
   applyLook() mirrors data-wall onto <html> and <body> for exactly this
   reason -- whichever of the three layers a browser leaves showing, it is
   the same paint. */
html,body{
  background:
    radial-gradient(120% 70% at 50% -10%, color-mix(in srgb, var(--ac) 28%, #fff), transparent 62%),
    linear-gradient(180deg, color-mix(in srgb, var(--ac) 14%, var(--bg)) 0%, var(--bg) 48%);
}

/* ---- Wallpapers ----
   A wallpaper is a background layer over the theme, not a sixth theme:
   the five themes still own every colour in the app, and this owns one
   rectangle behind the icons. Bought in the Store, chosen on Account.
   The dark ones set --tx on the home element alone, so the labels stay
   readable without touching any other screen. */
html[data-wall="dawn"],
body[data-wall="dawn"],
#pocketHome[data-wall="dawn"]{background:
  linear-gradient(180deg,#ffd9a8 0%,#fca97f 34%,#c9738c 68%,#6d5090 100%)}
html[data-wall="neon"],
body[data-wall="neon"],
#pocketHome[data-wall="neon"]{background:
  radial-gradient(85% 55% at 18% 0%,rgba(124,58,237,.65),transparent 62%),
  radial-gradient(70% 45% at 92% 22%,rgba(14,165,233,.45),transparent 60%),
  linear-gradient(180deg,#180f33 0%,#2b1152 52%,#080b24 100%)}
html[data-wall="sakura"],
body[data-wall="sakura"],
#pocketHome[data-wall="sakura"]{background:
  radial-gradient(90% 55% at 50% -8%,#fff2f7,transparent 62%),
  linear-gradient(180deg,#ffe6f0 0%,#ffc9de 46%,#f7a9c6 100%)}
html[data-wall="ocean"],
body[data-wall="ocean"],
#pocketHome[data-wall="ocean"]{background:
  radial-gradient(80% 50% at 50% 0%,rgba(56,189,248,.4),transparent 60%),
  linear-gradient(180deg,#0a3b5e 0%,#0d5c82 44%,#04202f 100%)}
html[data-wall="grid"],
body[data-wall="grid"],
#pocketHome[data-wall="grid"]{background:
  repeating-linear-gradient(0deg,rgba(120,140,170,.16) 0 1px,transparent 1px 22px),
  repeating-linear-gradient(90deg,rgba(120,140,170,.16) 0 1px,transparent 1px 22px),
  linear-gradient(180deg,#f7f9fc 0%,#e8edf5 100%)}
html[data-wall="dusk"],
body[data-wall="dusk"],
#pocketHome[data-wall="dusk"]{background:
  linear-gradient(180deg,#f8b195 0%,#c06c84 40%,#6c5b7b 72%,#355c7d 100%)}

/* ---- Icon skins ----
   The glyph never changes; the plate under it does. */
#pocketHome[data-skin="glass"] .homeTile .icon{
  background:rgba(255,255,255,.16) !important;
  border:1px solid rgba(255,255,255,.42);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px -12px rgba(10,30,60,.7)}
#pocketHome[data-skin="ink"] .homeTile .icon{
  background:transparent !important;border:2px solid currentColor;color:var(--tx);
  box-shadow:none}
#pocketHome[data-skin="mono"] .homeTile .icon{
  background:var(--tx) !important;color:var(--bg);box-shadow:var(--e1)}
#pocketHome[data-skin="round"] .homeTile .icon{border-radius:50%}

/* ---- The Store ---- */
.shopBal{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.shopBal .coins{font-family:var(--mono);font-size:var(--fs-2xl);font-weight:800;
  letter-spacing:-.03em}
.shopGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3);
  margin:var(--sp-3) 0 0}
.shopCard{background:var(--card);border:1px solid var(--edge);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--e1);display:flex;flex-direction:column}
.shopSwatch{height:78px;display:grid;place-items:center}
.shopSwatch i{width:26px;height:26px;border-radius:8px;display:block;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px -6px rgba(10,30,60,.8)}
.shopMeta{padding:var(--sp-3);display:flex;flex-direction:column;gap:6px;flex:1}
.shopMeta b{font-size:var(--fs-sm);font-weight:700;letter-spacing:-.01em}
.shopMeta .price{font-family:var(--mono);font-size:var(--fs-xs);color:var(--tx3)}
.shopMeta button{margin-top:auto;appearance:none;border:1px solid var(--edge);
  border-radius:var(--r-full);padding:6px 10px;font:inherit;font-size:var(--fs-xs);
  font-weight:700;cursor:pointer;background:var(--card2);color:var(--tx);
  transition:transform var(--mo-1) var(--ease)}
.shopMeta button:active{transform:scale(.94)}
.shopMeta button.on{background:var(--ac);border-color:transparent;color:var(--onac)}
.shopMeta button.owned{background:var(--card2);color:var(--tx3)}
body.at-home .wrap,
body.at-home .actionbar{display:none !important}

/* The search bar used to carry the gap under the top row. It is hidden
   now, so the gap belongs here or the first row of icons sits under
   the buttons. */
.homeTop{display:flex;justify-content:space-between;align-items:center;
  margin:0 0 var(--sp-3)}
.homeMe{
  position:relative;width:34px;height:34px;padding:0;display:grid;place-items:center;
  border-radius:var(--r-full);border:1px solid var(--edge);
  background:color-mix(in srgb, var(--card) 62%, transparent);color:var(--tx);cursor:pointer;
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  transition:transform var(--mo-1) var(--ease)}
.homeMe:active{transform:scale(.93)}
.homeMe svg{width:19px;height:19px;display:block}
/* A green pip when a session is live, so "am I signed in" is answered
   from the home rather than by opening the screen to find out. */
.homeMe i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
  background:var(--ok);border:2px solid var(--bg);display:block}
.homeMe i[hidden]{display:none}
.homeLang{padding:6px 13px;border-radius:var(--r-full);border:1px solid var(--edge);
  background:color-mix(in srgb, var(--card) 62%, transparent);color:var(--tx);
  font-size:var(--fs-sm);font-weight:700;font-family:inherit;cursor:pointer;
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  transition:transform var(--mo-1) var(--ease),opacity var(--mo-1) linear}
.homeLang:active{transform:scale(.94);opacity:.75}

/* ---------- The lockup: crest, name, campus ---------- */
/* The search field itself. It only appears once the pill is tapped, and
   it appears next to the pill rather than at the top of the screen. */
/* The lid -- crest, "Pocket", campus chip -- came off on 2026-08-24. A
   home screen does not caption itself, and the three of them were the
   only thing on this page that read as a web page's masthead. What the
   space is worth instead is search: the one super-app affordance the
   home was missing. */
/* The enrolment QR. Supabase hands back an SVG as a data URI, so this is
   only a frame: white behind it whatever the theme, because a scanner
   wants black on white and a dark card would break it. */
.qrBox{margin:var(--sp-3) auto;width:200px;height:200px;padding:10px;
  background:#fff;border-radius:var(--r-md);border:1px solid var(--edge);
  display:grid;place-items:center}
.qrBox img{width:100%;height:100%;display:block;image-rendering:pixelated}

/* Rearranging. The wobble is two half-degree rotations out of phase, so
   a grid of them does not pulse in unison and read as a loading state. */
@keyframes jiggleA{50%{transform:rotate(-1.4deg) translateY(-1px)}}
@keyframes jiggleB{50%{transform:rotate(1.4deg) translateY(1px)}}
body.editing .homePage .homeTile{animation:jiggleA .34s ease-in-out infinite}
body.editing .homePage .homeTile:nth-child(2n){animation-name:jiggleB;animation-delay:-.17s}
body.editing .homePage .homeTile.held{visibility:hidden;animation:none}
body.editing .homePager{touch-action:none}
.homeTile.ghost{
  position:fixed;left:0;top:0;z-index:120;margin:0;pointer-events:none;
  animation:none;opacity:.94;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.34))}
.homeDone{
  flex:none;align-self:center;margin:0 0 var(--sp-2);
  padding:8px 22px;border-radius:var(--r-full);border:0;cursor:pointer;
  background:var(--ac);color:var(--onac);font:inherit;
  font-size:var(--fs-sm);font-weight:700;box-shadow:var(--e2)}
.homeDone[hidden]{display:none}
@media (prefers-reduced-motion:reduce){
  body.editing .homePage .homeTile{animation:none;outline:2px dashed var(--ac);
    outline-offset:3px;border-radius:var(--r-md)}
}

/* The search pill: small, centred, above the dock. Tapping it opens the
   real field just above. */
.homeQPill{
  /* The one on an iPhone is a small dim capsule you stop seeing after a
     week, and that is the whole design: it has to be findable, not
     noticed. This used to be a 13px semibold label in a bordered white
     pill with a saturating blur -- the loudest thing on the screen after
     the icons. No border, no card, a smaller and quieter label, and a
     fixed height so it costs the layout a known 26px. */
  flex:none;align-self:center;display:flex;align-items:center;gap:5px;
  height:26px;padding:0 12px;border-radius:var(--r-full);cursor:pointer;
  border:0;color:var(--tx3);
  background:color-mix(in srgb, var(--card) 34%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font:inherit;font-size:var(--fs-xs);font-weight:600;line-height:1;
  transition:transform var(--mo-1) var(--ease),
             opacity var(--mo-2) linear,color var(--mo-2) linear}
.homeQPill:active{transform:scale(.95)}
.homeQPill svg{width:13px;height:13px;display:block;flex:none}
.homeQPill[hidden]{display:none}

/* Closed by default. A search field is a thing you go and get, not a
   permanent bar across the top of a home screen. */
.homeSearch{
  flex:none;display:none;align-items:center;gap:var(--sp-2);
  margin:0 0 var(--sp-2);padding:0 var(--sp-4);
  height:44px;border-radius:var(--r-full);
  border:1px solid var(--edge);
  background:color-mix(in srgb, var(--card) 74%, transparent);
  backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);
  box-shadow:var(--e1);
  transition:border-color var(--mo-2) linear,box-shadow var(--mo-2) linear;
}
.homeSearch.on{display:flex;animation:qOpen var(--mo-2) var(--ease-out) both}
@keyframes qOpen{from{opacity:0;transform:translateY(8px) scaleY(.86)}}
.homeSearch:focus-within{border-color:var(--ac);box-shadow:var(--e2)}
.homeSearch svg{width:18px;height:18px;flex:none;color:var(--tx3)}
.homeSearch input{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  font:inherit;font-size:var(--fs-md);color:var(--tx);
  -webkit-user-select:text;user-select:text;
}
.homeSearch input::placeholder{color:var(--tx3)}
.homeSearch input::-webkit-search-cancel-button{display:none}
#homeQx{
  flex:none;width:22px;height:22px;padding:0;border:0;border-radius:50%;
  background:var(--card2);color:var(--tx2);font-size:11px;line-height:1;
  cursor:pointer;display:grid;place-items:center}
/* The x is always there now: on an empty field it closes the search
   rather than clearing it, which is the only thing left to do with it. */

/* One row per hit. The colour square is the app's own tile face, shrunk --
   it is how you tell at a glance that this line lives in Deadlines and
   the one under it lives in Exams. */
#homeHits{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:none}
#homeHits[hidden]{display:none}
.hitGroup{margin:0 0 var(--sp-4)}
.hitK{margin:0 0 var(--sp-2);font-size:var(--fs-2xs);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-family:var(--mono)}
.hitRow{
  display:flex;align-items:center;gap:var(--sp-3);width:100%;text-align:left;
  appearance:none;border:1px solid var(--edge);border-radius:var(--r-md);
  background:var(--card);color:var(--tx);font:inherit;cursor:pointer;
  padding:var(--sp-3) var(--sp-3);margin:0 0 var(--sp-2);box-shadow:var(--e1);
  transition:transform var(--mo-1) var(--ease)}
.hitRow:active{transform:scale(.985)}
.hitDot{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.34)}
.hitDot svg{width:17px;height:17px;display:block}
.hitMain{min-width:0;flex:1}
.hitT{display:block;margin:0;font-size:var(--fs-sm);font-weight:650;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitS{display:block;margin:1px 0 0;font-size:var(--fs-2xs);color:var(--tx2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* The strip that says what is on now or next. It is the one thing on the
   home screen that changes by itself, so it gets the accent edge. */
.homeNow{
  display:none;width:100%;max-width:400px;margin:0 auto var(--sp-5);
  padding:var(--sp-3) var(--sp-4);
  border:1px solid var(--edge);border-left:3px solid var(--ac);
  border-radius:var(--r-md);background:var(--card);color:var(--tx);
  text-align:left;font:inherit;cursor:pointer;box-shadow:var(--e2);
  transition:transform var(--mo-1) var(--ease)}
.homeNow.on{display:block;animation:riseIn var(--mo-4) var(--ease-out) both}
.homeNow .k{font-size:var(--fs-2xs);font-weight:800;color:var(--ac);margin:0 0 3px;
  letter-spacing:.1em;text-transform:uppercase}
.homeNow .t{font-size:var(--fs-lg);font-weight:700;margin:0;letter-spacing:-.02em}
.homeNow .s{font-size:var(--fs-sm);color:var(--tx2);margin:3px 0 0;font-family:var(--mono)}
.homeNow:active{transform:scale(.985)}

/* ---------- The grid ---------- */
/* A home screen with more apps than fit gets pages, not a longer column.
   Scroll snapping does the whole gesture -- momentum, the rubber band at
   the ends, trackpad and touch alike -- so there is no drag handler here
   to fight the one that owns the back swipe. */
.homePager{
  flex:1 1 auto;min-height:0;
  display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
  touch-action:pan-x;scroll-behavior:smooth;
}
/* Exactly the scrollport wide, snapped to its start.
   Every page element carries BOTH classes, so `.homeGrid`'s max-width was
   capping the page as well as the columns: a page was 364px inside a
   390px scrollport, page two began 26px before the right edge, and its
   first column of icons sat there in the gutter, in view, all the time.
   That is the sliver people kept seeing on the home screen.
   The selector is .homePager > .homePage on purpose: .homeGrid is defined
   further down this stylesheet, so at equal specificity it would win on
   source order alone -- which is exactly how the bug got in.
   The page is full width now and the 364px cap moved into its padding,
   which is inside the border box (box-sizing:border-box, line 448) and so
   leaves the snap area exactly one scrollport wide. max() keeps the
   padding at zero on anything narrower than 364px.
   The rows pack from the top and keep the grid's own row gap. This used
   to be align-content:space-evenly, which handed every leftover pixel of
   a full-height page to the gaps between rows -- on a tall phone that is
   ~45px of nothing between each row of icons, and the home screen read
   as broken rather than airy. Leftover height belongs at the bottom of
   the page, the way it does on a real home screen -- and there is much
   less of it now that fitPage() sizes a page in whole rows.
   The padding has a floor of --sp-4 rather than 0. At 350px of scrollport
   the 364px cap contributed nothing, so the icons ran to both edges and a
   swipe put page one's last column hard against page two's first with
   8px between them: mid-gesture the two pages read as one broken grid
   rather than as two pages passing. A gutter each side puts ~45px of
   nothing on the seam, which is what makes the swipe legible. */
.homePager > .homePage{flex:0 0 100%;max-width:none;
  scroll-snap-align:start;scroll-snap-stop:always;
  padding-inline:max(var(--sp-4), calc((100% - var(--shell-w)) / 2));
  align-content:start}
/* Nothing to line up against, so it sits in the middle of the screen
   rather than hugging the top of a 1180px iPad. */
.homePager.single > .homePage{align-content:center}
/* paintPages() empties this when there is only one page, and an empty
   row of dots still spent 36px of a phone's screen on nothing. */
.homeDots{flex:none;display:flex;justify-content:center;gap:8px;
  margin:var(--sp-3) 0 var(--sp-2);min-height:8px}
.homeDots:empty{display:none}
.homeDots button{
  width:8px;height:8px;padding:0;border:0;border-radius:50%;cursor:pointer;
  background:var(--tx3);opacity:.3;
  transition:opacity var(--mo-2) linear,transform var(--mo-2) var(--ease)}
.homeDots button.on{opacity:.85;transform:scale(1.2)}

.homeGrid{
  display:grid;grid-template-columns:repeat(var(--home-cols), minmax(0, 1fr));
  column-gap:var(--col-gap);row-gap:var(--row-gap);
  max-width:var(--shell-w);margin:0 auto;justify-items:center;width:100%;
}
.homeTile{
  appearance:none;width:100%;max-width:var(--cell);padding:0;
  border:0;background:transparent;color:var(--tx);
  font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);
  animation:tileIn var(--mo-4) var(--ease-out) both;
}
.homeTile .icon{
  width:var(--icon);height:var(--icon);border-radius:calc(var(--icon) * .25);
  display:grid;place-items:center;
  color:#fff;flex:none;
  box-shadow:0 8px 16px -10px rgba(12,40,70,.6),
             inset 0 1px 0 rgba(255,255,255,.34),
             inset 0 -1px 0 rgba(0,0,0,.14);
  transition:transform var(--mo-2) var(--ease);
}
.homeTile .icon svg{width:calc(var(--icon) * .48);height:calc(var(--icon) * .48);display:block;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.homeTile:active .icon{transform:scale(.9)}
.homeTile .name{
  /* One line, like every phone. Two lines were reserved here for a while
     so that "Lost and found" could not make its own grid row 15px taller
     than the others; a single line does the same job without spending
     15px under all twenty-six names, and it is what makes the rows read
     as a grid rather than a list. The label is allowed to be wider than
     its column and spill into the gap -- iOS does this too -- so a long
     name is not clipped at the icon's own width. */
  margin:0;width:calc(100% + var(--col-gap));
  font-size:var(--fs-xs);font-weight:600;line-height:1.3;
  letter-spacing:-.005em;text-align:center;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* A shell with nothing behind it yet wears a dot, so the home screen never
   pretends every icon is finished. */
.homeTile[data-shell] .icon::after{
  content:"";position:absolute;margin:38px 0 0 38px;width:7px;height:7px;
  border-radius:50%;background:var(--bell);box-shadow:0 0 0 2px var(--bg)}
.homeTile[data-id="today"] .icon,.hitDot[data-id="today"]{background:linear-gradient(180deg,#7aa0ff,#3d6dff)}
.homeTile[data-id="tt"] .icon,.hitDot[data-id="tt"]{background:linear-gradient(180deg,#5bb4ee,var(--ac))}
.homeTile[data-id="att"] .icon,.hitDot[data-id="att"]{background:linear-gradient(180deg,#46d39a,#1fa971)}
.homeTile[data-id="due"] .icon,.hitDot[data-id="due"]{background:linear-gradient(180deg,#ff8b6a,#e24b2c)}
.homeTile[data-id="ev"] .icon,.hitDot[data-id="ev"]{background:linear-gradient(180deg,#ffd56a,#e8a317)}
.homeTile[data-id="gpa"] .icon,.hitDot[data-id="gpa"]{background:linear-gradient(180deg,#c084fc,#7c3aed)}
.homeTile[data-id="id"] .icon,.hitDot[data-id="id"]{background:linear-gradient(180deg,#94a3b8,#475569)}
.homeTile[data-id="cash"] .icon,.hitDot[data-id="cash"]{background:linear-gradient(180deg,#4ade80,#16a34a)}
.homeTile[data-id="bus"] .icon,.hitDot[data-id="bus"]{background:linear-gradient(180deg,#67e8f9,#0891b2)}
.homeTile[data-id="map"] .icon,.hitDot[data-id="map"]{background:linear-gradient(180deg,#86efac,#15803d)}
.homeTile[data-id="dorm"] .icon,.hitDot[data-id="dorm"]{background:linear-gradient(180deg,#fdb4ff,#c026d3)}
.homeTile[data-id="sos"] .icon,.hitDot[data-id="sos"]{background:linear-gradient(180deg,#ff7b7b,#dc2626)}
.homeTile[data-id="food"] .icon,.hitDot[data-id="food"]{background:linear-gradient(180deg,#ff9a62,#e25a28)}
.homeTile[data-id="ride"] .icon,.hitDot[data-id="ride"]{background:linear-gradient(180deg,#7fd4ea,#2a9fc4)}
.homeTile[data-id="wall"] .icon,.hitDot[data-id="wall"]{background:linear-gradient(180deg,#f08cc4,#d45a9a)}
.homeTile[data-id="chat"] .icon,.hitDot[data-id="chat"]{background:linear-gradient(180deg,#8ab4ff,#4f46e5)}
.homeTile[data-id="shop"] .icon,.hitDot[data-id="shop"]{background:linear-gradient(180deg,#f9a8d4,#be185d)}

@keyframes tileIn{from{opacity:0;transform:translateY(10px) scale(.94)}}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}}
@keyframes stageIn{from{opacity:0;transform:translateX(18px)}}
@keyframes rowIn{from{opacity:0;transform:translateY(7px)}}

/* The device status bar. Off everywhere except inside the frame. */
#deviceBar{display:none}

/* Page two of the home. The palette keeps walking round the wheel so no
   two neighbours share a hue and nothing lands on another app's colour. */
.homeTile[data-id="lib"] .icon,.hitDot[data-id="lib"]{background:linear-gradient(180deg,#f0a868,#c2410c)}
.homeTile[data-id="exam"] .icon,.hitDot[data-id="exam"]{background:linear-gradient(180deg,#a5b4fc,#4338ca)}
.homeTile[data-id="print"] .icon,.hitDot[data-id="print"]{background:linear-gradient(180deg,#9ca3af,#374151)}
.homeTile[data-id="wash"] .icon,.hitDot[data-id="wash"]{background:linear-gradient(180deg,#7dd3fc,#0369a1)}
.homeTile[data-id="club"] .icon,.hitDot[data-id="club"]{background:linear-gradient(180deg,#fca5a5,#b91c1c)}
.homeTile[data-id="job"] .icon,.hitDot[data-id="job"]{background:linear-gradient(180deg,#5eead4,#0f766e)}
.homeTile[data-id="med"] .icon,.hitDot[data-id="med"]{background:linear-gradient(180deg,#fda4af,#be123c)}
.homeTile[data-id="lost"] .icon,.hitDot[data-id="lost"]{background:linear-gradient(180deg,#fcd34d,#b45309)}
.homeTile[data-id="me"] .icon,.hitDot[data-id="me"]{background:linear-gradient(180deg,#64748b,#0f172a)}

/* ---------- An app, opened ---------- */
/* Home and an app are two panes on a stack, not one pane with its middle
   swapped out. Opening pushes the app in from the right and lets home
   fall back and dim; Back -- or a drag from the left edge -- pops it.
   Nothing here loads anything. It is the motion that stops a screen
   change reading as a page load. */
#homeStub{
  display:none;position:absolute;inset:0;z-index:12;
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:calc(var(--sp-4) + env(safe-area-inset-top)) var(--sp-5)
          calc(var(--sp-10) + env(safe-area-inset-bottom));
  text-align:left;will-change:transform;
  transition:transform var(--mo-2) var(--ease);
  background:
    radial-gradient(120% 62% at 50% -10%, color-mix(in srgb, var(--ac) 20%, #fff), transparent 60%),
    linear-gradient(180deg, color-mix(in srgb, var(--ac) 9%, var(--bg)) 0%, var(--bg) 44%);
  box-shadow:-20px 0 44px -22px rgba(0,0,0,.42);
}
#homeStub.on{display:block}
/* The timetable is its own pane; an app must not hang over it. */
body:not(.at-home) #homeStub{display:none}
.stubPane{max-width:var(--pane-w);margin:0 auto}
#homeStub.pushing{animation:pushIn var(--mo-3) var(--ease) both}
#homeStub.popping{animation:pushOut var(--mo-2) var(--ease) both}
#homeStub.dragging{transition:none}
@keyframes pushIn{from{transform:translateX(100%)}}
@keyframes pushOut{to{transform:translateX(100%)}}
#pocketHome{transition:transform var(--mo-3) var(--ease),opacity var(--mo-3) linear}
#pocketHome.in-app{transform:translateX(-16%) scale(.965);opacity:.5}
.stubBar{display:flex;align-items:center;gap:var(--sp-3);margin:0 0 var(--sp-2)}
#stubBack{flex:none;width:36px;height:36px;padding:0;border:1px solid var(--edge);
  border-radius:var(--r-full);background:var(--card);
  color:var(--tx);font:inherit;font-size:var(--fs-lg);font-weight:700;cursor:pointer;
  box-shadow:var(--e1);display:grid;place-items:center;line-height:1;
  transition:transform var(--mo-1) var(--ease)}
#stubBack:active{transform:scale(.9)}
#stubTitle{margin:0;font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.035em}
#stubStage{animation:stageIn var(--mo-3) var(--ease-out) both}

/* The honesty line. A quiet chip, not a shouted caption -- it has to be
   readable without competing with the screen it is labelling. */
.previewBar{
  display:inline-block;margin:0 0 var(--sp-4);padding:4px 10px;
  border-radius:var(--r-full);border:1px solid var(--edge);
  background:color-mix(in srgb, var(--card) 70%, transparent);
  font-size:var(--fs-2xs);font-weight:700;letter-spacing:.02em;color:var(--tx2)}

/* ---------- Rows: the workhorse of every app ---------- */
.shellRow,.idCard,.gpaHead,.feedCard,.statBox{
  background:var(--card);border:1px solid var(--edge);border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-4);margin:0 0 var(--sp-2);box-shadow:var(--e1);
  animation:rowIn var(--mo-3) var(--ease-out) both}
.shellK.hot{color:var(--bad)}
.shellK{font-size:var(--fs-2xs);font-weight:700;color:var(--tx3);margin:0 0 3px;
  letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.shellT{font-size:var(--fs-md);font-weight:650;margin:0;letter-spacing:-.012em}
.shellS{font-size:var(--fs-sm);color:var(--tx2);margin:4px 0 0;line-height:1.45}
.shellRow{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.shellMain{min-width:0;flex:1}
.shellBtns{display:flex;flex-wrap:wrap;gap:6px;flex:none}
#stubStage > .shellBtns{margin:0 0 var(--sp-3)}
.shellBtns button,.shellFab{
  appearance:none;border:1px solid var(--edge);border-radius:var(--r-full);
  padding:7px 12px;font:inherit;font-size:var(--fs-sm);font-weight:650;cursor:pointer;
  background:var(--card2);color:var(--tx);
  transition:transform var(--mo-1) var(--ease),background var(--mo-1) linear}
.shellBtns button:active,.shellFab:active{transform:scale(.94)}
.shellBtns button.on{background:var(--ac);border-color:transparent;color:var(--onac);
  font-family:var(--mono);font-weight:700}
.shellFab{width:100%;margin:var(--sp-3) 0 0;padding:13px;background:var(--ac);
  border-color:transparent;color:var(--onac);font-size:var(--fs-md);font-weight:700;
  box-shadow:var(--e2)}
.shellFab:active{transform:scale(.985)}
/* Continue with Google. Full width, white plate, the real mark on the
   left -- Google's brand rules want their colours on a neutral ground,
   so this one button does not take the theme accent like the others. */
.shellBtns button.gbtn{flex:1 1 100%;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:12px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;
  font-family:inherit;font-size:var(--fs-md);font-weight:600;box-shadow:var(--e1)}
.shellBtns button.gbtn .gmark{flex:none}
.shellFab.ghost{background:var(--card);border-color:var(--edge);color:var(--tx);
  box-shadow:var(--e1)}
.shellFab.danger{background:var(--bad)}

/* Anything that is a number gets the mono treatment. */
.num,.shellNum{font-family:var(--mono);font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}

/* ---------- Forms ---------- */
.dueForm{display:grid;gap:var(--sp-2);margin:var(--sp-4) 0 0}
.dueForm input,.dueForm select,.dueForm textarea{
  appearance:none;width:100%;box-sizing:border-box;padding:11px 13px;
  border:1px solid var(--edge);border-radius:var(--r-sm);
  background:var(--card);color:var(--tx);font:inherit;font-size:var(--fs-md);
  transition:border-color var(--mo-1) linear,box-shadow var(--mo-1) linear}
.dueForm textarea{min-height:84px;resize:vertical;line-height:1.5}
.dueForm input:focus,.dueForm select:focus,.dueForm textarea:focus{
  outline:none;border-color:var(--ac);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--ac) 22%, transparent)}
.dueFormRow{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.dueDone{opacity:.45}

/* ---------- GPA ---------- */
.gpaHead{display:grid;grid-template-columns:1fr auto;align-items:end;
  gap:var(--sp-1) var(--sp-3);padding:var(--sp-4) var(--sp-4) var(--sp-4)}
.gpaHead .n{grid-column:1;font-family:var(--mono);font-size:var(--fs-3xl);font-weight:700;
  letter-spacing:-.05em;line-height:1;margin:2px 0 0}
.gpaHead .shellK{grid-column:1;grid-row:1;margin:0}
.gpaHead .shellS{grid-column:2;grid-row:2;margin:0;text-align:right;
  font-family:var(--mono);font-size:var(--fs-sm)}
.gpaFormRow{display:grid;grid-template-columns:1fr auto;gap:var(--sp-2)}

/* ---------- Hotline ---------- */
a.shellCall{
  flex:none;display:inline-block;padding:8px 15px;border-radius:var(--r-full);
  background:var(--bad);color:#fff;font-size:var(--fs-sm);font-weight:700;
  text-decoration:none;box-shadow:var(--e2);
  transition:transform var(--mo-1) var(--ease)}
a.shellCall:active{transform:scale(.94)}
.shellRow .num.tel{font-size:var(--fs-sm);color:var(--tx2)}

/* ---------- Student ID ---------- */
.idCard{
  position:relative;overflow:hidden;text-align:left;padding:var(--sp-5);
  border:0;color:#fff;box-shadow:var(--e3);
  background:linear-gradient(150deg,#1c3f8f 0%,#0e2456 58%,#0a1c44 100%)}
/* The guilloche wash real cards use, faked with two conic gradients. */
.idCard::before{
  content:"";position:absolute;inset:-40% -10% auto auto;width:260px;height:260px;
  background:conic-gradient(from 210deg, transparent 0 42%, rgba(243,208,106,.16) 50%, transparent 58% 100%);
  border-radius:50%}
.idCard .idHead{display:flex;align-items:center;gap:var(--sp-2);
  font-size:var(--fs-2xs);font-weight:800;letter-spacing:.14em;color:#f3d06a;
  text-transform:uppercase;position:relative}
.idCard .idBody{display:flex;align-items:center;gap:var(--sp-4);
  margin:var(--sp-4) 0 0;position:relative}
.idCard .idPic{flex:none;width:66px;height:82px;border-radius:var(--r-xs);
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
  border:1px solid rgba(243,208,106,.45);display:grid;place-items:center;
  font-size:var(--fs-2xl);font-weight:700;color:#f3d06a;letter-spacing:-.02em}
.idCard .idName{margin:0;font-size:var(--fs-xl);font-weight:700;letter-spacing:-.02em}
.idCard .idFac{margin:3px 0 0;font-size:var(--fs-sm);color:rgba(255,255,255,.72)}
.idCard .idNo{margin:var(--sp-2) 0 0;font-family:var(--mono);font-size:var(--fs-lg);
  font-weight:700;letter-spacing:.14em;color:#f3d06a}
/* The barcode is drawn, not an image -- it is decoration, and it says so. */
.idBar{display:flex;gap:2px;align-items:flex-end;height:34px;margin:var(--sp-4) 0 0;
  position:relative;opacity:.9}
.idBar i{display:block;flex:1;background:#fff;border-radius:1px}
.idFoot{margin:var(--sp-2) 0 0;font-size:var(--fs-2xs);color:rgba(255,255,255,.55);
  letter-spacing:.06em;position:relative}

/* ---------- Segmented control ---------- */
.seg{display:flex;gap:3px;padding:3px;margin:0 0 var(--sp-3);
  background:var(--card2);border:1px solid var(--edge);border-radius:var(--r-full)}
.seg button{flex:1;appearance:none;border:0;border-radius:var(--r-full);padding:8px 6px;
  background:transparent;color:var(--tx2);font:inherit;font-size:var(--fs-sm);
  font-weight:650;cursor:pointer;transition:background var(--mo-2) var(--ease),color var(--mo-2) linear}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--e1)}

/* ---------- Stat tiles ---------- */
.statRow{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin:0 0 var(--sp-2)}
.statBox{margin:0;padding:var(--sp-3);text-align:left}
.statBox .n{font-family:var(--mono);font-size:var(--fs-xl);font-weight:700;
  letter-spacing:-.04em;margin:0;line-height:1.1}
.statBox .k{font-size:var(--fs-2xs);color:var(--tx3);margin:3px 0 0;font-weight:600}
.statBox .n{font-size:var(--fs-lg)}
.shellRow .money{margin-right:var(--sp-2);white-space:nowrap}

/* ---------- Wallet ---------- */
.walletCard{
  border-radius:var(--r-lg);padding:var(--sp-5);margin:0 0 var(--sp-3);color:#fff;
  background:linear-gradient(150deg,var(--ac),var(--ac2));box-shadow:var(--e3);
  animation:rowIn var(--mo-3) var(--ease-out) both}
.walletCard .k{margin:0;font-size:var(--fs-2xs);font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;opacity:.78}
.walletCard .n{margin:var(--sp-2) 0 0;font-family:var(--mono);font-size:var(--fs-3xl);
  font-weight:700;letter-spacing:-.045em;line-height:1}
.walletCard .s{margin:var(--sp-3) 0 0;font-size:var(--fs-sm);opacity:.8;
  font-family:var(--mono);letter-spacing:.06em}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650}
.money.out{color:var(--bad)}
.money.in{color:var(--ok)}

/* ---------- Feed: events, wall, food, ride ---------- */
.feedCard{padding:var(--sp-4)}
.feedTop{display:flex;align-items:center;gap:var(--sp-3);margin:0 0 var(--sp-3)}
.av{flex:none;width:36px;height:36px;border-radius:var(--r-full);display:grid;
  place-items:center;font-size:var(--fs-sm);font-weight:700;color:#fff;
  background:linear-gradient(180deg,var(--ac),var(--ac2))}
.av.anon{background:linear-gradient(180deg,#8f9bb3,#5b6478)}
.feedWho{min-width:0;flex:1}
.feedWho b{display:block;font-size:var(--fs-sm);font-weight:700;letter-spacing:-.01em}
.feedWho span{display:block;font-size:var(--fs-2xs);color:var(--tx3);font-family:var(--mono)}
.feedBody{margin:0;font-size:var(--fs-md);line-height:1.55}
.feedTags{display:flex;flex-wrap:wrap;gap:6px;margin:var(--sp-3) 0 0}
.tag{padding:3px 9px;border-radius:var(--r-full);background:var(--card2);
  border:1px solid var(--edge);font-size:var(--fs-2xs);font-weight:650;color:var(--tx2)}
.tag.hot{background:color-mix(in srgb,var(--bad) 14%,transparent);
  border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}
.tag.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);
  border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.feedActs{display:flex;gap:var(--sp-1);margin:var(--sp-3) 0 0;
  padding:var(--sp-3) 0 0;border-top:1px solid var(--edge)}
.feedActs button{
  appearance:none;flex:1;border:0;border-radius:var(--r-sm);padding:8px 4px;
  background:transparent;color:var(--tx2);font:inherit;font-size:var(--fs-sm);
  font-weight:650;cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:5px;transition:background var(--mo-1) linear,transform var(--mo-1) var(--ease)}
.feedActs button:active{transform:scale(.94)}
.feedActs button.on{color:var(--ac)}
.feedActs button.on.heart{color:var(--bad)}
.feedActs .c{font-family:var(--mono);font-size:var(--fs-xs)}

/* Comments hang off a post, indented under a rule so the thread reads as
   a thread rather than as more posts. */
.cmts{margin:var(--sp-3) 0 0;padding:0 0 0 var(--sp-3);
  border-left:2px solid var(--edge);display:grid;gap:var(--sp-2)}
.cmt{font-size:var(--fs-sm);line-height:1.5;margin:0}
.cmt b{font-weight:700}
.cmt span{color:var(--tx2)}

/* ---------- Chat ---------- */
.chatList{display:grid;gap:var(--sp-2)}
.chatRow{display:flex;align-items:center;gap:var(--sp-3);width:100%;text-align:left;
  appearance:none;border:1px solid var(--edge);border-radius:var(--r-md);
  background:var(--card);color:var(--tx);padding:var(--sp-3);font:inherit;cursor:pointer;
  box-shadow:var(--e1);transition:transform var(--mo-1) var(--ease)}
.chatRow:active{transform:scale(.985)}
.chatRow .t{min-width:0;flex:1}
.chatRow .t b{display:block;font-size:var(--fs-md);font-weight:650;letter-spacing:-.01em}
.chatRow .t span{display:block;font-size:var(--fs-sm);color:var(--tx2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatRow .when{flex:none;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--tx3)}
.unread{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-full);
  background:var(--ac);color:var(--onac);font-family:var(--mono);font-size:var(--fs-2xs);
  font-weight:700;display:grid;place-items:center}
.thread{display:grid;gap:var(--sp-2);margin:0 0 var(--sp-3)}
.bub{max-width:78%;padding:9px 13px;border-radius:var(--r-lg);font-size:var(--fs-md);
  line-height:1.45;animation:rowIn var(--mo-2) var(--ease-out) both}
.bub.them{justify-self:start;background:var(--card);border:1px solid var(--edge);
  border-bottom-left-radius:6px;color:var(--tx)}
.bub.me{justify-self:end;background:var(--ac);color:var(--onac);
  border-bottom-right-radius:6px}
.bubWhen{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--tx3);
