<!DOCTYPE html>
<html lang="zh" class="at-home">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover first, and nothing after it that iOS does not know:
     interactive-widget is a Chrome-only key, and the keyboard is handled by
     visualViewport, so it bought nothing and risked a strict parser throwing
     the whole declaration -- cover included -- away. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#00a0e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket SC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pocket Scientific Calculator</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png" id="touchIcon">
  <script type="module" crossorigin src="./assets/index-BJZIKBhz.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-C5By4Jk7.css">
<script>window.__FORCE_DEMO__ = true;</script>
<script>window.BUILD = "v08193b6b";</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", function(){
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
    .then(function(reg){
    var reloading = false;
    if (navigator.serviceWorker.controller)
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if (reloading) return; reloading = true; location.reload();
      });
    var check = function(){ if (!document.hidden) reg.update().catch(function(){}); };
    document.addEventListener("visibilitychange", check);
    addEventListener("pageshow", check);
    check();
    }).catch(function(){});
});
</script>
</head>
<body class="at-home">

<!-- The springboard. Everything inside is rendered by shell/home.ts; the
     markup here is only the frame it paints into.

     Gone on 2026-08-25, at the owner's request: the profile button that sat
     top-left and the EN/中 button top-right. Search pill is back at the
     bottom (vannyz extra, 2026-08-27). -->
<div id="pocketHome" class="booting">
  <!-- Covers the geometry hold: the springboard is laid out underneath
       at opacity 0 until the viewport stops moving. Painted with the
       crown so the language stays one. -->
  <div id="homeSplash" aria-hidden="true">
    <p id="splashMark" class="splashMark"></p>
  </div>
  <!-- The name of the app, centred on the lid. Painted by shell/home.ts so
       it follows the language like every other label. -->
  <header class="homeCrown">
    <div class="mascot" id="markBox" aria-hidden="true"></div>
    <h1 id="homeTitle"></h1>
  </header>
  <div class="homePager" id="homePager"></div>
  <div class="homeDots" id="homeDots" role="tablist"></div>
  <div id="homeHits" hidden></div>
  <div class="homeSearch" id="homeSearch">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
         stroke-linecap="round" aria-hidden="true">
      <circle cx="10.6" cy="10.6" r="6.4"/><path d="m15.4 15.4 4.6 4.6"/>
    </svg>
    <input id="homeQ" type="search" autocomplete="off" autocapitalize="off"
           spellcheck="false" enterkeyhint="search" aria-label="Search">
    <button type="button" id="homeQx" aria-label="Close">&#10005;</button>
  </div>
  <button type="button" class="homeQPill" id="homeQPill">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" aria-hidden="true">
      <circle cx="10.6" cy="10.6" r="6.4"/><path d="m15.4 15.4 4.6 4.6"/>
    </svg>
    <span id="homeQPillT"></span>
  </button>
</div>

<!-- One pane, reused by every micro-app. The router pushes it in from the
     right and lets the home fall back behind it. -->
<div id="homeStub">
  <div class="stubPane">
    <div class="stubBar">
      <button type="button" id="stubBack" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 5 8 12l7 7"/>
        </svg>
      </button>
      <h2 id="stubTitle"></h2>
    </div>
    <div id="stubStage"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
